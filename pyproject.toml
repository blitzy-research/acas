#  ACAS -- packaging and tooling manifest for the Python 3.12 migration of the
#  COBOL batch posting cycle.
#
#  Purely additive. The COBOL system is the behavioural specification and is
#  frozen: nothing under common/, copybooks/, general/, sales/, purchase/, irs/,
#  stock/ or mysql/ACASDB.sql is built, modified or read from here, and no
#  pre-existing script or configuration file is touched. Any diff touching those
#  paths is a defect in the migration, however harmless it looks.
#
#  What this file decides, and the rule behind each decision:
#    R-1  what is SHIPPED: `acas_posting*` and nothing else, so there is no
#         import path from the distribution to the compiled oracle in harness/.
#    R-2  what may NOT be depended on: pandas, numpy, or anything else computing
#         in binary floating point.
#    R-3  no ORM entity layer, no migration tool, no async/thread/pool library.
#    R-6  determinism: every dependency pinned exactly, interpreter pinned to
#         the 3.12 series.
#
#  Install routes, all with identical pins:
#      pip install -e "."                                shipped runtime only
#      pip install -e ".[harness,dev]"                   everything, unhashed
#      pip install --require-hashes -r requirements.txt  everything, hash-verified
#
#  requirements.txt is ONE file carrying all three sets in three labelled
#  sections. Agent Action Plan section 0.2.1.2 names exactly two dependency
#  artifacts -- this file and `requirements.txt` -- so the three-lock-file layout
#  this project once used added two manifests the plan does not name. The optional
#  -dependency groups below still map one-to-one onto that file's sections.

[build-system]
# setuptools only: no build hook, no C extension, no cobc, no linkage to the
# bridge's cobmysqlapi.o -- R-1 must hold for the build itself, not merely for
# the finished wheel. Pinned exactly rather than as a floor, because the backend
# decides what the wheel contains and is the one component that executes
# arbitrary code during a build. It is absent from [project].dependencies because
# the cycle never imports it; requirements.txt section 3 carries its hashed entry.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acas-posting"                        # import name is `acas_posting`
# The version of THIS migration package. It deliberately does not impersonate
# the COBOL system's own release, which is the maintainer's record in README.TXT
# and Changelog and is not modified here.
version = "0.1.0"
description = "Behaviourally exact Python 3.12 migration of the ACAS COBOL batch posting cycle"
# The migration's own document. README.TXT documents the COBOL system and is
# never edited or repurposed.
readme = "README-python-migration.md"
# Floor and ceiling in one specifier, and correctness rather than conservatism:
# every monetary value passes through decimal.Decimal, so the interpreter must be
# one whose `decimal` is the C _decimal extension and whose ROUND_DOWN store
# truncates toward zero as an un-ROUNDED COBOL store does. 3.13 and newer fall
# outside the range this migration has parity evidence for.
requires-python = "==3.12.*"

# Three PAIRWISE DISJOINT dependency sets, each mirrored by one SECTION of the
# single hashed lock file:
#   [project].dependencies                    -> requirements.txt section 1
#   [project.optional-dependencies].harness    -> requirements.txt section 2
#   [project.optional-dependencies].dev        -> requirements.txt section 3
# The split is mechanical, not a matter of taste: an AST import census over the
# repository records that acas_posting/ imports exactly one third-party top-level
# module, `mysql`, while `yaml` is imported only by the harness scripts and only
# inside the function that reads a scenario file. A version that differs between
# this manifest and the lock file is a defect. Keeping the sets distinct HERE while
# locking them in ONE file loses nothing: `pip install -e ".[harness]"` still
# resolves the harness set alone, and the hashed route installs all three because a
# hashed install is what the container and the parity protocol use, where all three
# are needed anyway.
dependencies = [
    # The ONLY third-party module acas_posting imports. Ships a compiled C
    # extension for CPython 3.12 and materialises DECIMAL as decimal.Decimal.
    "mysql-connector-python==26.7.0",
]

# =============================================================================
#  WHY SQLAlchemy IS NOT IN THAT LIST  (finding MJ-20)
#
#  It used to be, described as "CORE LEVEL ONLY: text() statements on an explicit
#  Connection", together with `greenlet` and `typing_extensions` as its transitive
#  requirements. No module under acas_posting/ ever imported it. The AST import
#  census quoted a dozen lines above -- "acas_posting/ imports exactly one
#  third-party top-level module, `mysql`" -- was therefore TRUE while this very list
#  contradicted it, and re-running that census today still yields exactly `mysql`.
#  A manifest advertising an execution path the code does not take is a defect in
#  its own right: it makes the shipped architecture unauditable from the artifact.
#
#  THE REQUIREMENT PERMITS EITHER, AND THE PLAN NAMES WHICH IS PRIMARY.
#  AAP section 0.8.2 preserves the user requirement verbatim, and it is an
#  either/or: "MySQL access via `mysql-connector-python` OR SQLAlchemy Core with no
#  ORM entity layer". AAP section 0.5.1 then calls mysql-connector-python
#  "Oracle's official MySQL driver and THE PRIMARY DATABASE PATH", and section
#  0.1.2's own diagram labels the edge "SQLAlchemy Core / connector" -- an
#  alternative, not a stack. Shipping the connector alone satisfies the requirement
#  and matches the path the plan calls primary.
#
#  AND THE FROZEN SEMANTICS DECIDE IT. `dal/connection.py` does not merely open a
#  connection; it reproduces the frozen bridges' CONNECTION OWNERSHIP. It re-opens
#  one specific connection object in place (`established.connect(...)`), keeps a
#  single process handle that handlers deliberately share, and lets a handler opt
#  OUT of sharing when the bridge it mirrors keeps its own SQL state across CALLs --
#  `dal/acas016_invoice.py` says so at its own call site: "slinvoiceMT keeps its own
#  SQL state across CALLs. A live handle owned by another bridge is not that state
#  and must not be reused." An Engine owns connection lifecycle by design and has no
#  supported way to re-connect a given connection in place, so routing this through
#  one would mean reimplementing that ownership model on top of an abstraction built
#  to own it, and changing WHICH PHYSICAL SESSION a statement runs on. Under rules
#  R-4 and R-6 that is not a refactor, it is a behavioural risk taken for a claim.
#
#  R-2 loses nothing either: the exact-decimal guarantee is enforced by
#  `AcasConverter` plus a live per-connection probe in `dal/connection.py`, which
#  is driver-level and is what a Core boundary would have had to pass through
#  `connect_args` anyway.
#
#  `greenlet` and `typing_extensions` go with it: `pip show` records them as
#  SQLAlchemy's requirements and nothing else's, mysql-connector-python requires
#  nothing at all, and no file in acas_posting/, tests/ or harness/ imports either.
#  This manifest already admitted the first half of that -- "Nothing here imports
#  greenlet".
#
#  `tests/arithmetic/test_deployment_contract_boundaries.py` now asserts that this
#  list and the AST census agree, in both directions, so the two cannot drift apart
#  again -- which is the root cause of MJ-20 rather than either name in isolation.
# =============================================================================

[project.optional-dependencies]
# The oracle harness reads scenario definitions with PyYAML. Kept out of the
# shipped set because nothing under acas_posting/ imports it.
harness = [
    "PyYAML==6.0.3",
]
# The verification toolchain, kept out of the runtime set so that installing the
# migrated cycle does not drag a test runner in with it.
dev = [
    "pytest==9.1.1",
    # Coverage is traceability evidence that a migrated module was exercised
    # (R-5), never a quality gate -- [tool.coverage.report] sets no fail_under.
    "pytest-cov==7.1.0",
    # Transitive closure of the two above, pinned for reproducibility.
    "coverage==7.15.2",
    "pluggy==1.6.0",
    "iniconfig==2.3.0",
    "packaging==26.2",
    "Pygments==2.20.0",
]
# Defined BY REFERENCE so the two sets can never drift apart.
test = ["acas-posting[dev,harness]"]

#  DELIBERATELY EXCLUDED -- do not add any of the following:
#    * pandas, numpy, or anything else computing in binary floating point (R-2).
#    * an ORM entity layer, or declarative metadata that could emit DDL against
#      the frozen schema; alembic or any other migration tool (R-3).
#    * asyncio helpers, thread pools, connection pools (R-3).
#    * pytest-xdist or any parallel runner: parallel tests against one shared
#      MariaDB would break the seed/run/dump/reset/run/dump/diff protocol (R-3).
#    * pytest-randomly or any plugin that reorders execution: posting order is
#      load-bearing and the state diff is order-sensitive (R-6).
#    * a third-party date library. common/maps04.cbl has a 1600-12-31 epoch and
#      idiosyncratic rejection behaviour that must be reproduced, not improved
#      on (R-4).
#    * cobc, GnuCOBOL bindings, or anything that would put the COBOL toolchain on
#      the shipped package's dependency graph (R-1).

#  No console entry points are declared: `python -m acas_posting` is the
#  documented invocation route - served by acas_posting/__main__.py, which
#  reproduces common/ACAS.cbl's system-selection menu and dispatches the seven
#  cli routes - so [project.scripts] would add surface the Agent Action Plan does
#  not call for. Each route also remains directly runnable as
#  `python -m acas_posting.cli.<module>`, and the two forms return the same
#  status because the router passes the route's value through unchanged.

#  PACKAGING -- an explicit ALLOW-LIST, not a pattern search, so anything not
#  named below is excluded by construction and what ships never depends on what
#  happens to be lying in the checkout (R-1, R-6).
#
#  The generated data dictionary is the one sibling whose CONTENT is shipped, as
#  package data: every record module builds its field descriptors from it during
#  a normal import, so a wheel without it cannot import acas_posting.records at
#  all. The Agent Action Plan fixes its path at data_dictionary/, so the
#  `package-dir` mapping below serves both -- the checkout keeps that path while
#  the wheel carries a copy inside the package, which the loader reaches through
#  importlib.resources and falls back from to the repository sibling. The schema
#  travels with it because the artifact's `meta.schema_ref` names it relatively.
[tool.setuptools]
packages = [
    # The seven code packages; each has an __init__.py and none is a namespace
    # package.
    "acas_posting",
    "acas_posting.cli",
    "acas_posting.cobol",
    "acas_posting.dal",
    "acas_posting.dictionary",
    "acas_posting.programs",
    "acas_posting.records",
    # A DATA DIRECTORY, not an importable package: it holds no Python module and
    # is reached only through importlib.resources, which needs no __init__.py.
    "acas_posting.data_dictionary",
]
# Automatic inclusion is off, so the only non-Python files in the wheel are the
# two named by `package-data`; no stray file in the checkout can reach it.
include-package-data = false

# The one directory mapped from outside the package tree. Every other package
# keeps its natural path, which is why there is no "" entry -- adding one would
# re-root the whole distribution.
[tool.setuptools.package-dir]
"acas_posting.data_dictionary" = "data_dictionary"

# Named file by file rather than as a glob: these two artifacts are the entire
# contents of that directory, and a glob would ship whatever else landed there.
[tool.setuptools.package-data]
"acas_posting.data_dictionary" = [
    "acas_posting_dictionary.json",
    "acas_posting_dictionary.schema.json",
]

#  Test runner. Selection idiom:
#      pytest -m arithmetic                       infrastructure-free
#      pytest -m "scenario or determinism"        needs the harness/ stack
#      pytest -m "not (scenario or determinism)"  everything a bare host can run
#  Execution order is never randomised and never parallelised: posting order is
#  load-bearing in this cycle and the scenario comparison is order-sensitive.
[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# No -n/xdist flag, no --cov-fail-under, no --doctest-modules, and no plugin that
# changes collection or execution order.
addopts = "-ra --strict-markers --strict-config --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "arithmetic: unit-level COBOL-semantics parity test. Imports acas_posting.cobol, acas_posting.records, acas_posting.dictionary and acas_posting.workfiles at module scope. A minority of tests additionally drive one shipped paragraph of acas_posting.programs or one pure function of acas_posting.dal, so that the anomalies rule R-4 requires be LOCKED (A-7, A-8, A-9, A-10, the gl051 control-total gate and the gl071 sort order) are asserted against the code that ships rather than against a re-transcription of it. Those imports happen INSIDE the test body, through importlib.import_module, and the module is purged from sys.modules afterwards, so collection is unaffected and the three import-isolation guards keep passing unchanged. THEY ARE MANDATORY AND NEVER SKIPPED: an earlier revision guarded them with pytest.importorskip, which let a host without the pinned driver report a passing arithmetic tier while those anomaly locks silently vanished; mysql-connector-python is a hard [project.dependencies] entry, so an installed package always satisfies them. Needs NO database, NO COBOL and NO Docker: every assertion runs against in-memory dataclasses and pure functions, so the tier runs anywhere the package itself is installed.",
    "scenario: end-to-end state-parity test asserting an ordering-normalised empty table diff. REQUIRES the harness/ Docker Compose stack (MariaDB 10.11.7 plus the built GnuCOBOL 3.2 oracle) and a seeded database.",
    "determinism: two runs of one scenario under the same pinned clock must produce byte-identical dumps. REQUIRES the harness/ Docker Compose stack.",
    "database: REQUIRES a live MariaDB 10.11.7 instance with mysql/ACASDB.sql applied verbatim.",
    "oracle: REQUIRES the compiled GnuCOBOL 3.2 oracle under harness/ to have been built by harness/build_oracle.sh.",
]
# Third-party warnings keep their default disposition so nothing is masked and no
# behaviour is altered; only DeprecationWarnings raised from inside acas_posting
# are escalated, and later entries take precedence in pytest.
filterwarnings = [
    "default",
    "error::DeprecationWarning:acas_posting",
]
# Keep the collection fallback out of the frozen COBOL tree, the legacy-BASIC
# trees and the build output.
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "common",
    "copybooks",
    "general",
    "sales",
    "purchase",
    "irs",
    "stock",
    "mysql",
    "etc",
    "ACAS-Manuals",
    "payroll",
    "Basic-Code",
    "home",
    "blitzy",
    "harness",
    "build",
    "dist",
    "*.egg-info",
]

#  Coverage -- traceability evidence (R-5), NOT a quality gate. There is
#  deliberately no fail_under and no --cov flag in addopts: a coverage number
#  never decides whether this migration is correct. Only an empty scenario diff
#  against the compiled oracle does.
[tool.coverage.run]
branch = true
source = ["acas_posting"]
# Belt and braces for R-1: the oracle harness is never measured, and never
# imported by the shipped package.
omit = [
    "harness/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
