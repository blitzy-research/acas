  # ---------------------------------------------------------------------------
  # GLPOSTING-REC -- ONE ROW, AND IT IS AN UNCHANGED WITNESS. PHASE 3 DELETES
  # NOTHING, AND THAT WAS MEASURED RATHER THAN PREDICTED.
  #
  # This posting belongs to the closing cycle's batch, so a reading of the source
  # says Phase 3's del-process should delete it. IT DOES NOT, on either side, and
  # the reason is a two-step corruption of the key inside the frozen bridge:
  #
  #   WRITE. The load paragraph does `move WS-Post-Key to HV-POST-KEY`
  #   [common/glpostingMT.cbl:L1054]. WS-Post-Key is a GROUP of two `pic 9(5)`
  #   items [copybooks/wspost.cob:L14-L16] and HV-POST-KEY is `PIC 9(18) COMP`
  #   [common/glpostingMT.cbl:L283], so this is a group move: the digit
  #   CHARACTERS travel, not the number. Batch 1 / post-number 1, which reads
  #   "0000100001", reaches the column as 472328296244457520.
  #
  #   READ. The unload paragraph does the reverse, `move HV-POST-KEY to
  #   WS-Post-Key` [common/glpostingMT.cbl:L1085], so `batch` comes back as five
  #   digits of that large number and NOT as 1.
  #
  #   SKIP. del-process is guarded by `if WS-Post-Key = zero or batch not =
  #   WS-Batch-Nos go to loop`. The key is not zero, but `batch` no longer equals
  #   the batch record's WS-Batch-Nos, so EVERY row is skipped and the delete
  #   walk completes having deleted nothing.
  #
  # MEASURED: one row before the run, one row after, byte-identical on both
  # sides, POST-LEGEND and POST-AMOUNT untouched. Reproduced rather than fixed
  # (rule R-4) -- and now OBSERVED, which is what this scenario is for. Before
  # it existed, "gl080 deletes the cycle's postings" was a claim no test could
  # have contradicted.
  #
  # THE BATCH STAMPING STILL HAPPENS. gl080c performs del-process and then stamps
  # the batch regardless of what the walk found, so cleared-status, stored and
  # batch-start all move on batch 1. The two effects are independent.
  #
  # ANOMALY N-RRN IS WHY THERE IS ONLY ONE POSTING. The load paragraph moves
  # THIRTEEN fields [common/glpostingMT.cbl:L1053-L1066] and never moves
  # `WS-Post-rrn` into `HV-POST-RRN` [common/glpostingMT.cbl:L282], so
  # HV-POST-RRN keeps its initialised zero and every insert writes POST-RRN = 0 --
  # the table's PRIMARY KEY. Two declared postings would collide and only one row
  # would survive the seed, whatever rrn each declared. Reproduced on the migrated
  # side as ANOMALY N-RRN with its companion N-UNLOAD in
  # acas_posting/dal/acas006_gl_posting.py. It is also why every other scenario in
  # this harness seeds a single posting.
  #
  # SELECTIVITY IS PROVEN ON THE BATCH TABLE, where a second row CAN exist: batch
  # 2 of cycle 2 comes back unstamped, which shows the `bcycle not = scycle`
  # filter held. See test_phase_three_stamped_only_the_closing_cycles_batch.
  # ---------------------------------------------------------------------------
  posting.dat:
    - WS-Post-rrn: "1"
      Batch: "1"
      Post-Number: "1"
      Post-Code: "GL"
      Post-Date: "21/09/25"
      Post-DR: "1000"
      DR-PC: "0"
      Post-CR: "2000"
      CR-PC: "0"
      Post-Amount: "1000.00"
      Post-Legend: "Cycle 1, delete walk skips"
      Vat-AC: "2200"
      Vat-PC: "0"
      Post-Vat-Side: "CR"
      Vat-Amount: "200.00"
