# =============================================================================
# SCENARIO -- General Ledger END OF CYCLE, compiled COBOL against migrated Python
#
# This file exists because nothing else in this harness ran gl080. Seven scenarios
# drove the posting cycle, the trading ledgers and the IRS fan-out, and every one of
# them stopped short of the program that ENDS a cycle -- so posting deletion, batch
# stamping, the quarter rollover, the cycle advance and the two anomalies that live
# in that rollover were carried by unit tests alone and by no state comparison at
# all. gl080 is one of the twelve in-scope programs and it owns one of the five
# ROUNDED stores in the whole migration [general/gl080.cbl:L328], so leaving it
# unexercised left the largest single hole in the evidence.
#
# WHAT IT DRIVES. The real route, not a shortcut: gl_end_of_cycle, which is
# general/general.cbl `load09.` (L817-L821) dispatching gl080 through the shared
# four-parameter block `load00.` (L711-L721). Both runners already implemented the
# operation -- acas_plan_gl_end_of_cycle in harness/run_cobol_scenario.sh and the
# gl_end_of_cycle row of ACAS_PY_OPERATION_MAP in harness/run_python_scenario.sh --
# so what was missing was never runner support. It was a scenario.
#
# NOTHING HERE DEFINES OR ALTERS THE SCHEMA (rule R-3). affected_tables SELECTS
# from the 33 frozen tables of mysql/ACASDB.sql; it never adds a table, a column,
# an index or a constraint. operations is a strictly ordered list and its steps run
# one at a time, matching the single-threaded COBOL.
#
# THE LEGACY DEFECTS ARE THE POINT, NOT AN EMBARRASSMENT (rule R-4). The seed below
# is engineered so that TWO recorded anomalies become visible in TABLE STATE rather
# than only in a unit test: A-3, the two disagreeing notions of "current quarter"
# inside gl080, and N-EDIT, the bridge's structural inability to render a minus
# sign. See "THE ANOMALY THIS SCENARIO MAKES VISIBLE" below and the note above
# ledger.dat. A seed tidied up to make the numbers agree would defeat this file's
# purpose: a defect reproduced is correct, a defect fixed is a failure.
#
# KEYS APPEAR IN A FIXED ORDER, identically in all nine scenario files, and the file
# is UTF-8, ASCII-only, LF-terminated, two-space indented and free of tabs. It
# carries no wall-clock reading, no host identity, no process id, no random value
# and no absolute host path, so two captures of one scenario are byte-identical
# (rule R-6).
# =============================================================================

name: end_of_cycle_gl

description: |
  THE ROUTE, AND WHY IT REACHES PHASE 5

  gl080 is five labelled phases that do not execute in their labelled order, and
  reaching the last of them takes four separate conditions. Each is pinned here
  deliberately, because a scenario that fell out of the program early would look
  exactly like a passing scenario while proving almost nothing.

  ONE -- THE BACKUP GATE MUST BE PASSED. gl080 opens by displaying GL085, GL086
  and GL087 and accepting a reply [general/gl080.cbl:L295-L302]. Escape, "A" or
  "a" means goback and gl080 writes NOTHING AT ALL. Any other keystroke proceeds,
  and the statement immediately before the accept is `move space to keyed-reply`,
  so the harness sends a bare Return to reproduce the program's own default rather
  than to type a letter the program never tests. gl080_proceed is "Y" below.

  TWO -- PHASE 1 MUST NOT FIND AN UNFINISHED BATCH. gl080a walks the batch file,
  skips every record whose bcycle differs from scycle, and sets a to 1 for any
  survivor that is `not status-closed and not processed`
  [general/gl080.cbl:L368-L392]. If a comes back 1, gl080 displays GL088 and GL012
  and goes to main-end -- no deletion, no stamping, no rollover. So batch 1 below
  is seeded CLOSED and PROCESSED. Batch 2 is seeded OPEN and WAITING on purpose,
  in a different cycle, to prove the cycle filter is what protects the run rather
  than luck; if the filter were dropped, a would become 1 and this scenario would
  produce an entirely different -- and visibly different -- state.

  THREE -- THE ARCHIVING SWITCH SELECTS PHASE 3, NOT PHASE 2. `if archiving`
  [general/gl080.cbl:L315] picks Transaction Archiving; anything else picks
  Transaction Deletion. The switch is `Arch pic x` with `88 Archiving value "Y"`
  [copybooks/wssystem.cob:L164-L165], and Arch is seeded to a space, so this
  scenario takes Phase 3. That is the deliberate choice: Phase 2 writes to a
  SEQUENTIAL ARCHIVE FILE outside the schema, whose content no table dump can
  observe, so an archiving run would move the evidence out of reach of the very
  comparison this file exists to make.

  FOUR -- THE PERIOD BOUNDARY MUST FALL EXACTLY HERE. After the deletion walk,
  gl080 tests `if a = 9 or scycle < period go to main-end`, then computes the
  quarter subscript and re-multiplies it:
      divide   scycle by period giving a rounded      [general/gl080.cbl:L328]
      multiply a  by  period  giving  y               [general/gl080.cbl:L329]
      if       scycle not = y  go to main-end
  Only an exact multiple survives that test. With period 1 and cyclea 1, a is 1
  and y is 1, so scycle equals y and Phase 5 runs. The divide at L328 is ONE OF
  THE FIVE ROUNDED STORES IN THE ENTIRE MIGRATION -- the others are
  [general/gl051.cbl:L791], [general/gl051.cbl:L796], [irs/irs030.cbl:L1551] and
  [irs/irs030.cbl:L1562] -- and it is the only one of the five that a scenario can
  reach, because the other four are inside VAT computations whose results land in
  tables these General Ledger routes never touch.

  PHASE 4 IS SKIPPED, AND THAT IS FROZEN BEHAVIOUR RATHER THAN A CHOICE
  compress-post opens with `if not FS-Cobol-Files-Used go to main-exit`
  [general/gl080.cbl:L637 and the lines above it]. file_system_used is 1 here, as
  in every scenario in this harness, so Posting Contraction returns immediately.
  Worth stating explicitly because the section it skips contains a `stop run` on a
  record-length mismatch, and a reader who assumed Phase 4 executed would expect
  a work file this run never opens.

  WHAT PHASE 3 DOES TO THE TABLES -- AND THE ONE THING IT DOES NOT DO
  For each batch whose bcycle equals scycle, gl080c performs del-process and then
  stamps the batch:
      move     2         to  cleared-status      -> 88 Archived
      move     run-date  to  stored
      move     zero      to  batch-start
      perform  GL-Batch-Rewrite
  The stamping happens, and it is observable: batch 1 comes back cleared-status 2,
  stored = the pinned run date, batch-start 0, while batch 2 of cycle 2 comes back
  exactly as seeded. That contrast is what proves the `bcycle not = scycle` filter
  held rather than luck.

  THE POSTING DELETION DOES NOT HAPPEN, AND THIS SCENARIO IS WHAT ESTABLISHED
  THAT. del-process walks the posting file guarded by `if WS-Post-Key = zero or
  batch not = WS-Batch-Nos go to loop`, and in the RDB configuration that guard
  skips EVERY row -- because the bridge corrupts the key on the way in and back
  out again. The full chain is set out above posting.dat below; in short,
  `move WS-Post-Key to HV-POST-KEY` [common/glpostingMT.cbl:L1054] is a GROUP move
  into `PIC 9(18) COMP`, so the digit characters travel rather than the number, and
  the reverse move on read [common/glpostingMT.cbl:L1085] hands back a `batch` that
  no longer equals the batch record's WS-Batch-Nos. MEASURED: one posting row
  before the run, one after, byte-identical on both sides.

  That is reproduced and not fixed (rule R-4), and it is exactly the kind of claim
  a state comparison exists to test. "gl080 deletes the cycle's postings" was true
  of the source and false of the system, and no arithmetic test could have caught
  the difference.

  WHAT PHASE 5 DOES TO THE TABLES
  Phase 5 walks the WHOLE nominal ledger with no cycle filter
  [general/gl080.cbl:L337-L352]:
      move     ledger-balance  to  ledger-q (a)
      if       current-quarter = 4
               move  ledger-balance  to  ledger-last
      perform  GL-Nominal-Rewrite
  then advances the counter and wraps it:
      add      1  to  current-quarter
      if       current-quarter = 5
               move  1  to  current-quarter
  `Ledger-Q pic s9(8)v99 comp-3 occurs 4` redefines Ledger-Q1 through Ledger-Q4
  [copybooks/wsledger.cob:L30-L36], so `ledger-q (a)` with a = 1 writes Q1 and
  leaves Q2, Q3 and Q4 alone. The three ledger rows below are therefore seeded
  with FOUR DISTINCT non-zero quarter values each, so that "Q1 changed and the
  other three did not" is a fact the diff can state rather than an inference.

  THE ANOMALY THIS SCENARIO MAKES VISIBLE
  Anomaly A-3 of docs/migration/anomaly-log.md is that gl080 carries two
  disagreeing notions of the current quarter: the subscript a, computed by the
  divide at [general/gl080.cbl:L328], and the independent rotating counter
  current-quarter at [general/gl080.cbl:L345-L357]. Nothing reconciles them.
  Until now that was asserted only in an arithmetic test. Here it is seeded to be
  observable: current-quarter is 4 while a computes to 1. The consequence in table
  state is that EVERY ledger row gets its balance written into Q1 -- because the
  subscript says 1 -- and ALSO into Ledger-Last -- because the counter says 4 --
  and Q4, which the counter names, is left untouched. A migration that had
  "helpfully" used one value for both would write Q4 and not Q1, or would not
  write Ledger-Last at all, and either mistake is now a table difference rather
  than a reading of the source. The counter then rolls 4 -> 5 -> 1, so SYSTEM-REC
  ends with current-quarter 1, which is only observable because SYSTEM-REC is in
  the affected-table list.

  gl080 NEVER WRITES SYSTEM-REC ITSELF, AND THAT IS WHY SYSTEM-REC IS LISTED
  gl080 ends at `main-end. goback.` and contains no System facade verb -- the same
  is true of all twelve in-scope programs. scycle and current-quarter live in the
  LINKAGE system record, and what persists them is the menu exit
  [general/general.cbl:L656-L692], which rewrites keys 1, 2 and 4. The headless
  Python route has no menu and reproduces that paragraph directly as
  args.overrewrite, performed from the `> 7` arm of load00 in
  acas_posting/cli/gl_end_of_cycle.py. So both sides persist, and the cycle
  advance from 1 to 2 and the quarter wrap from 4 to 1 are comparable -- but ONLY
  because SYSTEM-REC appears below. With it omitted, as it was in all eight
  earlier scenarios, the entire observable result of Phase 5's counter arithmetic
  would leave no trace in the comparison.

  SYSDEFLT-REC IS LISTED; SYSTOT-REC IS NOT
  The General menu is the only one of the four that rewrites key 2, so
  SYSDEFLT-REC belongs here and in the other General scenarios and nowhere else.
  It is measured comparable. SYSTOT-REC is excluded for a reason that is a
  property of the frozen code rather than a tolerance: the menu loads
  System-Record-4 from the COBOL FLAT FILE alone [general/general.cbl:L402-L404],
  the RDB read that would have accompanied it being COMMENTED OUT at
  [general/general.cbl:L434-L436], and then rewrites that flat-sourced copy into
  the RDB on the way out [general/general.cbl:L667-L669]. This harness seeds only
  the RDB, and sys4LD stamps 1 into all four spare fields whenever every real
  total is zero -- "See if we have an empty record, lets make sure it is
  initialised" at [common/sys4LD.cbl:L368-L390] -- so the seeded 1.00 is returned
  to 0.00 by the menu and by nothing that was migrated. Measured: exactly
  SL4-SPARE1 through SL4-SPARE4 differ and no other column. Nothing in scope is
  hidden by the exclusion, because all nine period-total write sites belong to the
  Sales and Purchase programs and none of them runs here.

  THE COMPARISON HAS NO IGNORE-LIST
  harness/diff_states.py is required to carry no ignore-list, no tolerance list
  and no known-difference allowance, so the comparison is bounded by the
  affected-table list below, which is this scenario's DECLARED EFFECT; the
  comparison itself is bounded by all 22 in-scope tables. That is why an exclusion is
  argued in this file, at length, rather than configured in the differ.

  EXPECTED EFFECT AND STATUS
  expected_table_effect is `changed`: this is the only General Ledger scenario in
  which the ledger table is rewritten, and three of the five listed tables change.
  expected_status is [0]: gl080 sets no term code at all, which is why the
  gl_end_of_cycle route -- unlike gl_post_cycle -- has no term-code gate between
  its steps.

