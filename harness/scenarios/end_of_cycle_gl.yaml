# "Y" proceeds past the GL085/GL086/GL087 backup gate; "A" would abort before any
# write of any kind [general/gl080.cbl:L295-L302].
gl080_proceed: "Y"

# The disk-change option [general/gl080.cbl:L545]. It is reached only on the
# ARCHIVING path, which Arch = space excludes here, so this value is declared for
# completeness of the contract rather than because this run consults it. "0" is the
# proceed answer.
disk_change_option: "0"

affected_tables:
  - GLBATCH-REC
  - GLLEDGER-REC
  - GLPOSTING-REC
  - SYSDEFLT-REC
  - SYSTEM-REC

seed_records:
  # ---------------------------------------------------------------------------
  # rrn 1 -> SYSTEM-REC via systemLD. Current-Quarter is the field that makes
  # anomaly A-3 observable: 4 here against a subscript that computes to 1.
  # Arch is a SPACE, which is what selects Phase 3 over Phase 2.
  # ---------------------------------------------------------------------------
  system.dat:
    "1":
      - System-Record-Version-Prime: "3"
        System-Record-Version-Secondary: "2"
        Vat-Rate-1: "20.00"
        Vat-Rate-2: "5.00"
        Vat-Rate-3: "0.00"
        Cyclea: "1"
        Period: "1"
        Current-Quarter: "4"
        Arch: " "
        Run-Date: "155127"
        File-System-Used: "1"
        Date-Form: "1"
        IRS-Instead: " "
        SL-Autogen: " "
        PL-Autogen: " "
        S-Flag-P: "2"
        P-Flag-P: "2"
        Pass-Value: "0"
        Level-1: "1"
        Level-2: "1"
        Level-3: "1"
        Level-4: "1"
    "2": {}
    "3": {}
    # The period-totals record. No operation on this route writes a period total --
    # all nine sites are in the Sales and Purchase programs -- so the sixteen
    # monetary totals stay zero, which is this route's honest pre-state.
    #
    # THE FOUR SPARE FIELDS ARE DECLARED AS 1.00 BECAUSE THE FROZEN LOADER WRITES
    # THAT, NOT BECAUSE THIS SCENARIO WANTS IT. [common/sys4LD.cbl:L369-L390]: when
    # ALL SIXTEEN monetary totals are zero -- exactly the pre-state above -- sys4LD
    # performs `initialise System-Record-4 with filler' and then
    # `move 1 to sl4-spare1 sl4-spare2 sl4-spare3 sl4-spare4', with the maintainer's
    # own `*> Should not be needed but ..' beside it, so it stamps 1.00 into
    # SYSTOT-REC's four spare columns whatever this flat file says. Leaving them
    # undeclared makes the SEED internally inconsistent -- flat file 0.00, RDB 1.00
    # -- and ACAS is a DUAL STORE whose two cycles read different halves of it: the
    # frozen menu reads key 4 from the COBOL flat file
    # [general/general.cbl:L399-L405] and propagates it to the RDB in `overrewrite.'
    # [general/general.cbl:L656-L672], while the migrated cycle has no flat-file
    # store at all (rule R-1) and preserves the RDB's 1.00. Declaring the value here
    # fixes the SEED and neither cycle (rules R-3, R-4). Filed as ambiguity
    # `Q-SYS4-SPARE-SENTINEL` in docs/migration/ambiguity-resolutions.md.
    "4":
      sl4-spare1: "1.00"
      sl4-spare2: "1.00"
      sl4-spare3: "1.00"
      sl4-spare4: "1.00"

  # ---------------------------------------------------------------------------
  # GLLEDGER-REC. Every row is rewritten by Phase 5, so each carries a DISTINCT
  # balance and four DISTINCT pre-set quarters: after the run, Q1 must equal the
  # balance, Ledger-Last must equal the balance, and Q2/Q3/Q4 must be exactly
  # what they were.
  #
  # ACCOUNT 2000 IS SEEDED NEGATIVE, AND IT DOES NOT STAY NEGATIVE. That is
  # ANOMALY N-EDIT, reproduced rather than corrected (rule R-4), and this is the
  # only scenario in the harness that makes it visible in table state. Every
  # bridge renders a signed decimal by MOVEing the host variable into
  # `01 WS-MYSQL-EDIT PIC -Z(18)9.9(9).` [common/nominalMT.cbl:L232] and then
  # slicing digit windows out of it -- `TRIM (WS-MYSQL-EDIT(13:08))` for the
  # integer part and `WS-MYSQL-EDIT(22:02)` for the pence
  # [common/nominalMT.cbl:L1074-L1086]. The sign occupies POSITION 1 and every
  # window starts at position 3 or later, so the sign is structurally
  # unreachable: -2500.00 reaches LEDGER-BALANCE as 2500.00. It is not a column
  # or copybook narrowing -- `Ledger-Balance pic s9(8)v99 comp-3`
  # [copybooks/wsledger.cob:L28], `HV-LEDGER-BALANCE PIC S9(08)V9(02) COMP`
  # [common/nominalMT.cbl:L300] and `LEDGER-BALANCE decimal(10,2)` are ALL
  # signed. The loss happens in the SQL text, before any statement executes,
  # which is the same class as AAP section 0.6.7 entry 11.
  # The migrated side reproduces it deliberately: see
  # EDIT_FIELD_SIGN_IS_NEVER_RENDERED in acas_posting/dal/acas005_gl_nominal.py
  # and its twin in acas_posting/dal/acas006_gl_posting.py. So this row is a
  # standing check that the reproduction is still in force -- a "helpful" fix
  # that preserved the sign would make the two sides differ here and the diff
  # would report it.
  # ---------------------------------------------------------------------------
  ledger.dat:
    - WS-Ledger-Nos: "1000"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "Bank current account"
      Ledger-Balance: "1500.00"
      Ledger-Last: "10.00"
      Ledger-Q1: "11.00"
      Ledger-Q2: "22.00"
      Ledger-Q3: "33.00"
      Ledger-Q4: "44.00"
    - WS-Ledger-Nos: "2000"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "Sales revenue"
      Ledger-Balance: "-2500.00"
      Ledger-Last: "20.00"
      Ledger-Q1: "111.00"
      Ledger-Q2: "222.00"
      Ledger-Q3: "333.00"
      Ledger-Q4: "444.00"
    - WS-Ledger-Nos: "2200"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "VAT control"
      Ledger-Balance: "375.50"
      Ledger-Last: "30.00"
      Ledger-Q1: "1111.00"
      Ledger-Q2: "2222.00"
      Ledger-Q3: "3333.00"
      Ledger-Q4: "4444.00"

  # ---------------------------------------------------------------------------
  # GLBATCH-REC. Batch 1 is in the cycle being closed and is CLOSED and
  # PROCESSED, which is what lets Phase 1 pass. Batch 2 is OPEN and WAITING in
  # cycle 2: it must survive untouched, which proves that the `bcycle not =
