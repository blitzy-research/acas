    - analysis.dat
    - value.dat
    - purchled.dat
    - pinvoice.dat
    - openitm5.dat

# Flat mirrors of the seed block, required by the seeder, which also resolves a
# relative directory against the directory holding this file. The order here is
# membership only: the frozen loader order of [common/masterLD.sh:L93-L116] is
# what actually runs, with the system block first.
seed_dir: clean_batch_pl
seed_files:
  - system.dat
  - analysis.dat
  - value.dat
  - purchled.dat
  - pinvoice.dat
  - openitm5.dat

# The operations this scenario runs, in order. The Python runner reads this key
# as a flat sequence of operation NAMES and prefers it over the singular
# "operation:" key above, so the sequence holds names and nothing else; the
# oracle-side runner reads the singular key, which names the same operation, so
# both runners resolve the same single operation from this one file. The
# subsystem each name belongs to is not restated per item: each runner owns the
# operation-to-subsystem map, and this scenario's subsystem is stated once at
# top level above. One operation, run once, sequentially (R-3) -- and that one
# operation covers both programs, because load08 dispatches pl055 and pl060
# from a single menu selection [purchase/purchase.cbl:L752-L762].
operations:
  - pl_order_post

# The process status the operation is expected to end with, positionally. The
# Purchase route has NO gate between its two programs, the whole paragraph being
# [purchase/purchase.cbl:L752-L762], so zero does not mean a gate was passed --
# it means neither pl055 nor pl060 raised a terminate code, and with
# file_system_used at one the only raise either of them has is unreachable
# [purchase/pl055.cbl:L266], [purchase/pl055.cbl:L286]. A status that
# contradicts this is reported as a behavioural difference and the capture is
# still taken, so the table diff can corroborate it (R-4).
expected_table_effect: changed

expected_status:
  - 0

# No answer key is declared, because this route promotes none. pl060's
# confirmation prompt is COMMENTED OUT IN THE FROZEN SOURCE -- paragraph
# acpt-xrply [purchase/pl060.cbl:L362] with every one of its lines dead at
# [purchase/pl060.cbl:L363-L370] -- so there is nothing to answer and no
# default to preserve. What survives it is unconditional: the flags set
# immediately after at [purchase/pl060.cbl:L373-L375], P-Flag-I to two,
# P-Flag-A to one and Oi-5-Flag to "Y", whose fields are
# [copybooks/wssystem.cob:L204-L206] and [copybooks/wssystem.cob:L221].
# The four keys the runners do recognise -- irs_clear_postings,
# payment_post_confirm, gl080_proceed and disk_change_option -- belong to the
# IRS, payment and end-of-cycle routes; payment_post_confirm in particular is
# required for pl_payment_post and prompted at [purchase/pl100.cbl:L302-L311],
# which is a different operation. Leaving all four unstated is what keeps this
# scenario's inputs exactly the inputs the frozen cycle takes.

# WHAT `affected_tables` IS, AND WHAT IT IS NOT
#
# It is the DECLARED EFFECT of this scenario: the tables the runners assert
# changed or unchanged against `expected_table_effect`, in the order declared.
#
# It is NOT the bound of the comparison. The capture and the diff are bounded by
# ALL 22 IN-SCOPE TABLES -- `harness/dump_tables.py --all-in-scope` at stages 3
# and 7 and `harness/diff_states.py --all-in-scope` at stage 10, which
# both a hand-driven run and `tests/conftest.py` pass. A bound drawn from
# what a scenario EXPECTS to move cannot show a difference in anything it did not
# expect to move, and an empty diff is the single pass condition (AAP section
# 0.8.5). In particular both cycles perform the menu's own `overrewrite.'
# [general/general.cbl:L656-L672], which rewrites SYSTEM-REC under key 1,
# SYSDEFLT-REC under key 2 and SYSTOT-REC under key 4 -- reproduced by
# `acas_posting/cli/args.py::overrewrite' -- so those rows are compared on both
# sides rather than omitted.
affected_tables:
  - ANALYSIS-REC
  - GLBATCH-REC
  - GLPOSTING-REC
  - PSIRSPOST-REC
  - PUINV-LINES-REC
  - PUINVOICE-REC
  - PUITM5-REC
  - PULEDGER-REC
  - SYSTEM-REC
  - SYSTOT-REC
  - VALUEANAL-REC

# =============================================================================
# THE SEED RECORDS
# =============================================================================
# Built into the declared flat files by harness/dump_tables.py --make-fixtures, which generates a
# COBOL writer per file, compiles it against the FROZEN copybooks and calls the
# FROZEN handler to write. Field names are spelled exactly as the frozen copybook
# spells them, and the builder reads them from the frozen definitions itself, so a
# name this file gets wrong is a refusal and never a silent no-op.
#
# EVERY VALUE IS A QUOTED STRING (rule R-2). COBOL's own MOVE performs the store,
# so the frozen picture clause decides alignment on the implied decimal point,
# truncation toward zero and sign placement.
#
# THE PURCHASE RECORD IS NOT THE SALES RECORD, and the differences below are read
# from the frozen copybooks rather than assumed by symmetry:
#   * The supplier record has NO late-charge, dunning or e-mail flags at all; it has
#     Purch-Notes-Tag, Purch-Accountno and Purch-SortCode instead, and its credit
#     term is COMP rather than the Sales side's two DISPLAY digits
#     [copybooks/wspl.cob].
#   * The invoice line description is x(24) here against x(32) on the Sales side,
#     and there is no back-order byte [copybooks/plwspinv2.cob:L56-L70].
#   * The invoice header has ONE status byte and NOT the five the Sales header
#     carries [copybooks/plwspinv2.cob:L40-L43].
#   * THE FILTERS ARE ASYMMETRIC, and this is the load-bearing one: pl055 tests
#     only if ih-analyised and applied [purchase/pl055.cbl:L363-L364]. It has NO
#     proforma filter and NO pending filter, so a type-four row here is PROCESSED
#     where its Sales counterpart would be skipped [sales/sl055.cbl:L430-L431]. The
#     seed therefore does NOT carry a proforma on this side: including one would
#     quietly change what the scenario measures, and the asymmetry is preserved
#     rather than harmonised (rule R-4).
#   * The layout the builder uses for pinvoice.dat is [copybooks/plwspinv2.cob],
#     the view pl055 itself copies, and not the handler's own linkage copybook --
#     see the SEED_FILES note in harness/dump_tables.py --make-fixtures for why the two differ
#     and how the substitution is proved storage-compatible.
#
# WHAT THIS SEED HAS TO ACHIEVE: analysis and value records covering every code the
# lines reference AND both halves of each split code, because pl055 re-reads with
# va-second blanked [purchase/pl055.cbl:L340-L347]; ONE SUPPLIER carrying TWO
# INVOICES AND ONE CREDIT NOTE so that both Purchase average blocks are reached
# [purchase/pl060.cbl:L745], [purchase/pl060.cbl:L751], [purchase/pl060.cbl:L760],
# [purchase/pl060.cbl:L766] and the A-9 mirror's missing increment is observable;
# a NON-ZERO activity count and average so the guard reconstitutes rather than
# zeroes; amounts with NON-ZERO PENCE so the zero-decimal accumulator actually
# discards something; and at least one OPEN credit note in the transfer file so the
# eighth period total is non-zero and the suppressed second apportionment pass is
# exercised.
seed_records:

  # Key 1 is the only system row the frozen code reads [common/acas000.cbl].
  # File-System-Used one keeps the run on MySQL [copybooks/wssystem.cob:L111-L115].
  # system.dat IS FOUR DIFFERENT RECORDS IN ONE RELATIVE FILE, keyed by relative
  # record number -- [copybooks/selsys.cob] declares it ORGANIZATION RELATIVE with
  # relative key `rrn', and the four system loaders each go straight to one slot:
  #   "1"  systemLD [common/systemLD.cbl:L227] -> SYSTEM-REC    (the parameter record)
  #   "2"  dfltLD   [common/dfltLD.cbl:L221]   -> SYSDEFLT-REC  (wsdflt.cob)
  #   "3"  finalLD  [common/finalLD.cbl:L221]  -> SYSFINAL-REC  (wsfinal.cob)
  #   "4"  sys4LD   [common/sys4LD.cbl:L226]   -> SYSTOT-REC    (wssys4.cob)
  # All four are 1024 bytes, which is why one relative file can hold them, and ALL
  # FOUR MUST BE PRESENT: masterLD runs every one of those loaders unconditionally
  # [common/masterLD.sh:L50-L88] and the last is tested against zero rather than 63
  # [common/masterLD.sh:L83-L86], so an unwritten slot ABORTS the seed. A slot with
  # nothing to pin is declared as {} and written INITIALIZEd -- which is a statement
  # about the pre-state rather than an omission.
  system.dat:
    "1":
      - System-Record-Version-Prime: "3"
        System-Record-Version-Secondary: "2"
