  to_day: "21/09/2025"
  run_date: 155127

# Flat mirrors of the clock block, required by the oracle-side runner, which
# reads top-level keys only. The text is passed through unchanged; its digits
# are never reordered to match date_form.
run_date_text: "21/09/2025"
run_date_binary: 155127

system:
  file_system_used: 1
  cyclea: 1
  period: 1
  date_form: 1
  irs_instead: " "
  sl_autogen: " "
  pl_autogen: " "
  s_flag_p: 2
  p_flag_p: 2

# Flat mirrors of the two system values the COBOL runner reads directly. The
# fan-out switch must be PRESENT even though its value is a space: that space
# is what selects the General Ledger alone [copybooks/wssystem.cob:L179-L181]
# and what makes anomaly A-1 observable at all.
