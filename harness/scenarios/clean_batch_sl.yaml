# =============================================================================
# ACAS -- COBOL to Python migration of the batch posting cycle.
#
# SCENARIO clean_batch_sl -- the reference happy path of the SALES invoice
# posting route, and one half of the anomaly A-1 evidence pair. Its shape is
# the canonical shape of harness/scenarios/clean_batch_gl.yaml, replicated key
# for key and in the same order, and its control is
# harness/scenarios/clean_batch_pl.yaml: the two scenarios differ only in the
# subsystem they drive, which is exactly what turns ONE MISSING TERMINATING
# PERIOD at [sales/sl060.cbl:L1176] into an observable behavioural difference
# rather than a reading of the source. The nine scenarios the protocol
# expects, per Agent Action Plan section 0.8.5 and
# [harness/docker-compose.yml "STAGES."], are: clean_batch_gl, clean_batch_sl,
# clean_batch_pl, clean_batch_irs, mixed_accepted_rejected, period_end_totals,
# control_total_mismatch, empty_batch.
#
# THIS FILE IS INERT DATA (rule R-1, no COBOL at runtime). It carries no shell
# command, no compiler invocation, no Python expression, no non-standard YAML
# tag, no command template, no interpolation and no path into a build tree:
# both runners read it with yaml.safe_load or with a plain top-level scalar
# reader, and the file only DESCRIBES the inputs -- the runner scripts are the
# only things that act on them. Nothing else belongs in this directory either:
# the harness tree is never on the package import path (Agent Action Plan
# section 0.3.1), so there is no __init__.py here.
#
# NO ACCOUNTING VALUE APPEARS AS A YAML SCALAR ANYWHERE IN THIS FILE (rule
# R-2, zero binary floating point). YAML parses a bare decimal literal as a
# binary float, so every money and quantity figure lives in the seeded flat
# files as decimal text in the frozen record layout, never here. Only these
# keys hold bare integers, and each one is a whole-number COBOL field:
# run_date, run_date_binary, cyclea, period, date_form, file_system_used,
# s_flag_p, p_flag_p and expected_status. There is no scientific notation and
# no infinity or not-a-number token in this file, and the Python-side reader
# refuses a real number outright rather than tolerating one.
#
# NOTHING HERE DEFINES OR ALTERS THE SCHEMA (rule R-3). affected_tables
# SELECTS from the 33 frozen tables of mysql/ACASDB.sql; it never adds a
# table, a column, an index or a constraint. operations is a strictly ordered
# list and its steps run one at a time, matching the single-threaded COBOL.
#
# KEYS APPEAR IN A FIXED ORDER, identically in all nine scenario files, and
# the file is UTF-8, ASCII-only, LF-terminated, two-space indented and free of
# tabs. It carries no wall-clock reading, no host identity, no process id, no
# random value and no absolute host path, so two captures of one scenario are
# byte-identical (rule R-6).
# =============================================================================

name: clean_batch_sl

description: |
  PURPOSE
  One clean batch of Sales invoices and credit notes is extracted and analysed
  by sl055 and then posted by sl060, in PURE GENERAL LEDGER MODE, and the
  resulting state of the ten declared tables must match the compiled COBOL
  oracle byte for byte after normalisation. This is the reference happy path
  of the Sales route: nothing is rejected, nothing aborts, and the empty
  normalised diff is the only pass condition.
  It is also the EVIDENCE HALF of the anomaly A-1 pair. A-1 is only visible
  when the fan-out switch selects the General Ledger alone, so this file pins
  that switch to a space and declares GLPOSTING-REC among its tables; the
  Purchase scenario harness/scenarios/clean_batch_pl.yaml runs the mirrored
  route whose source HAS the terminating period the Sales source is missing,
  and the difference between the two captures is the anomaly. The divergence
  is PRESERVED, never normalised (rule R-4).

  PYTHON MODULES EXERCISED (rule R-5, full traceability)
    acas_posting/programs/sl055_invoice_extract_analysis.py  from sales/sl055.cbl
    acas_posting/programs/sl060_invoice_posting.py           from sales/sl060.cbl
  driven by acas_posting/cli/sl_invoice_post.py, which reproduces the menu's
  own dispatch paragraph load07 [sales/sales.cbl:L756-L768]. The oracle-side
  runner resolves the same operation name to the same paragraph through the
  menu letter G [sales/sales.cbl:L545], so both sides run the same two
  programs in the same order from this one declaration.

  THE ROUTE IS load07, AND IT IS NOT load08
  The Sales menu's posting paragraph is load07 [sales/sales.cbl:L756], and the
  maintainer's own inline comment there reads: Sales trans posting. It
  dispatches, in this order: sl830 [sales/sales.cbl:L759], then perform load00
  [sales/sales.cbl:L760], then a gate [sales/sales.cbl:L761-L762], then sl055
  [sales/sales.cbl:L763], then perform load000 [sales/sales.cbl:L764], then
  the SAME gate again [sales/sales.cbl:L765-L766], then sl060
  [sales/sales.cbl:L767] and finally go to load000 [sales/sales.cbl:L768].
  load08 [sales/sales.cbl:L770] is a DIFFERENT and out-of-scope route -- it
  dispatches sl080, Payment Input -- and is named here only so that no reader
  cross-checking the menu concludes this file drives it. Note also that the
  Purchase mirror is load08 in ITS menu and not load07
  [purchase/purchase.cbl:L752-L762]; the paragraph numbering does not
  correspond between the two menus and is preserved as found.
  The two dispatch helpers differ in a way that matters to the linkage shape
  the migrated entry point must reproduce. load00 [sales/sales.cbl:L677]
  zeroes the terminate code [sales/sales.cbl:L680] and issues a FOUR-parameter
  call [sales/sales.cbl:L681-L685]. load000 [sales/sales.cbl:L698] issues a
  FIVE-parameter call [sales/sales.cbl:L702-L707] -- ws-calling-data,
  System-Record, WS-System-Record-4, to-day, file-defs -- which is the shape
  sl055 and sl060 take, and it is the fourth of those parameters, the totals
  record, that carries the period totals discussed below.

  THE PINNED CLOCK -- TWO OBSERVABLES, NEVER A HOST READING
  clock.to_day pins the text date as the menu's to-day pic x(10) holds it, in
  DD/MM/CCYY form, and clock.run_date pins the binary Run-Date
  [copybooks/wssystem.cob:L67] -- verbatim there: 05  Run-Date  binary-long.
  The pair is not two independent facts. The menu computes the text FROM the
  binary: move run-date to u-bin / call maps04 / move u-date to to-day
  [general/general.cbl:L465-L467], and maps04 converts with
  FUNCTION integer-of-Date [common/maps04.cbl:L167], whose epoch the
  maintainer records as 31/12/1600 [common/maps04.cbl:L39-L41] -- day one
  being 01/01/1601. Under that epoch 21/09/2025 is exactly the binary value
  written below, and the two must never be edited independently.
  On THIS route the value is directly diff-visible, and in a place the General
  Ledger scenario does not reach: sl060 stamps it into the batch header with
  move run-date to entered [sales/sl060.cbl:L1022], and ENTERED is a column of
  GLBATCH-REC in the frozen schema. Neither runner may call a clock; this file
  is the sole source of the date, which is what makes two runs
  byte-identical.
  A recorded, deliberate asymmetry: date_form governs the digit ORDER the
  COBOL runner must type at the date prompt [copybooks/wssystem.cob:L128-L132]
  -- one is UK dd/mm/yyyy, two is USA mm/dd/yyyy, three is International
  yyyy/mm/dd -- whereas the Python entry point's run-date option is always
  DD/MM/CCYY. Same logical date, two lexical forms; a documented deviation,
  not a defect.

  PURE GENERAL LEDGER MODE IS TWO SEEDED FIELDS, NOT ONE
  This is the single most expensive thing to get wrong in this file, so it is
  stated before anything else about the seed.
  The FIRST field is the fan-out switch, verbatim at
  [copybooks/wssystem.cob:L179-L181]:
    05  IRS-Instead     pic x. / 88  IRS-Used  value "Y". /
    88  IRS-Both-Used   value "B".
  A space selects the General Ledger only, Y selects IRS instead of it, and B
  selects IRS as well as it. Those two condition names are the field's ONLY
  ones: there is no third value and in particular no N. A pic x cannot hold an
  empty string, so a space is the more faithful spelling of the
  General-Ledger-only state, and both runners accept either spelling and
  converge them. sl060 tests the switch at [sales/sl060.cbl:L1039],
  [sales/sl060.cbl:L1126] and [sales/sl060.cbl:L1175].
  THE SECOND FIELD IS NOT ON THAT SWITCH AT ALL, and reading only the fan-out
  tests would miss it. G-L is a condition name on the installed-ledger level
  byte: 88  G-L  value 1 at [copybooks/wssystem.cob:L85], inside the Level
  group at [copybooks/wssystem.cob:L83-L96]. Pure General Ledger mode is
  therefore IRS-Instead equal to a space AND Level-1 equal to one. With
  Level-1 anything else, G-L is FALSE and the whole General Ledger side of
  sl060 disappears: the batch is never opened
  [sales/sl060.cbl:L466-L467], the posting file is never opened
  [sales/sl060.cbl:L1046-L1052], no posting is ever written
  [sales/sl060.cbl:L1144-L1149], anomaly A-17's move never executes
  [sales/sl060.cbl:L1172-L1173], and A-1 becomes UNOBSERVABLE because the
  close it suppresses was never reached. GLBATCH-REC and GLPOSTING-REC would
  then be empty on BOTH sides and the diff would be empty for the wrong
  reason. That is a silent false pass of exactly the same class as the
  file_system_used trap below, and NEITHER RUNNER ASSERTS IT: the oracle-side
  runner checks the flag, the cycle, the date form, the fan-out switch and the
  autogen switch, and stops there. It is closed here, by the seed contract,
  and nowhere else.

  THE SEEDED SYSTEM RECORD -- FOUR WAYS THIS SCENARIO CAN LIE
  Every value in the system block below must ALSO be carried by the seeded
  system flat file, because the COBOL reads it from there and not from argv.
    1. file_system_used = 1 IS THE FALSE-PASS TRAP. A handler routes to the
       MySQL bridge and returns only when the flag is non-zero:
       if not FS-Cobol-Files-Used / move RDBMS-Flat-Statuses to
       FA-RDBMS-Flat-Statuses / perform ba-Process-RDBMS / go to AA-Main-Exit
       [common/acas007.cbl:L316-L320]. With the flag at zero that test is
       false and control falls through to the COBOL indexed-file path at
       [common/acas007.cbl:L324], so MySQL is never touched at all: both dumps
       come back empty, the diff is empty, and the run is a SILENT FALSE PASS.
       The condition names are at [copybooks/wssystem.cob:L111-L114], with
       FS-Valid-Options at [copybooks/wssystem.cob:L122].
       Noted in passing from the same handler: opening for output means
       DELETING EVERY ROW [common/acas007.cbl:L305-L312], carrying the
       maintainer's own comment at [common/acas007.cbl:L301-L303]. That is
       GENERIC handler behaviour, which is why the recovery opens listed in
       the verb census below are worth naming rather than ignoring.
       The flag has a second effect peculiar to this route: sl060 guards its
       file-existence probes with it [sales/sl060.cbl:L437-L444] and
       [sales/sl060.cbl:L448-L456], so with the flag at one the OTM3
       open-output recovery at [sales/sl060.cbl:L441-L442] does NOT fire and
       SAITM3-REC is not cleared at start-up. The print-side carry-forward
       lines are gated the same way [sales/sl060.cbl:L695-L698], and the
       period-total add that follows them is NOT [sales/sl060.cbl:L700] -- see
       THE FOUR PERIOD-TOTAL SITES.
    2. cyclea MUST BE NON-ZERO or the menu diverts into interactive setup:
       if scycle = zero / go to call-system-setup
       [general/general.cbl:L462-L463]. The field and its redefinition are at
       [copybooks/wssystem.cob:L62-L63]. A zero here does not fail the run, it
       HANGS it on a terminal prompt. The same value reaches the batch header
       through move scycle to bcycle [sales/sl060.cbl:L1021], so it is
       diff-visible as GLBATCH-REC.BCYCLE.
    3. irs_instead IS PINNED EXPLICITLY, to a space, for the reason given
       above: its state decides WHICH TABLES a run touches, so a default would
       make the affected-table list ambiguous and would make A-1 unobservable.
    4. sl_autogen IS LOAD-BEARING ON THIS ROUTE, and on no other. It is
       pinned to a space so that the out-of-scope program the menu dispatches
       first is a provable no-op -- see the next section.
  The remaining four are INERT on this route and are present only so that all
  nine scenario files share one system block and so the seeded system record
  is fully determined:
    period -- the cycles-per-quarter divisor, used only by gl080
      [copybooks/wssystem.cob:L64], and no scenario in this harness drives it.
    pl_autogen -- the Purchase sibling of the switch above, which the
      maintainer marks as not used yet [copybooks/wssystem.cob:L209].
    s_flag_p and p_flag_p -- the cash and payment posting latches, which abort
      their programs on any other value; the fields are
      [copybooks/wssystem.cob:L226] and [copybooks/wssystem.cob:L206], and the
      programs that read them, sl100 and pl100, are not on this route.

  ONE PROGRAM RUNS ON THE ORACLE SIDE AND NEVER ON THE PYTHON SIDE
  This is harness deviation D-5, and this scenario is where it bites.
  move "sl830" to WS-Called [sales/sales.cbl:L759] dispatches sl830 BEFORE
  sl055, corroborated by the maintainer's own changelog line
  [sales/sales.cbl:L121]. The sales automatic-generation series is explicitly
  out of scope, and the migrated Sales entry point dispatches only sl055 and
  then sl060. Because the oracle-side runner drives the MENU, sl830 WILL
  execute there.
  THE MITIGATION IS THE PINNED SWITCH, AND IT IS PROVABLE FROM THE SOURCE.
  sl830 takes the four-parameter shape [sales/sl830.cbl:L260-L263], and the
  first two executable statements of its only section
  [sales/sl830.cbl:L266] are:
    if SL-Autogen not = "Y"    *> SL Autogen not in use
             goback.
  at [sales/sl830.cbl:L269-L270]. With the switch at a space the program
  returns immediately, touches no file and never sets the terminate code that
  load00 has just zeroed [sales/sales.cbl:L680], so the gate at
  [sales/sales.cbl:L761-L762] passes and sl055 runs. The switch itself is
  05  SL-Autogen  pic x  value space at [copybooks/wssystem.cob:L274].
  THE COROLLARY IS PART OF THIS FILE'S CONTRACT: THE TWO AUTOMATIC-GENERATION
  FLAT FILES ARE NEVER SEEDED. They are two of the eight out-of-scope names of
  [common/masterLD.sh:L93-L116] -- the Sales one at
  [common/masterLD.sh:L113], the Purchase one at [common/masterLD.sh:L108] --
  the four automatic-generation tables their loaders fill are NEVER listed
  among the affected tables, and both runners assert after the run that all
  four still hold zero rows: the oracle side checks the Sales pair whenever the
  subsystem is sales, and the migrated side checks all four, because it
  dispatches neither program. The resolution is assertion, not compensation:
  nothing is subtracted from either capture.
  Purchase has NO SUCH ASYMMETRY, because its equivalent call and gate are
  both commented out at [purchase/purchase.cbl:L755-L758]. That divergence is
  preserved rather than harmonised, and it is recorded in
  docs/migration/ambiguity-resolutions.md alongside this scenario's own
  entries.

  WHY EXACTLY THESE TEN TABLES -- A MEASURED VERB CENSUS, NOT AN INFERENCE
  Every facade verb the route issues was counted in the frozen source, with
  commented-out lines excluded, because a commented verb is not a verb.
    sl830 issues NONE. It returns before its first open
      [sales/sl830.cbl:L269-L270], so it mutates NOTHING.
    sl055 mutates four tables. VALUEANAL-REC through Value-Write
      [sales/sl055.cbl:L398] and Value-Rewrite [sales/sl055.cbl:L400] in the
      per-line accumulation, the second pass for a split analysis code
      [sales/sl055.cbl:L420], and the specials paragraph
      [sales/sl055.cbl:L607], [sales/sl055.cbl:L609] and
      [sales/sl055.cbl:L621]. SAINV-LINES-REC through the line rewrite that
      stamps the analysed flag, move "Z" to il-update / perform
      Invoice-Rewrite at [sales/sl055.cbl:L421-L422]. SAINVOICE-REC through
      the header rewrites at [sales/sl055.cbl:L441] and
      [sales/sl055.cbl:L469], the second of which follows move "Z" to
      ih-update at [sales/sl055.cbl:L468]; the header status bytes are set
      earlier at [sales/sl055.cbl:L679-L680]. ANALYSIS-REC through
      Analysis-Write [sales/sl055.cbl:L580] and its split-code twin
      [sales/sl055.cbl:L583] -- and NOWHERE ELSE, which is the subject of its
      own paragraph below. Its read-only verbs are Invoice-Read-Next
      [sales/sl055.cbl:L366], Invoice-Start [sales/sl055.cbl:L476],
      Value-Read-Indexed [sales/sl055.cbl:L383], [sales/sl055.cbl:L407],
      [sales/sl055.cbl:L596] and [sales/sl055.cbl:L613], and
      Analysis-Read-Indexed [sales/sl055.cbl:L534], [sales/sl055.cbl:L551] and
      [sales/sl055.cbl:L564]. It also carries ONE delete-all recovery path,
      Value-Open-Output at [sales/sl055.cbl:L322], reached only when the value
      file cannot be opened for input [sales/sl055.cbl:L319-L323]; seeding
      value.dat is what keeps it shut.
    sl060 mutates five tables. SALEDGER-REC through Sales-Rewrite
      [sales/sl060.cbl:L583] on the normal path and Sales-Write
      [sales/sl060.cbl:L581] on the customer-unknown path the maintainer
      marks as shouldn't happen [sales/sl060.cbl:L579]. SAITM3-REC through
      OTM3-Write [sales/sl060.cbl:L586] and the two live OTM3-Rewrite calls,
      [sales/sl060.cbl:L761] and [sales/sl060.cbl:L962]; a third apparent
      rewrite at [sales/sl060.cbl:L603] is COMMENTED OUT and is not counted.
      VALUEANAL-REC through the two deduction rewrites
      [sales/sl060.cbl:L990] and [sales/sl060.cbl:L1002]. GLBATCH-REC through
      GL-Batch-Write [sales/sl060.cbl:L1161]. GLPOSTING-REC through
      GL-Posting-Write [sales/sl060.cbl:L1147]. Its read and control verbs are
      Sales-Read-Indexed [sales/sl060.cbl:L491], OTM3-Read-Next
      [sales/sl060.cbl:L662] and [sales/sl060.cbl:L867], OTM3-Start
      [sales/sl060.cbl:L856] and [sales/sl060.cbl:L905], and the opens and
      closes at [sales/sl060.cbl:L469], [sales/sl060.cbl:L481],
      [sales/sl060.cbl:L614-L615], [sales/sl060.cbl:L644-L646],
      [sales/sl060.cbl:L656], [sales/sl060.cbl:L679] and
      [sales/sl060.cbl:L1010].
    THE GENERAL-LEDGER-SIDE OPENS ARE CONDITIONAL, and that is the whole point
      of this scenario: perform ca000-BL-Open is guarded by if G-L
      [sales/sl060.cbl:L466-L467], the posting-file open by if IRS-Both-Used
      or G-L [sales/sl060.cbl:L1046-L1052], and the batch close by if G-L
      [sales/sl060.cbl:L649-L650]. The recovery open inside ca000-BL-Open is
      commented out [sales/sl060.cbl:L1011-L1014], so GL-Batch-Open-Output is
      NOT a live verb on this route and GLBATCH-REC is never mass-deleted.

  PSIRSPOST-REC IS AN UNCHANGED-WITNESS, AND THAT IS ITS VALUE
  The transfer-file write is SPL-Posting-Write [sales/sl060.cbl:L1142], and it
  sits inside if irs-used or IRS-Both-Used [sales/sl060.cbl:L1126]. With the
  switch at a space NEITHER condition name matches, so no row is written; the
  extend-open and its recovery [sales/sl060.cbl:L1039-L1045] are inside the
  same test and equally skipped, and the close is inside the anomalous nest
  [sales/sl060.cbl:L1175-L1176]. The table is declared anyway, because A-1's
  evidence DEPENDS on those branches being off: a dump that proves the
  transfer table untouched is what distinguishes a genuine pure-General-Ledger
  run from one that quietly took an IRS path.

  ANALYSIS-REC IS AN UNCHANGED-WITNESS TOO, UNLESS THE SEED IS INCOMPLETE
  The only writer is the emergency-create paragraph
  [sales/sl055.cbl:L574-L584], reached from db000-Create when the analysis
  read comes back with a missing-record status: if FS-Reply = 21 or = 23 / go
  to db010-Create-Anal [sales/sl055.cbl:L535-L536]. It fabricates a record
  whose description is the literal Emergency Name - Missing
  [sales/sl055.cbl:L578], writes it [sales/sl055.cbl:L580], writes a second
  one for a split code [sales/sl055.cbl:L581-L583], raises a flag
  [sales/sl055.cbl:L584] and re-dispatches to the paragraph it came from
  [sales/sl055.cbl:L585]. So a seed whose analysis.dat covers every code the
  invoice lines reference leaves ANALYSIS-REC IDENTICAL TO SEED, and the dump
  PROVES the emergency path did not fire. This is stated precisely because the
  opposite reading -- that every run writes the analysis table -- would send a
  reader hunting for a difference that should not be there. If a future
  scenario wants that path exercised, it belongs in its own file with its own
  seed, not by degrading this one (rule R-4).

  GLLEDGER-REC IS ABSENT, DELIBERATELY
  sl060 issues no GL-Nominal verb of any kind: the nominal ledger is posted by
  gl072 on the General Ledger route, from the batch and posting rows this
  route creates, and that is a different scenario
  (harness/scenarios/clean_batch_gl.yaml). Listing it here would compare a
  table that nothing on this route can touch, which proves nothing and hides
  the tables that matter.

  SYSTOT-REC IS LISTED, AND IT CARRIES A RECORDED CAVEAT (rules R-4 and R-6)
  The totals record is genuinely in scope on this route: four of the nine
  period-total write sites fire here, and those nine sites are the sole
  writers of it. But the writing is to the LINKAGE COPY IN MEMORY, not to the
  database. A census across all twelve in-scope programs finds NO System
  facade verb in any of them, so no in-scope program persists it. What
  persists it is the out-of-scope menu: overrewrite at
  [sales/sales.cbl:L628] rewrites key one, the system record
  [sales/sales.cbl:L633-L635], and key four, the totals record
  [sales/sales.cbl:L636-L638], to the relational store and then repeats the
  pair against the COBOL file [sales/sales.cbl:L645-L657]. The Sales menu
  writes only those two keys, where the General menu writes three
  [general/general.cbl:L656-L691] -- a divergence between the two menus, also
  preserved. load000 reaches overrewrite on EVERY call, because its two
  branches, ws-term-code < 8 [sales/sales.cbl:L708-L709] and ws-term-code > 7
  [sales/sales.cbl:L710-L712], are exhaustive over a two-digit field. AND THE
  MIGRATED ENTRY POINT REPRODUCES THAT PARAGRAPH rather than skipping it --
  acas_posting/cli/args.py::overrewrite, reached with the state
  `args.slpl_menu_state' builds, which carries the totals record precisely so
  that key 4 is rewritten and writes key 2 only when the route loaded the
  defaults record, so the Sales "keys 1 and 4 only" divergence is inherited
  rather than harmonised. Both cycles reach it.
  SO SYSTOT-REC PARITY DEPENDS ON THAT KEY-FOUR REWRITE, and SYSTOT-REC is on
  the affected-table list because of it. That is the unavoidable overlap of
  harness deviation D-4, it is recorded honestly rather than papered over, and it
  is arbitrated against the compiled oracle in
  docs/migration/ambiguity-resolutions.md. It is NOT resolved with an
  ignore-list in the diff stage, which is required to have no ignore-list, no
  tolerance list and no known-difference allowance: the comparison is bounded by
  ALL 22 IN-SCOPE TABLES, and this file's affected-table list is the scenario's
  DECLARED EFFECT rather than the bound.
  SYSTEM-REC IS LISTED, and that is a correction rather than an oversight
  reversed. The menu rewrites the system record on every dispatch, BOTH SIDES
  REACH THAT REWRITE, and this route changes the row in memory in two places a
  reader will notice -- add 1 to next-Batch [sales/sl060.cbl:L1018] and anomaly
  A-17's move [sales/sl060.cbl:L1173] -- so what each cycle writes there is a
  real behavioural claim that had to come inside a bound. The Sales menu
  persists it on exit [sales/sales.cbl:L628-L657], which the headless Python
  route reproduces through args.overrewrite rather than through a menu. Whether
  the two nevertheless agree is a question about state, so it was MEASURED (rule
  R-6): both sides end this scenario with a byte-identical SYSTEM-REC row, all
  169 columns. Leaving it out would mean the allocator increment and A-17's move
  were never observed by any declared effect.

  TWO CELLS OF SYSTEM-REC ARE WITHHELD FROM THE CAPTURE, AND ONLY TWO.
  `RDBMS-Passwd pic x(12)' [copybooks/wssystem.cob:L139] and the frozen schema's
  shorter PASS-WORD column are the database's own password as seeded, and a dump
  is SELECT *, so harness/dump_tables.py's REDACTED_COLUMNS replaces exactly
  those two cells, on BOTH sides, with one fixed marker -- which is why this file
  declares neither field. The row is still dumped and still diffed, every other
  column byte for byte, so this is not an ignore-list, and withholding a secret
  symmetrically cannot conceal a difference in anything the cycle computes.
  THE ROW IS ALSO FINGERPRINTED, ON EVERY SCENARIO AND ON BOTH SIDES:
  acas_resolve_fingerprint_tables appends it when a scenario has not declared it,
  and tests/conftest.py's `assert_system_record_parity' compares the two sides'
  post-run digests -- all 169 columns, the credential included, leaking nothing
  because a sha256 of a canonical dump is not the dump.

  SYSDEFLT-REC and SYSFINAL-REC remain absent from the declared list, and for a
  reason that does not apply to SYSTEM-REC: the Sales menu exit rewrites keys 1
  and 4 ONLY [sales/sales.cbl:L628-L657] -- there is no key-2 rewrite in it at
  all, unlike the General menu -- key 3 has no writer anywhere, and no in-scope
  program touches either record, so neither is mutated by anything on this route.
  Both are still inside the 22-table bound and are still diffed.

  THE sl055-TO-sl060 HANDOFF IS A WORK FILE, NOT A TABLE
  Worth stating because a reader counting tables will look for it. sl055 ends
  each extracted header with a NATIVE COBOL write, write oi-header
  [sales/sl055.cbl:L681], to the second open-item file, and sl060 opens and
  reads that same file natively [sales/sl060.cbl:L480],
  [sales/sl060.cbl:L484] before clearing it down at
  [sales/sl060.cbl:L677-L678]. The file is file18, openitm2
  [copybooks/wsnames.cob:L35], and THE FROZEN SCHEMA HAS NO TABLE FOR IT --
  only file19, openitm3 [copybooks/wsnames.cob:L36], has one, as SAITM3-REC.
  So the handoff is a transient work file in the same sense as the General
  Ledger cycle's two scratch files, it is modelled in Python as an ordered
  in-process sequence, and nothing about it appears in any dump. Its
  consequence for the harness is only that the COBOL side needs a writable
  working directory.

  sl055's FOUR FILTERS -- THE SEED MUST SATISFY ALL OF THEM
  The header paragraph is da020-Header-Analysis [sales/sl055.cbl:L426], and it
  drops work before doing any:
    an invoice already analysed AND applied is skipped back to the read loop
      [sales/sl055.cbl:L427-L428];
    a PROFORMA is skipped, if ih-type = 4 / go to da030-Skip-Invoice
      [sales/sl055.cbl:L430-L431];
    a PENDING invoice, or one whose live-status byte is not "L", is skipped
      with a flag raised [sales/sl055.cbl:L433-L436];
    and the extract itself drops anything already applied
      [sales/sl055.cbl:L632-L633].
  Only then does it extract [sales/sl055.cbl:L438] and stamp the header
  [sales/sl055.cbl:L468-L469]. The document-type codes are one Receipt, two
  Invoice, three Credit Note, four Proforma. THE SEED THEREFORE CARRIES
  invoices whose live-status byte is "L", not pending and not
  already-analysed-and-applied; a run against a seed that fails any of the
  four filters posts NOTHING and its empty diff means nothing.

  THE CREDIT-NOTE SIGN FLIPS AND THE NINE-FIELD NEGATION BLOCK
  A credit note is not a negative invoice in the record; it is an invoice
  whose sign is flipped by the program. sl055 flips the accumulated VAT
  [sales/sl055.cbl:L446], the carriage [sales/sl055.cbl:L457] and the
  deduction [sales/sl055.cbl:L463], each guarded by if ih-type = 3, and the
  extract then negates NINE FIELDS in one block, if ih-type = 3 at
  [sales/sl055.cbl:L657] followed by [sales/sl055.cbl:L658-L666]. The nine
  addends that build the document total are at
  [sales/sl055.cbl:L670-L673], guarded to exclude receipts.
  THE SEED THEREFORE CARRIES AT LEAST ONE CREDIT NOTE, or the whole block is
  dead code in the capture and the parity claim over it is untested.

  ANOMALIES A-8, A-9 AND A-10 -- THE THREE DIVERGENT MOVING AVERAGES
  All three are in docs/migration/anomaly-log.md, all three are reproduced
  exactly, and normalising them into one helper would be the single easiest
  way to fail this migration.
  The invoice path is ba000-Sales-Comp [sales/sl060.cbl:L816]: a guard that
  reconstitutes the previous total or zeroes it
  [sales/sl060.cbl:L819-L824], then add 1 to sales-activety
  [sales/sl060.cbl:L825], then the accumulation
  [sales/sl060.cbl:L826] and the divide [sales/sl060.cbl:L827].
  A-8, THE DOUBLE TRUNCATION. The accumulator is declared with ZERO decimal
  places, 03  work-2  pic s9(14)  comp-3 at [sales/sl060.cbl:L206], while the
  value added into it carries TWO, 03  work-goods  pic s9(7)v99  comp-3 at
  [sales/sl060.cbl:L218]. Pence are therefore discarded at
  [sales/sl060.cbl:L826]. The divide at [sales/sl060.cbl:L827] then discards
  the remainder as well, because the receiving field is one of the SEVEN
  binary-long statistics fields at [copybooks/wssl.cob:L46-L52] --
  Sales-Average at [copybooks/wssl.cob:L49] -- which the Python side models as
  int and never as a decimal, precisely so that integer truncation is
  reproducible. The two money fields of the same record
  [copybooks/wssl.cob:L54-L55] are the ones that stay decimal.
  A-9, THE MISSING INCREMENT. The credit-note path is ba000-Credit-Comp
  [sales/sl060.cbl:L832]. Its guard is the same
  [sales/sl060.cbl:L835-L840], but it adds an EXTRA one, if work-2 not = zero
  at [sales/sl060.cbl:L841], before accumulating
  [sales/sl060.cbl:L842] and dividing [sales/sl060.cbl:L843] -- and IT NEVER
  INCREMENTS THE ACTIVITY COUNTER AT ALL. There is no add 1 to sales-activety
  anywhere in the section. The consequence is that the first credit note for a
  customer is silently dropped from the average, because the extra guard sees
  a zero accumulator and the divide never runs.
  A-10, THE THREE INCONSISTENT GUARDS. The same idiom appears three times with
  three different guards: [sales/sl060.cbl:L819], [sales/sl060.cbl:L835] with
  its extra test, and a third in the cash program at
  [sales/sl100.cbl:L506]. The third increments its counter in yet another
  position [sales/sl100.cbl:L510] and returns early on a zero cleared date
  [sales/sl100.cbl:L500-L501]. Its divide is SPELLED the other way round --
  divide work-b by sales-pay-activety [sales/sl100.cbl:L511] against divide
  sales-activety into work-2 [sales/sl060.cbl:L827] -- and computes the SAME
  quotient, accumulator over counter, because DIVIDE X INTO Y GIVING Z and
  DIVIDE Y BY X GIVING Z are both Z = Y / X. Calling it an inverted divide would
  claim a behavioural difference that is not there; the divergence that must
  survive is the guards and the counter handling. Only the first two
  are on this route; the third belongs to the cash-posting program, which this
  scenario does not drive, and it is named here only so that the set of three
  is complete and no reader concludes the pair above is the whole anomaly.
  THE SEED THEREFORE CARRIES ONE CUSTOMER WITH TWO INVOICES AND ONE CREDIT
  NOTE. Two invoices make the reconstitute-and-redivide arithmetic of A-8 run
  on a non-zero accumulator instead of the trivial first-document case, and
  the credit note for the SAME customer is what makes A-9 observable rather
  than latent.

  THE FOUR PERIOD-TOTAL SITES THAT FIRE ON THIS ROUTE
  These four are why SYSTOT-REC is declared, and each is guarded differently:
    sl-invoices-this-month, guarded by if ih-type = 2
      [sales/sl055.cbl:L674-L675];
    sl-credit-notes-this-month, guarded by if ih-type = 3
      [sales/sl055.cbl:L676-L677];
    sl-credit-deductions, add total-deduct at [sales/sl060.cbl:L641],
