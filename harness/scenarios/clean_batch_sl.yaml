    - invoice.dat
    - openitm3.dat

# Flat mirrors of the seed block, required by the seeder, which also resolves a
# relative directory against the directory holding this file. The order here is
# membership only: the frozen loader order of [common/masterLD.sh:L93-L116] is
# what actually runs, with the system block first.
seed_dir: clean_batch_sl
seed_files:
  - system.dat
  - analysis.dat
  - value.dat
  - salesled.dat
  - invoice.dat
  - openitm3.dat

# The operations this scenario runs, in order. The Python runner reads this key
# as a flat sequence of operation NAMES and prefers it over the singular
# `operation:' key above, so the sequence holds names and nothing else; the
# oracle-side runner reads the singular key, which names the same operation, so
# both runners resolve the same single operation from this one file. The
# subsystem each name belongs to is not restated per item: each runner owns the
# operation-to-subsystem map, and this scenario's subsystem is stated once at
# top level above. One operation, run once, sequentially (R-3).
operations:
  - sl_invoice_post

# The process status the operation is expected to end with, positionally. The
# Sales route's gate is `ws-term-code not = zero', tested twice
# [sales/sales.cbl:L761-L762] and [sales/sales.cbl:L765-L766], so 0 states that
# neither sl055 nor sl060 raised a terminate code and both therefore ran. A
# status that contradicts this is reported as a behavioural difference and the
# capture is still taken, so the table diff can corroborate it (R-4).
expected_table_effect: changed

expected_status:
  - 0

# No answer key is declared, because this route promotes none: irs_clear_postings,
# payment_post_confirm, gl080_proceed and disk_change_option belong to the IRS,
# payment and end-of-cycle routes, and none of them is on this path. Leaving them
# unstated is what keeps this scenario's inputs exactly the inputs the frozen
# cycle takes.

# WHAT `affected_tables` IS, AND WHAT IT IS NOT
#
# It is the DECLARED EFFECT of this scenario: the tables the runners assert
# changed or unchanged against `expected_table_effect`, in the order declared.
#
# It is NOT the bound of the comparison. The capture and the diff are bounded by
# ALL 22 IN-SCOPE TABLES -- `harness/dump_tables.py --all-in-scope` at stages 3
# and 7 and `harness/diff_states.py --all-in-scope` at stage 10, which
# both a hand-driven run and `tests/conftest.py` pass. A bound drawn from
# what a scenario EXPECTS to move cannot show a difference in anything it did not
# expect to move, and an empty diff is the single pass condition (AAP section
# 0.8.5). In particular both cycles perform the menu's own `overrewrite.'
# [general/general.cbl:L656-L672], which rewrites SYSTEM-REC under key 1,
# SYSDEFLT-REC under key 2 and SYSTOT-REC under key 4 -- reproduced by
# `acas_posting/cli/args.py::overrewrite' -- so those rows are compared on both
# sides rather than omitted.
affected_tables:
  - ANALYSIS-REC
  - GLBATCH-REC
  - GLPOSTING-REC
  - PSIRSPOST-REC
  - SAINV-LINES-REC
  - SAINVOICE-REC
  - SAITM3-REC
  - SALEDGER-REC
  - SYSTEM-REC
  - SYSTOT-REC
  - VALUEANAL-REC

# =============================================================================
# THE SEED RECORDS
# =============================================================================
# Built into the declared flat files by harness/dump_tables.py --make-fixtures, which generates
# a COBOL writer per file, compiles it against the FROZEN copybooks and calls the
# FROZEN handler to write. Field names below are spelled exactly as the frozen
# copybook spells them; the builder reads them from the handler's own LINKAGE copy
# block, with the handler's own REPLACING clauses applied, so a name this file gets
# wrong is a refusal and never a silent no-op.
#
# EVERY VALUE IS A QUOTED STRING (rule R-2). This is the outermost edge of the
# exactness claim: an unquoted 1234.56 would become a binary float inside the YAML
# parser before any COBOL saw it. The quoted text is stored by COBOL's own MOVE,
# so the frozen picture clause decides alignment on the implied decimal point,
# truncation toward zero and sign placement.
#
# WHAT THIS SEED HAS TO ACHIEVE, restated from THE SEED CONTRACT above:
#   * analysis and value records covering EVERY code the invoice lines reference,
#     AND BOTH HALVES of each split code, or sl055's indexed reads miss and its
#     emergency-create path fabricates records instead of reading seeded ones.
#     The second half matters because sl055 re-reads with va-second blanked
#     [sales/sl055.cbl:L402-L409] -- so code "AB" needs an "A "-suffixed roll-up
#     row as well as the "AB" row itself.
#   * one customer carrying TWO INVOICES AND ONE CREDIT NOTE, with a NON-ZERO
#     activity count and a NON-ZERO average so that the guard at
#     [sales/sl060.cbl:L819-L824] takes its reconstituting branch rather than its
#     zeroing one, and with amounts carrying NON-ZERO PENCE so that the
#     zero-decimal accumulator [sales/sl060.cbl:L206] actually discards something.
#     A SEED OF ROUND POUNDS WOULD HIDE ANOMALY A-8 COMPLETELY, which is why every
#     document amount below ends in something other than 00.
#   * invoice headers that pass all four of sl055's filters
#     [sales/sl055.cbl:L426-L438]: ih-test zero marks a header
#     [sales/sl055.cbl:L370-L371], ih-status "I" so neither pending nor applied,
#     ih-status-L "L", and ih-update a space so ih-analyised is false.
#   * one type-4 PROFORMA header, seeded so the skip at
#     [sales/sl055.cbl:L430-L431] is a DEMONSTRATED skip rather than an assumed
#     one; its lines must therefore survive into the tables untouched.
#   * one OPEN credit note in the transfer file, document type 3 and OI-Status
#     zero so S-Open is true [copybooks/slwsoi.cob:L47-L49], which is what makes
#     ba000-Cr-Swop run [sales/sl060.cbl:L671-L672] and the fourth period total
#     non-zero.
seed_records:

  # Key 1 is the only system row the frozen code reads [common/acas000.cbl].
  # Level-1 one is what makes G-L true [copybooks/wssystem.cob:L85] -- the
  # installed-ledger level byte, NOT the fan-out switch. File-System-Used one is
  # what keeps the run on MySQL [copybooks/wssystem.cob:L111-L115].
  # system.dat IS FOUR DIFFERENT RECORDS IN ONE RELATIVE FILE, keyed by relative
  # record number -- [copybooks/selsys.cob] declares it ORGANIZATION RELATIVE with
  # relative key `rrn', and the four system loaders each go straight to one slot:
  #   "1"  systemLD [common/systemLD.cbl:L227] -> SYSTEM-REC    (the parameter record)
  #   "2"  dfltLD   [common/dfltLD.cbl:L221]   -> SYSDEFLT-REC  (wsdflt.cob)
  #   "3"  finalLD  [common/finalLD.cbl:L221]  -> SYSFINAL-REC  (wsfinal.cob)
  #   "4"  sys4LD   [common/sys4LD.cbl:L226]   -> SYSTOT-REC    (wssys4.cob)
  # All four are 1024 bytes, which is why one relative file can hold them, and ALL
  # FOUR MUST BE PRESENT: masterLD runs every one of those loaders unconditionally
  # [common/masterLD.sh:L50-L88] and the last is tested against zero rather than 63
  # [common/masterLD.sh:L83-L86], so an unwritten slot ABORTS the seed. A slot with
  # nothing to pin is declared as {} and written INITIALIZEd -- which is a statement
  # about the pre-state rather than an omission.
  system.dat:
    "1":
      - System-Record-Version-Prime: "3"
        System-Record-Version-Secondary: "2"
        Vat-Rate-1: "20.00"
        Vat-Rate-2: "5.00"
        Vat-Rate-3: "0.00"
        Cyclea: "1"
        Period: "1"
        Run-Date: "155127"
        File-System-Used: "1"
        Date-Form: "1"
        IRS-Instead: " "
        SL-Autogen: " "
        PL-Autogen: " "
        S-Flag-P: "2"
        P-Flag-P: "2"
        Pass-Value: "0"
        Level-1: "1"
        Level-2: "1"
        Level-3: "1"
        Level-4: "1"
        GL-SL-Sales-Ac: "2000"
        GL-S-Debtors: "1100"
        Vat-Ac: "2200"
        Next-Batch: "1"
        Next-Post: "1"
        Sl-Day-Book: "0"
        SL-Stats-Run: "0"
