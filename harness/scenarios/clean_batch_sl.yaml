  ANOMALY A-1 -- THE MISSING TERMINATING PERIOD. THIS FILE'S HEADLINE.
  Recorded as A-1 in docs/migration/anomaly-log.md and reproduced in
  acas_posting/programs/sl060_invoice_posting.py as a NESTED conditional,
  never as two siblings. The batch-close section is ca000-BL-Close
  [sales/sl060.cbl:L1158], and read exactly as the compiler reads it:
    perform  GL-Batch-Write                            L1161
    <the write-error block>                            L1162-L1171
    if       IRS-Both-Used OR G-L                      L1172   <- IF ONE OPENS
             move  RRN  to  postings.                  L1173   <- PERIOD: ENDS
    perform  GL-Batch-Close.                           L1174   unconditional
    if       IRS-Used OR IRS-Both-Used                 L1175   <- IF TWO OPENS
             perform SPL-Posting-Close                 L1176   <- NO PERIOD
    if       IRS-Both-Used or G-L                      L1177   <- IF THREE,
             perform GL-Posting-Close.                 L1178      NESTED IN TWO
    ca999-main-exit.                                   L1180
  Because the statement at [sales/sl060.cbl:L1176] carries no terminating
  period, the if at [sales/sl060.cbl:L1177] is a NESTED clause of the if at
  [sales/sl060.cbl:L1175] rather than a sibling of it. GL-Posting-Close
  therefore executes only when BOTH tests pass -- IRS-Used or IRS-Both-Used,
  AND IRS-Both-Used or G-L -- and IN PURE GENERAL LEDGER MODE THE FIRST TEST
  IS FALSE, SO IT NEVER EXECUTES AT ALL. The posting file is left open by a
  program that has finished with it.
  THE CONTROL IS THE PURCHASE MIRROR, harness/scenarios/clean_batch_pl.yaml.
  The same block appears at [purchase/pl060.cbl:L1027-L1033] and is identical
  EXCEPT that [purchase/pl060.cbl:L1031] HAS the period, which makes its next
  if a sibling and lets GL-Posting-Close run in pure General Ledger mode. Two
  further siblings agree with Purchase and not with Sales:
  [sales/sl100.cbl:L694] and [purchase/pl100.cbl:L675]. THREE SOURCES WITH THE
  PERIOD AND ONE WITHOUT IS WHAT PROVES THIS IS AN ACCIDENT RATHER THAN AN
  IDIOM -- and rule R-4 makes reproducing the accident the correct outcome and
  repairing it a failure. The migrated module carries the nesting and a comment
  citing the locator, so that a later reader cannot mistake it for a typing
  error in the Python.
  What the diff sees is the CONSEQUENCE of the missing close rather than the
  close itself, which is why this scenario declares GLPOSTING-REC: the pair of
  captures, this one and the Purchase one, is the evidence, and it is recorded
  in docs/migration/scenario-diff-evidence.md.

