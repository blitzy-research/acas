  # TWO open items. The first is the OPEN CREDIT NOTE the contract requires --
  # OI-Type 3 and OI-Status zero, so S-Open is true
  # [copybooks/slwsoi.cob:L47-L49] -- which is what makes ba000-Cr-Swop run
