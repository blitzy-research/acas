  THE SEED CONTRACT -- WHAT sl_clean MUST HOLD
  seed.data_dir names a RELATIVE directory and never an absolute path. Its two
  consumers resolve it against different bases, which is a property of the
  consumers and not of this file: the COBOL-side seeder joins a relative name
  to the directory holding this scenario file and stages the declared files
  into a fresh scenario-owned fixture, while the Python side reads it as a
  subdirectory of the harness data directory. The flat files themselves are a
  separate deliverable and are deliberately NOT created in this directory.
  The DECLARED ORDER of seed.files is membership only: the seeder applies the
  FROZEN loader order of [common/masterLD.sh:L93-L116] regardless, and the
  system block always runs first and as four loaders in one fixed sequence.
  Six flat files are declared, and each is one of the names the frozen loader
  script recognises:
    system.dat   -- the system block [common/masterLD.sh:L51-L88], loaded by
                    systemLD [common/masterLD.sh:L52], then sys4LD
                    [common/masterLD.sh:L61], then finalLD
                    [common/masterLD.sh:L70], then dfltLD
                    [common/masterLD.sh:L79], in that order and nothing else.
                    Effectively mandatory: without the system record the menu
                    calls its interactive setup program
                    [general/general.cbl:L385-L394] and the runner blocks on a
                    terminal, and the seeder refuses a scenario that omits it.
                    It must carry file_system_used, cyclea, period, date_form,
                    irs_instead, sl_autogen, pl_autogen, s_flag_p and p_flag_p
                    exactly as pinned below, PLUS Level-1 equal to one so that
                    G-L is true [copybooks/wssystem.cob:L85], PLUS the database
                    credential fields described under THE CREDENTIAL
                    PRECONDITION.
    analysis.dat -- [common/masterLD.sh:L93], loaded into ANALYSIS-REC. IT MUST
                    COVER EVERY ANALYSIS CODE THE INVOICE LINES REFERENCE, and
                    both halves of any split code, or sl055's indexed reads
                    [sales/sl055.cbl:L534], [sales/sl055.cbl:L551] and
                    [sales/sl055.cbl:L564] miss and the emergency-create path
                    fabricates records instead.
    value.dat    -- [common/masterLD.sh:L116], loaded into VALUEANAL-REC. One
                    value-analysis record per analysis code, for the same
                    reason and additionally because an unopenable value file
                    triggers the delete-all recovery at
                    [sales/sl055.cbl:L319-L323].
    salesled.dat -- [common/masterLD.sh:L112], loaded into SALEDGER-REC. AT
                    LEAST ONE CUSTOMER WITH TWO INVOICES AND ONE CREDIT NOTE,
                    so that A-8, A-9 and A-10 are all reachable. Its seven
                    binary-long statistics fields
                    [copybooks/wssl.cob:L46-L52] and its two money fields
                    [copybooks/wssl.cob:L54-L55] must start at values that make
                    the truncation VISIBLE -- a non-zero activity count and a
                    non-zero average, so the guard at
                    [sales/sl060.cbl:L819-L824] takes its reconstituting
                    branch, and document amounts carrying non-zero pence, so
                    the zero-decimal accumulator at [sales/sl060.cbl:L826]
                    actually discards something. A seed of round pounds would
                    hide A-8 completely.
    invoice.dat  -- [common/masterLD.sh:L98], loaded into SAINVOICE-REC AND
                    SAINV-LINES-REC by one loader. Headers with the live-status
                    byte "L", not pending and not already
                    analysed-and-applied, so all four filters
                    [sales/sl055.cbl:L426-L438] pass; at least one of document
                    type two and at least one of document type three; and
                    OPTIONALLY one of document type four so that the proforma
                    filter [sales/sl055.cbl:L430-L431] is exercised as a
                    demonstrated SKIP rather than assumed. Lines whose analysis
                    code exists in analysis.dat, and whose product code does not
                    begin with an oblique, which sl055 treats as a comment line
                    [sales/sl055.cbl:L376-L378].
    openitm3.dat -- [common/masterLD.sh:L104], loaded into SAITM3-REC. AT LEAST
                    ONE OPEN CREDIT NOTE, document type three and not closed,
                    so that ba000-Cr-Swop runs
                    [sales/sl060.cbl:L671-L672] and the fourth period total is
                    non-zero.
  NONE of the eight out-of-scope flat-file names of
  [common/masterLD.sh:L93-L116] appears here, and the omission of the two
  automatic-generation loaders in particular is LOAD-BEARING rather than an
  oversight: seeding the Sales one [common/masterLD.sh:L113] would populate the
  very tables this scenario asserts empty and would make the sl830 no-op
  unprovable. NOTHING IN THE SEED IS TIDIED to make a run look neater (rule
  R-4): the seed exists to make these anomalies observable, and data that
  dodges one defeats the file's purpose. Every money amount lives in those
  flat files as decimal text in the frozen record layout; NO MONETARY VALUE
  APPEARS AS A SCALAR IN THIS FILE (rule R-2).

  THE CREDENTIAL PRECONDITION -- CANNOT BE SATISFIED FROM THIS DIRECTORY
  The COBOL takes its database credentials from the SEEDED SYSTEM RECORD, not
  from the environment. The fields are declared with their shipped defaults at
  [copybooks/wssystem.cob:L137-L144] -- database name, user and password each
  pic x(12), port pic x(5), host pic x(32) and socket pic x(64) -- and every
  handler copies them into the shared connection block before use, for example
  [common/acas012.cbl:L640-L645] into the block at
  [copybooks/wsfnctn.cob:L56-L62], where the user and password fields are only
  TWELVE characters wide. THE DATABASE ENVIRONMENT THE PYTHON SIDE USES MUST
  EQUAL THE CREDENTIAL FIELDS INSIDE THE SEEDED SYSTEM FLAT FILE, or the two
  sides address different servers and the diff is meaningless. This cannot be
  fixed from this directory, because that flat file lives under the harness
  data directory. The shipped defaults are NOT usable as-is and must not be
  copied anywhere: a credential belongs in the seeded fixture and in the
  runner's own private environment, never in a committed scenario file.

  THE OTHER PRECONDITIONS, EACH A HANG RISK RATHER THAN A FAILURE
    The menu forces the escape and exception screen settings
    [general/general.cbl:L369-L370] and then REFUSES TO RUN below twenty-four
    lines [general/general.cbl:L374-L378] or eighty columns
    [general/general.cbl:L379-L383]; sl055 makes the same line-count
    adjustment for itself [sales/sl055.cbl:L308-L313].
    Autocommit MUST BE OFF while seeding. The batch loader says so itself,
    verbatim at [common/glbatchLD.cbl:L9-L12]: this modules uses commit and
    rollback so you MUST ensure that autocommit is OFF in the rdb settings. It
    is as default set ON.
    The loaders signal failure through exit codes whose values above sixty-three
    abort the load [common/masterLD.sh:L56-L59], with the last of the four
    system loaders tested against zero instead
    [common/masterLD.sh:L83-L86], so the seeder must test them rather than
    assume success.
    The maintainer's own driver script carries his caveat that it is untested,
    which is why the harness reproduces its per-file contract rather than
    invoking it.

  THE ACCEPTANCE PROTOCOL
  TEN stages, in this order, one scenario at a time and nothing
  alongside it. harness/normalize.py is the single registry and
  `harness/normalize.py --print-stages' prints it, so this list is a restatement
  and never the authority:
    1 reset the schema and seed the scenario
    2 run the compiled COBOL cycle
    3 dump the COBOL state
    4 normalise the COBOL dump
    5 reset the schema and RE-SEED THE SAME SCENARIO -- the same fixture bytes, so
      the Python cycle starts from the state the COBOL cycle started from and not
      the state it left
    6 run the migrated Python cycle
    7 dump the Python state
    8 normalise the Python dump
    9 verify both captures are published -- BEFORE a single row is compared,
      because two PARTIAL captures can produce an empty diff and so pass a
      comparison that compared nothing
    10 diff the two normalised trees
  harness/build_oracle.sh and harness/seed.sh --build-fixtures come before stage 1 and are
  not stages: the first runs once per image, the second once per change to a
  scenario's seed records.
  AN EMPTY NORMALISED DIFF IS THE ONLY PASS CONDITION; a stage that exits
  non-zero has produced no evidence rather than weaker evidence, so the
  protocol is restarted from the seed rather than carried forward. The
  per-scenario outcome is recorded in
  docs/migration/scenario-diff-evidence.md, and this scenario's record is
  incomplete until the Purchase capture that controls A-1 is recorded beside
  it.
  Two runs of this scenario under the same pinned clock must additionally
  produce byte-identical dumps; that is what the determinism suite asserts.
  This file's consumers are all present in the checkout:
  the four documents under docs/migration/, the eight modules under
  tests/scenarios/ (one per scenario), and harness/run_python_scenario.sh.
  The seed FLAT FILES are deliberately not in the
  checkout: the records are declared above under seed_records and
  harness/seed.sh --build-fixtures builds the files from them inside the image, because
  fifteen of the seventeen frozen loaders read ORGANIZATION INDEXED or RELATIVE
  files whose on-disk form belongs to the Berkeley DB version that image carries.

  THE CONSUMER CONTRACT -- WHY SOME VALUES APPEAR UNDER TWO KEYS
  This file serves consumers with two different reading strategies, so a few
  values are published under both a grouped and a flat key. THE PAIRS ARE
  ADJACENT AND MUST ALWAYS HOLD THE SAME VALUE; they are written side by side
  precisely so that any drift is visible at a glance.
    clock.to_day        and run_date_text
    clock.run_date      and run_date_binary
    system.date_form    and date_form
    system.irs_instead  and irs_instead
    seed.data_dir       and seed_dir
    seed.files          and seed_files
    operations item one and operation
  The reason is measured, not assumed. The COBOL runner reads this file with a
  plain reader that accepts TOP-LEVEL KEYS ONLY, with no leading whitespace
  before the key, so a value nested under clock, system or seed is INVISIBLE
  to it; the Python runner parses the whole document but REFUSES a nested block
  under any key it actually consumes, because a block would read as empty and
  change the run without saying so. The grouped blocks are the documented
  shape and carry the values that have no flat consumer at all --
  file_system_used, cyclea, period, sl_autogen, pl_autogen, s_flag_p and
  p_flag_p are assertions about the SEEDED RECORD rather than command-line
  inputs, which is why the Python entry point exposes no option for them.
  operations is a FLAT SEQUENCE OF OPERATION NAMES and holds nothing else, and
  expected_status is a flat sequence of whole process statuses matching it
  positionally; the singular operation key names the same operation for the
  oracle-side reader. The scenario NAME is published once, as name, and the
  COBOL runner falls back to this file's own basename, so the two agree by
  construction: name equals clean_batch_sl equals the file stem.
  ANSWER KEYS ARE SEMANTIC and are never a copy of a command-line option
  spelling, because the option spellings belong to the entry points and are
  discovered from them. THIS ROUTE PROMOTES NO INTERACTIVE ANSWER AT ALL, so
  its answer map is empty and no answer key is declared below: neither sl055
  nor sl060 has a prompt that gates a database write. Their prompts are
  diagnostic acknowledgements, guarded by if WS-Caller not = "xl150" while the
  menu sets that field to sales [sales/sales.cbl:L481], so they fire on this
  path and the oracle-side runner answers them -- but answering one changes no
  table, which is why none of them is an input here.

  LOCATOR PROVENANCE
  Every line number cited above was read directly out of the frozen source in
  this checkout rather than copied from a plan, and several planning citations
  were found to be off. The ones corrected here are worth knowing when
  cross-reading: the commented-out Purchase autogen call and gate are at
  [purchase/purchase.cbl:L755-L758] and not the four lines above them; the
  credential copy in the customer handler spans
  [common/acas012.cbl:L640-L645], of which the user field is only the second
  line; the batch loader's autocommit caveat is
  [common/glbatchLD.cbl:L9-L12]; the third apparent open-item rewrite in sl060
  at [sales/sl060.cbl:L603] and the batch-file recovery open at
  [sales/sl060.cbl:L1011-L1014] are BOTH COMMENTED OUT and are therefore not
  verbs; and G-L is a condition name on the installed-ledger level byte at
  [copybooks/wssystem.cob:L85], NOT on the fan-out switch at
  [copybooks/wssystem.cob:L179-L181], which is the correction that produced
  the two-field statement of pure General Ledger mode above.
  THE FROZEN SOURCE IS READ AND NEVER EDITED: any diff under common,
  copybooks, general, sales, purchase, irs, stock or mysql is a defect in the
  migration however harmless it looks.

subsystem: sales

