    # Nothing to pin: the GL defaults record, written INITIALIZEd so the slot EXISTS
    # for dfltLD to read [copybooks/wsdflt.cob:L14-L19].
    "2": {}
    # Nothing to pin: the GL final-accounts record, a pure table of 26 headings
    # [copybooks/wsfinal.cob:L11]. Written INITIALIZEd so the SLOT EXISTS for finalLD
    # to read -- and MEASURED consequence, recorded here rather than left to be
    # rediscovered: INITIALIZE sets an alphanumeric table to spaces, so finalLD's own
    # test `if Final-Record = spaces' [common/finalLD.cbl:L243] is TRUE and it takes
    # its "No Data - aborting Terminating nothing to do" path, returning zero and
    # loading NOTHING. SYSFINAL-REC therefore stays empty, which is precisely the
    # pre-state this scenario wants: the table is not among affected_tables and no
    # in-scope program writes it. The slot is still declared, because a slot that does
    # not exist at all is a read failure rather than a defined empty pre-state.
    "3": {}
    # THE PERIOD-TOTALS RECORD, AND IT STARTS FROM A KNOWN NON-ZERO STATE ON PURPOSE.
    # The nine period-total sites are the sole writers of this record and every one of
    # them ADDS [copybooks/wssys4.cob:L9-L30]. If the slot started at zero, an
    # accumulation onto zero and a fresh insert would leave the SAME value and the
    # comparison could not tell them apart. The two spare fields carry the SALES
    # prefix inside the PURCHASE group -- anomaly A-20, [copybooks/wssys4.cob:L29-L30]
    # -- and they are named here exactly as the frozen copybook misnames them.
    "4":
      sl-os-bal-last-month: "11111.11"
      sl-os-bal-this-month: "12222.22"
      sl-invoices-this-month: "3333.33"
      sl-credit-notes-this-month: "444.44"
      sl-variance: "55.55"
      sl-credit-deductions: "66.66"
      sl-cn-unappl-this-month: "77.77"
      sl-payments: "8888.88"
      sl4-spare1: "0.00"
      sl4-spare2: "0.00"
      pl-os-bal-last-month: "9999.99"
      pl-os-bal-this-month: "10101.01"
      pl-invoices-this-month: "2121.21"
      pl-credit-notes-this-month: "232.32"
      pl-variance: "34.34"
      pl-credit-deductions: "45.45"
      pl-cn-unappl-this-month: "56.56"
      pl-payments: "6767.67"
      sl4-spare3: "0.00"
      sl4-spare4: "0.00"
  # Analysis codes. THREE ROWS FOR TWO CODES, because the split-code roll-up is
  # real: "AB" and "AC" are the codes the invoice lines carry, and "A " is the
  # first-character roll-up sl055 re-reads for when va-second is not a space
  # [sales/sl055.cbl:L402-L409]. Pa-System "S" is the Sales side.
  analysis.dat:
    - Pa-System: "S"
      Pa-First: "A"
      Pa-Second: "B"
      Pa-Gl: "2000"
