  WHY A SALES BATCH CANNOT MISMATCH ITS CONTROL TOTALS
  Stated here because it is the reason the control-total-mismatch scenario is
  General-Ledger-only. sl060 writes the ENTERED and the ACTUAL totals FROM THE
  SAME VALUES, four adds in a row: add Post-Amount to input-gross / add
  Post-Amount to actual-gross / add vat-amount to input-vat / add vat-amount to
  actual-vat at [sales/sl060.cbl:L1118-L1121], with the VAT side and the
  posting code fixed just above at [sales/sl060.cbl:L1115] and
  [sales/sl060.cbl:L1116]. A Sales batch balances BY CONSTRUCTION, so there is
  no meaningful way to build an unbalanced one, and this scenario does not try.

  THE OTHER SIGN FLIPS AND THE BATCH CAP
  Three further sign flips are on this route and are reproduced as written:
  [sales/sl060.cbl:L571] on a negative current balance, which then moves the
  amount into the unapplied bucket [sales/sl060.cbl:L570-L573];
  [sales/sl060.cbl:L758], immediately before the open-item rewrite at
  [sales/sl060.cbl:L761]; and [sales/sl060.cbl:L861], inside the credit-note
  walk that starts at [sales/sl060.cbl:L848].
  THE SEED KEEPS THE BATCH UNDER NINETY-NINE ITEMS. At exactly ninety-nine
  sl060 closes the batch and opens another, if items = 99 / perform
  ca000-BL-Close / perform ca000-BL-Open at
  [sales/sl060.cbl:L1151-L1153]. That is correct behaviour and is not avoided
  because it is a defect; it is avoided because it would put a SECOND batch
  header into the capture and make the A-1 evidence harder to read, and this
