      [sales/sl060.cbl:L643-L647];
    sl-cn-unappl-this-month, add work-b at [sales/sl060.cbl:L700], which is
      UNCONDITIONAL -- the guard above it closes at
      [sales/sl060.cbl:L695-L698], so the add is a sibling statement and not
      part of it. A reader who mis-scopes that period will expect this total to
      be zero in relational mode and will be wrong.
  The fourth is fed by the unapplied-credit sweep: OTM3-Open
  [sales/sl060.cbl:L656], then the loop aa040-End-Loop
  [sales/sl060.cbl:L661] with its read [sales/sl060.cbl:L662], its
