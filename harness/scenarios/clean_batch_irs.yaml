# Flat mirrors of the two system values the runners read directly:
# [harness/run_cobol_scenario.sh:L1413] and
# [harness/run_cobol_scenario.sh:L1436-L1437]. The fan-out switch is quoted
# because IRS-Instead is a pic x [copybooks/wssystem.cob:L179] and the
# General-Ledger-only state of a single alphanumeric character is a SPACE, not
# an empty string. On this route no entry-point option carries it, so the value
# here is an assertion about the seeded row.
date_form: 1
irs_instead: " "

seed:
  data_dir: irs_clean
  files:
    - system.dat
    - irsacnts.dat
    - irsdflt.dat
    - irsfinal.dat
    - irspost.dat
    - postings2irs.dat

# Flat mirrors of the seed block, required by [harness/seed.sh:L2041] and
# honoured by [harness/seed.sh:L2054-L2063].
seed_dir: irs_clean
seed_files:
  - system.dat
  - irsacnts.dat
  - irsdflt.dat
  - irsfinal.dat
  - irspost.dat
  - postings2irs.dat

# The operations this scenario runs, in order. The Python runner reads this key
# as a flat sequence of operation NAMES and prefers it over the singular
# "operation:" key above, so the sequence holds names and nothing else; the
# oracle-side runner reads the singular key, which names the same operation, so
# both runners resolve the same single operation from this one file. The
# subsystem each name belongs to is not restated per item: each runner owns the
# operation-to-subsystem map, and this scenario's subsystem is stated once at
# top level above.
operations:
  - irs_post

# The process status each operation is expected to end with, positionally. This
# route has no calling-data block and therefore no term code at all
# [irs/irs030.cbl:L552-L554], so zero states that the section ran to completion:
# it opened the transfer file, found both control accounts, walked the fixture
# and reached the end-of-job paragraph [irs/irs030.cbl:L1702] rather than
# leaving through one of the three guards. A status that contradicts this is
# reported as a behavioural difference and the capture is still taken, so the
# table diff can corroborate it (R-4).
expected_status:
  - 0

# THE ONE PROMOTED INTERACTIVE ANSWER, AND IT IS THE DESTRUCTIVE ONE. It
# occupies the slot the sibling scenarios leave empty, so the key order stays
# identical across all eight files. Required by both runners for this operation
# and defaulted by neither, because the frozen program has no default: the
# bracketed hint in the prompt at [irs/irs030.cbl:L1716] is display text only,
# and the test at [irs/irs030.cbl:L1718-L1719] re-asks for ever on anything that
# is neither Y nor N. Both runners refuse an irs_post scenario that omits it
# [harness/run_cobol_scenario.sh:L1467-L1487],
# [harness/run_python_scenario.sh:L2428-L2445]. "Y" performs an open-output on
# the transfer file [irs/irs030.cbl:L1723], which this handler turns into a mass
# delete of every row of PSIRSPOST-REC [common/acas008.cbl:L313-L319],
# [common/acas008.cbl:L571-L574]. That is why PSIRSPOST-REC is listed below and
# why the protocol's reset-and-re-seed stage is load-bearing rather than
# hygienic. The three answer keys belonging to the payment and end-of-cycle
# routes are not declared, because none of them is on this path; leaving them
# unstated is what keeps this scenario's inputs exactly the inputs the frozen
# program takes.
irs_clear_postings: "Y"

affected_tables:
  - IRSDFLT-REC
  - IRSNL-REC
  - IRSPOSTING-REC
  - PSIRSPOST-REC
