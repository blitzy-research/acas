# The operations this scenario runs, in order: one, and the whole three-phase
# General Ledger cycle. A FLAT SEQUENCE OF NAMES -- see THE CONSUMER CONTRACT
# above for why it cannot be a sequence of blocks
# [harness/run_python_scenario.sh acas_py_read_scenario]. The Python runner reads this key
# [harness/run_python_scenario.sh acas_py_resolve_scenario] and prefers it over the singular
# operation key above; the oracle-side runner reads the singular key, which names
# the same operation, so both resolve the same run from this one file.
operations:
  - gl_post_cycle

# The process status the operation is expected to end with. THE SKIPS RAISE NO
# TERM CODE: neither [general/gl072.cbl:L292] nor [general/gl072.cbl:L307]
# touches ws-term-code, so zero states that gl070 did NOT raise the open-batch
# abort [general/gl070.cbl:L289] and that all three phases ran -- batch check and
# pre-process, sort, then transaction update. A status that contradicts this is
# reported as a behavioural difference and the capture is still taken, so the
# table diff can corroborate it (rule R-4).
# WHAT THE RUN MUST DO TO THE AFFECTED TABLES, asserted by the Python-side runner
# from canonical primary-key-ordered digests taken before and after the dispatch.
#
# `unchanged' IS THE MEASURED VALUE, AND IT IS NOT WHAT A READER OF THE SEED WOULD
# PREDICT. Batch 1 is seeded Cleared-Status 0 -- the condition name Waiting -- with
# Bcycle equal to the pinned Cyclea, so phase two DOES select it, and a reader
# reasoning from the seed alone would expect gl072's end-batch to stamp
# Cleared-Status and Posted [general/gl072.cbl:L373-L377] and end-account to rewrite
# the ledger balances [general/gl072.cbl:L379-L382]. THAT IS NOT WHAT THE COMPILED
# CYCLE DOES, and the cause is the POST-KEY ROUND TRIP rather than the primary key
# alone. Two frozen facts, both measured, and it is the second that fires the gate.
# FIRST, `Q-9' in docs/migration/ambiguity-resolutions.md established that the
# bridge's host-variable load never loads HV-POST-RRN, the table's primary key
# [common/glpostingMT.cbl:L1053-L1066], so that column is stored at zero.
# SECOND, `A-NEW-18' in docs/migration/anomaly-log.md established that `move
# WS-Post-Key to HV-POST-KEY' [common/glpostingMT.cbl:L1054] is a BYTE move from a
# group into `PIC 9(18) COMP': the nineteen-digit image truncates to
# 472328296244457520, and the read-back at [common/glpostingMT.cbl:L1085] copies the
# numerically-set bytes 06 8E 0C 15 3B 04 30 30 into WS-Post-Key -- NOT the all-`0'
# image. So the FIRST disjunct of the frozen gate, `if WS-Post-Key = zero'
# [general/gl070.cbl:L490-L491], is FALSE (a GROUP compared with ZERO is byte-wise,
# `Q-NKEY-CMP' reading 7), and the gate that ACTUALLY fires is
# `if batch not = WS-Batch-Nos' [general/gl070.cbl:L492-L493], which is byte-wise too
# and matches none of the 100,000 values a `pic 9(5)' batch number can hold
# (`Q-NKEY-CMP' reading 4). The one seeded posting is therefore discarded: the work
# file is empty, gl072 reads nothing, the end-batch rewrite is unreachable, and the
# run is a no-op over all three tables. That measured limit is also why this fixture carries TWO
# batches and ONE posting rather than a three-batch, three-posting-kind fixture: the
# store can address only one posting primary key, and a
# fixture invented to exhibit a path the store cannot reach would be evidence of
# nothing. docs/migration/scenario-diff-evidence.md section 10.5 records both facts.
#
# SO THE NO-OP IS THE SPECIFICATION AND IS REPRODUCED, NOT CORRECTED (R-4, R-6).
# Declaring `changed' here would demand that the migrated cycle FIX Q-9: it would
# fail against a faithful reproduction and pass only against a repaired one. The risk
# `changed' would have guarded against -- that a total no-op, an unlanded seed, or a
# FILE-SYSTEM-USED sending the run to flat files could satisfy this scenario -- is
# guarded instead by the runner's pre-dispatch refusal of FILE-SYSTEM-USED zero, by
# the seed fingerprint agreement, and by the scenario test's non-vacuity assertions on
# the dumped row counts.
expected_table_effect: unchanged

expected_status:
  - 0

# No answer key is declared: the General Ledger posting cycle asks nothing
# interactively, and the four promoted answers -- irs_clear_postings,
# payment_post_confirm, gl080_proceed and disk_change_option -- belong to the
# IRS, payment and end-of-cycle routes, none of which is on this path
# [harness/run_python_scenario.sh acas_py_resolve_gating_answers]. Leaving them unstated is what
# keeps this scenario's inputs exactly the inputs the frozen cycle takes.

# The tables this scenario BOUNDS the comparison to, alphabetically, and the
# order is load-bearing for the seed fingerprint
# [harness/run_python_scenario.sh acas_py_seed_fingerprint]. Two are mutated by gl072's two
# Rewrites; GLPOSTING-REC is an unchanged witness that proves the skipped
# postings' source rows survived untouched.
# WHAT `affected_tables` IS, AND WHAT IT IS NOT
#
# It is the DECLARED EFFECT of this scenario: the tables the runners assert
# changed or unchanged against `expected_table_effect`, in the order declared.
#
# It is NOT the bound of the comparison. The capture and the diff are bounded by
# ALL 22 IN-SCOPE TABLES -- `harness/dump_tables.py --all-in-scope` at stages 3
# and 7 and `harness/diff_states.py --all-in-scope` at stage 10, which
# both a hand-driven run and `tests/conftest.py` pass. A bound drawn from
# what a scenario EXPECTS to move cannot show a difference in anything it did not
# expect to move, and an empty diff is the single pass condition (AAP section
# 0.8.5). In particular both cycles perform the menu's own `overrewrite.'
# [general/general.cbl:L656-L672], which rewrites SYSTEM-REC under key 1,
# SYSDEFLT-REC under key 2 and SYSTOT-REC under key 4 -- reproduced by
# `acas_posting/cli/args.py::overrewrite' -- so those rows are compared on both
# sides rather than omitted.
affected_tables:
  - GLBATCH-REC
  - GLLEDGER-REC
  - GLPOSTING-REC
  - SYSDEFLT-REC
  - SYSTEM-REC

# =============================================================================
# THE SEED RECORDS
# =============================================================================
# Built into the declared flat files by harness/dump_tables.py --make-fixtures, which generates
# a COBOL writer per file, compiles it against the FROZEN copybooks and calls the
# FROZEN handler to write. The layouts are not restated here and cannot drift.
#
# EVERY VALUE IS A QUOTED STRING (rule R-2). COBOL's own MOVE performs the store,
# so the frozen picture clause decides alignment on the implied decimal point,
# truncation toward zero and sign placement.
#
# THE ONE EXCEPTION, AND IT IS DELIBERATE: a value written as a one-key mapping
# raw: "..." is stored BYTE FOR BYTE by reference modification instead of by an
# ordinary MOVE. It exists for exactly one row below and for exactly one reason:
# skip (a) tests if post-batch not numeric [general/gl072.cbl:L291-L292] against a
# field written from Batch pic 9(5) [copybooks/wspost.cob:L15], and NO SEQUENCE OF
# DIGITS CAN EVER MAKE THAT TRUE. Removing the data an anomaly needs is forbidden
# (rule R-4), and quietly coercing it to digits would be the same removal wearing
# a different hat -- so the seed says what it means and the builder refuses the
# form on any field where a byte-exact store would be meaningless.
seed_records:

  # Key 1 is the only system row the frozen code reads [common/acas000.cbl].
  # File-System-Used must be 1. It matters more here than anywhere: this scenario
  # is largely evidenced by ABSENCE, and a run that never reached the database at
  # all would look exactly like a run in which everything was correctly skipped
  # [copybooks/wssystem.cob:L111-L115]. That is the false-pass trap the
  # description names, and this single digit is what stands in front of it.
  # system.dat IS FOUR DIFFERENT RECORDS IN ONE RELATIVE FILE, keyed by relative
  # record number -- [copybooks/selsys.cob] declares it ORGANIZATION RELATIVE with
  # relative key `rrn', and the four system loaders each go straight to one slot:
  #   "1"  systemLD [common/systemLD.cbl:L227] -> SYSTEM-REC    (the parameter record)
  #   "2"  dfltLD   [common/dfltLD.cbl:L221]   -> SYSDEFLT-REC  (wsdflt.cob)
  #   "3"  finalLD  [common/finalLD.cbl:L221]  -> SYSFINAL-REC  (wsfinal.cob)
  #   "4"  sys4LD   [common/sys4LD.cbl:L226]   -> SYSTOT-REC    (wssys4.cob)
  # All four are 1024 bytes, which is why one relative file can hold them, and ALL
  # FOUR MUST BE PRESENT: masterLD runs every one of those loaders unconditionally
  # [common/masterLD.sh:L50-L88] and the last is tested against zero rather than 63
  # [common/masterLD.sh:L83-L86], so an unwritten slot ABORTS the seed. A slot with
  # nothing to pin is declared as {} and written INITIALIZEd -- which is a statement
  # about the pre-state rather than an omission.
  system.dat:
    "1":
      - System-Record-Version-Prime: "3"
        System-Record-Version-Secondary: "2"
        Vat-Rate-1: "20.00"
        Vat-Rate-2: "5.00"
        Vat-Rate-3: "0.00"
        Cyclea: "1"
        Period: "1"
        Run-Date: "155127"
        File-System-Used: "1"
        Date-Form: "1"
        IRS-Instead: " "
        SL-Autogen: " "
        PL-Autogen: " "
        S-Flag-P: "2"
        P-Flag-P: "2"
        Pass-Value: "0"
        Level-1: "1"
        Level-2: "1"
        Level-3: "1"
        Level-4: "1"

    # Nothing to pin: the GL defaults record. Written INITIALIZEd so the slot EXISTS
    # for dfltLD to read. Note this is NOT the IRS defaults record -- the copybook
    # says so itself, its account field being COMP here and DISPLAY there
    # [copybooks/wsdflt.cob:L6-L7].
    "2": {}
    # Nothing to pin: the GL final-accounts record, a pure table of 26 headings
    # [copybooks/wsfinal.cob:L11]. Written INITIALIZEd so the SLOT EXISTS for finalLD
    # to read -- and MEASURED consequence, recorded here rather than left to be
    # rediscovered: INITIALIZE sets an alphanumeric table to spaces, so finalLD's own
    # test `if Final-Record = spaces' [common/finalLD.cbl:L243] is TRUE and it takes
    # its "No Data - aborting Terminating nothing to do" path, returning zero and
    # loading NOTHING. SYSFINAL-REC therefore stays empty, which is precisely the
    # pre-state this scenario wants: the table is not among affected_tables and no
    # in-scope program writes it. The slot is still declared, because a slot that does
    # not exist at all is a read failure rather than a defined empty pre-state.
    "3": {}
    # The period-totals record. Written INITIALIZEd: no operation on this route
    # writes a period total -- all nine sites are in the Sales and Purchase programs
    # -- so a zero pre-state is the honest one here, and the slot must still exist
    # for sys4LD to read.
    "4":
      # THE FOUR SPARE FIELDS ARE DECLARED AS 1.00, AND THAT IS NOT A VALUE THIS
      # SCENARIO CHOSE -- IT IS THE FROZEN LOADER'S OWN RULE, RESTATED SO THE TWO
      # STORES AGREE. [common/sys4LD.cbl:L369-L390]: when ALL SIXTEEN monetary
      # totals are zero -- exactly the pre-state above -- the loader performs
      # `initialise System-Record-4 with filler' and then
      # `move 1 to sl4-spare1 sl4-spare2 sl4-spare3 sl4-spare4', carrying the
      # maintainer's own `*> Should not be needed but ..' beside it. So the loader
      # writes 1.00 into SYSTOT-REC's four spare columns whatever this flat file
      # says.
      #
      # LEAVING THEM UNDECLARED MADE THE SEED INTERNALLY INCONSISTENT: the flat
      # file held 0.00 while the RDB held the loader's 1.00. That matters because
      # ACAS is a DUAL STORE and the two cycles read different halves of it. The
      # frozen menu reads key 4 from the COBOL FLAT FILE -- `move "00" to
      # FA-RDBMS-Flat-Statuses. *> Force Cobol proc.' then `perform
      # System-Read-Indexed. *> Read Cobol file sys totals'
      # [general/general.cbl:L399-L405] -- and then writes it to the RDB in
      # `overrewrite.' [general/general.cbl:L656-L672], so it PROPAGATED the flat
      # file's 0.00 over the loader's 1.00. The migrated cycle has no flat-file
      # store at all (rule R-1), reads key 4 from the RDB and faithfully preserved
      # 1.00. Two stores that disagree at t=0 cannot be compared, and the harness's
      # seed-fingerprint guard cannot catch it because it compares ROW COUNTS only.
      #
      # Declaring them here fixes the SEED, not either cycle. Nothing is added to
      # the COBOL or the Python path (rules R-3, R-4), the loader's rule is
      # reproduced rather than contradicted, and an empty diff on SYSTOT-REC now
      # means the two cycles agree rather than that the difference was bounded out.
      # The sixteen totals stay zero, which is this route's honest pre-state, so
      # the loader's guard still fires exactly as it did before.
      # Filed as ambiguity `Q-SYS4-SPARE-SENTINEL` in
      # docs/migration/ambiguity-resolutions.md, which carries the probe that
      # measured the propagation and the reason the fix belongs to the SEED.
      sl4-spare1: "1.00"
      sl4-spare2: "1.00"
      sl4-spare3: "1.00"
      sl4-spare4: "1.00"
  # FIVE nominal accounts, not three, and SPANNING TWO PROFIT CENTRES. The key is
  # the six-digit account plus the two-digit profit centre
  # [copybooks/wsledger.cob:L13-L20], and gl071 sorts on account THEN profit
  # centre [general/gl071.cbl:L174-L175], so a second profit centre on the same
  # account number is what makes that second sort key load-bearing rather than
  # decorative. Balances are KNOWN AND NON-ZERO, several of them negative, so that
  # the accumulation at [general/gl072.cbl:L331] into
  # Ledger-Balance pic s9(8)v99 comp-3 [copybooks/wsledger.cob:L28] lands on a
  # value a wrong-cursor bug could not coincidentally reproduce.
  ledger.dat:
    - WS-Ledger-Nos: "1000"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "Bank current account"
      Ledger-Balance: "4321.09"
      Ledger-Last: "4000.00"
    - WS-Ledger-Nos: "1000"
      Ledger-PC: "1"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "2"
      Ledger-Name: "Bank current - branch 1"
      Ledger-Balance: "117.53"
      Ledger-Last: "100.00"
    - WS-Ledger-Nos: "2000"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "Sales revenue"
      Ledger-Balance: "-8765.43"
      Ledger-Last: "-8000.00"
    - WS-Ledger-Nos: "2200"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "VAT control"
      Ledger-Balance: "-1234.56"
      Ledger-Last: "-1200.00"
    - WS-Ledger-Nos: "3000"
      Ledger-PC: "0"
      Ledger-Type: "1"
      Ledger-Place: " "
      Ledger-Level: "1"
      Ledger-Name: "Office costs"
      Ledger-Balance: "777.01"
      Ledger-Last: "700.00"

  # TWO BATCHES, WITH TWO DIFFERENT DISPOSITIONS. Batch 1 is closed and waiting,
  # so gl070's phase-two filter admits it. Batch 2 is already processed, so the
  # same filter rejects it. Batch 2 has no posting row of its own because the
  # frozen GL posting loader can persist only one row per seed run (HV-POST-RRN
  # remains initialised).
  #
  # NEITHER BATCH IS POSTED, AND BATCH 1 IS NOT "ACCEPTED" -- see ANOMALY N-KEY in
  # the description. Batch 1 is admitted by the filter and then loses its posting
  # row one layer lower, at [general/gl070.cbl:L492-L493]. Its Cleared-Status and
  # Posted therefore stay exactly as declared here, which is what the scenario
  # test asserts row by row against these very values.
  # Their key order remains the contract because gl072's batch
  # fetch reads SEQUENTIALLY -- the key move at [general/gl072.cbl:L451-L452] is
  # inert and [general/gl072.cbl:L454] simply takes the next row in ascending
  # BATCH-KEY order [common/glbatchMT.cbl:L462-L479]. All three are GL, so the key
  # order is the order of WS-Batch-Nos below: 1, then 2, then 3.
  #   A = 1  closed and WAITING   -> ADMITTED by gl070's phase-two filter, then its
  #          posting row is discarded by the key guard, so nothing posts
  #   B = 2  closed and PROCESSED -> excluded by gl070's phase-two filter and
  #          retained as an unchanged rejection witness
  # Posted stays zero for batch A: stamping it is gl072's job [general/gl072.cbl:L376]
  # and gl072 never reaches a work record to stamp it for. Batch B is deliberately
  # pre-stamped, so the pair also proves the run does not blanket-stamp. Items is the
  # number of source posting rows this relational fixture can actually carry
  # [copybooks/wsbatch.cob:L23]. There is NO actual-debit or actual-credit field
  # in this record; its only four money fields are the ones set here
  # [copybooks/wsbatch.cob:L41-L44].
  batch.dat:
    - WS-Ledger: "1"
      WS-Batch-Nos: "1"
      Items: "1"
      Batch-Status: "1"
      Cleared-Status: "0"
      Bcycle: "1"
      Entered: "155127"
      Proofed: "155127"
      Posted: "0"
      Stored: "0"
      Input-Gross: "1200.00"
      Input-Vat: "200.00"
      Actual-Gross: "1200.00"
      Actual-Vat: "200.00"
      # Was "Batch A accepted", which measurement refuted: this batch is admitted by
      # gl070's phase-two filter and then posts nothing (ANOMALY N-KEY). The text is
      # seeded DATA and so appears verbatim in every published dump, where a reader
      # would have taken it as evidence of an acceptance that never happened.
      Description: "Batch A admitted"
      bDefault: "0"
      Convention: "DR"
      Batch-Def-AC: "1000"
      Batch-Def-PC: "0"
      Batch-Def-Code: "GL"
      Batch-Def-Vat: " "
      Batch-Start: "1"
    - WS-Ledger: "1"
      WS-Batch-Nos: "2"
      Items: "0"
      Batch-Status: "1"
      Cleared-Status: "1"
      Bcycle: "1"
      Entered: "155127"
      Proofed: "155127"
      Posted: "155127"
      Stored: "0"
      Input-Gross: "0.00"
      Input-Vat: "0.00"
      Actual-Gross: "0.00"
      Actual-Vat: "0.00"
      Description: "Batch B already posted"
      bDefault: "0"
      Convention: "DR"
      Batch-Def-AC: "3000"
      Batch-Def-PC: "0"
      Batch-Def-Code: "GL"
      Batch-Def-Vat: " "
      Batch-Start: "1"
  # ONE STORED ROW. POST-RRN is declared at [common/glpostingMT.cbl:L282] and is
  # the schema primary key, but bb000-HV-Load never moves WS-Post-rrn into it
  # [common/glpostingMT.cbl:L1053-L1066]. The compiled loader therefore cannot
  # persist the former six-row design. The single reachable row includes VAT,
  # producing three sorted work-file legs [general/gl070.cbl:L495-L533] and still
  # exercising the sequential nominal cursor without inventing a second SQL row.
  posting.dat:
    - WS-Post-rrn: "1"
      # THIS ROW IS UNMATCHABLE AFTER AN SQL ROUND TRIP, AND THE SKIP IT CAUSES
      # IS gl070'S, NOT gl072'S. Declared batch 1 / post 1 becomes the ten bytes
      # "0000100001"; the frozen group move stores the first eight of them as
      # 472328296244457520 [common/glpostingMT.cbl:L1054], and reading back yields
      # five CONTROL CHARACTERS in `Batch' [common/glpostingMT.cbl:L1085] because
      # the eighteen-digit picture truncated the nineteenth digit away. gl070 then
      # discards the row at `if batch not = WS-Batch-Nos go to loop'
      # [general/gl070.cbl:L492-L493] and writes no work record, which is MEASURED:
      # pretrans.tmp is zero bytes long after the run. The migrated side reaches the
      # same guard with a batch of its own that is likewise absent from batch.dat,
      # so both leave every declared table exactly as seeded. Full derivation and
      # measurement under ANOMALY N-KEY in the description above.
      Batch: "1"
      Post-Number: "1"
      Post-Code: "GL"
      Post-Date: "21/09/25"
      Post-DR: "1000"
      DR-PC: "0"
      Post-CR: "2000"
      CR-PC: "0"
      Post-Amount: "1000.00"
      Post-Legend: "A/1 invoice net of VAT"
      Vat-AC: "2200"
      Vat-PC: "0"
      Post-Vat-Side: "CR"
      Vat-Amount: "200.00"
