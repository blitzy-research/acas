  ANOMALIES A-8, A-9 AND A-10 -- THE THREE DIVERGENT MOVING AVERAGES
  All three are in docs/migration/anomaly-log.md, all three are reproduced
  rather than repaired, and all five instances of the idiom are reachable on
  this scenario's routes -- which is why the seed carries two invoices and a
  credit note for the SAME customer and the SAME supplier. Normalising these
  five blocks into one helper would be the single easiest way to fail this
  migration.
    A-8, THE DOUBLE TRUNCATION, in ba000-Sales-Comp
    [sales/sl060.cbl:L816]: guard [sales/sl060.cbl:L819-L824], then add 1 to
    sales-activety [sales/sl060.cbl:L825], then the FIRST truncation
    [sales/sl060.cbl:L826], then the SECOND [sales/sl060.cbl:L827], then
    main-exit [sales/sl060.cbl:L829]. The first truncation happens because the
    accumulator is declared with ZERO decimal places, work-2 pic s9(14) comp-3
    [sales/sl060.cbl:L206], while the value added into it carries TWO,
    work-goods pic s9(7)v99 comp-3 [sales/sl060.cbl:L218] -- so pence are
    discarded on every accumulation. The second happens because the average
    field is a binary integer, Sales-Average binary-long
    [copybooks/wssl.cob:L49], one of seven binary-long statistics fields
    [copybooks/wssl.cob:L46-L52], so the divide discards its remainder too.
    Modelling either field one digit wider would diverge from the oracle on
    almost every invoice. The two money fields of the same record
    [copybooks/wssl.cob:L54-L55] are exact decimals, and the statistics fields
    are Python integers, never decimals -- which is precisely what keeps the
    integer truncation reproducible.
    A-9, THE MISSING COUNTER INCREMENT, in ba000-Credit-Comp
    [sales/sl060.cbl:L832]: guard [sales/sl060.cbl:L835-L840], then an EXTRA
    guard the sales path does not have, if work-2 not = zero
    [sales/sl060.cbl:L841], then the add [sales/sl060.cbl:L842] and the divide
    [sales/sl060.cbl:L843]. There is NO add 1 to sales-activety anywhere in
    the section, so the FIRST credit note for a customer is silently dropped
    from the average. Its Purchase mirror behaves identically: credit-comp
    [purchase/pl060.cbl:L755], guard [purchase/pl060.cbl:L758-L763], extra
    guard [purchase/pl060.cbl:L764], add [purchase/pl060.cbl:L765], divide
    [purchase/pl060.cbl:L766], and again no increment -- where its own sibling
    purch-comp [purchase/pl060.cbl:L740] does increment, at
    [purchase/pl060.cbl:L749], before adding [purchase/pl060.cbl:L750] and
    dividing [purchase/pl060.cbl:L751].
    A-10 IS THE FACT THAT THE THREE GUARDS DISAGREE. That is the whole of it,
    and it is worth being exact because the divide is easy to misread as a
    second divergence and is not one. compute-sales-pay [sales/sl100.cbl:L497]
    exits early on a cleared date of zero [sales/sl100.cbl:L500-L501], computes
    an INTERVAL rather than a money amount [sales/sl100.cbl:L503-L504], and then
    guards on a SINGLE condition, if sales-pay-activety not = zero
    [sales/sl100.cbl:L506], where the other two guard on a PAIR -- activety and
    average both non-zero -- with an explicit else move zero
    [sales/sl060.cbl:L819-L824]. Here the else is instead expressed as a
    preceding move zero to work-b [sales/sl100.cbl:L504]. The increment is at
    [sales/sl100.cbl:L510], before the divide, as in ba000-Sales-Comp and unlike
    ba000-Credit-Comp which never increments at all; the exit is at
    [sales/sl100.cbl:L516].
    THE DIVIDE IS SPELLED DIFFERENTLY AND COMPUTES THE SAME VALUE. divide work-b
    by sales-pay-activety giving sales-pay-average [sales/sl100.cbl:L511] and
    divide sales-activety into work-2 giving sales-average
    [sales/sl060.cbl:L827] BOTH compute accumulator / counter: INTO names the
    divisor first and BY names the dividend first, so the two forms are
    equivalent and neither inverts the other. The difference is textual, it is
    transcribed for traceability, and it carries NO arithmetic consequence --
    calling it an inverted divide would assert a behavioural difference that
    does not exist. What does differ, and what the parity claim rests on, is the
    guard and the counter handling above.
    Its Purchase mirror is the same shape: [purchase/pl100.cbl:L497-L498] and
    [purchase/pl100.cbl:L500-L502].
  So the seed must make all five reachable, and a run whose seed leaves any of
  them latent has not tested the parity claim over it.

