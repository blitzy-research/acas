# =============================================================================
# ACAS -- COBOL to Python migration of the batch posting cycle.
#
# SCENARIO period_end_totals -- the period-total accumulation scenario, and the
# ONLY multi-operation, multi-subsystem definition in this directory. Four
# posting operations run back to back across both trading ledgers so that all
# NINE period-total write sites fire in one seeded state, and the focal table
# is SYSTOT-REC. The eight the protocol expects, per Agent Action Plan section
# 0.8.5 and [harness/docker-compose.yml "STAGES."], are: clean_batch_gl,
# clean_batch_sl, clean_batch_pl, clean_batch_irs, mixed_accepted_rejected,
# period_end_totals, control_total_mismatch, empty_batch. This file replicates
# the canonical shape of harness/scenarios/clean_batch_gl.yaml and is, in its
# data, the union of clean_batch_sl.yaml and clean_batch_pl.yaml plus the two
# cash and payment routes.
#
# NO USER RULES DOCUMENT EXISTS FOR THIS PROJECT. The rules facility reports
# that none was provided, so there is no on-disk rules file to consult and no
# reader of this file should go looking for one. The six binding rules R-1 to
# R-6 are user-specified by content and intent and live in the Agent Action
# Plan at section 0.7.2, whose own note is that their exact wording is
# retrievable from the requirements rather than from the rules facility. Where
# those rules are silent this file holds to enterprise-standard best practice,
# and nothing here has been invented to fill a gap.
#
# THIS FILE IS INERT DATA (rule R-1, no COBOL at runtime). It carries no shell
# command, no compiler invocation, no Python expression, no non-standard YAML
# tag and no path into a build tree: both runners read it with yaml.safe_load
# or with a plain top-level scalar reader, and the file only DESCRIBES the
# inputs -- the runner scripts are the only things that act on them. Nothing
# else belongs in this directory either: the harness tree is never on the
# package import path (Agent Action Plan section 0.3.1), so there is no
# __init__.py here.
#
# NO ACCOUNTING VALUE APPEARS AS A YAML SCALAR ANYWHERE IN THIS FILE (rule
# R-2, zero binary floating point). YAML parses a bare decimal literal as a
# binary float, so every money and quantity figure lives in the seeded flat
# files as decimal text in the frozen record layout, never here. That matters
# more in this file than in any of its siblings, because its focal table
# accumulates money across nine write sites and the defects it exists to
# reproduce are themselves truncation defects. Only these keys hold bare
# integers, and each one is a whole-number COBOL field: run_date,
# run_date_binary, cyclea, period, date_form, file_system_used, s_flag_p,
# p_flag_p and term_code. There is no scientific notation and no infinity or
# not-a-number token in this file.
#
# NOTHING HERE DEFINES OR ALTERS THE SCHEMA (rule R-3). affected_tables SELECTS
# from the 33 frozen tables of mysql/ACASDB.sql; it never adds a table, a
# column, an index or a constraint. operations is a strictly ordered list and
# its steps run one at a time, matching the single-threaded COBOL -- and in
# THIS file that ordering is load-bearing rather than decorative, for the
# reasons set out under the heading on operation order below. NO KEY HERE ASKS
# FOR SIMULTANEOUS EXECUTION OF ANY KIND, and no halt rule between steps is
# relied on: an operation that must not run is simply not listed.
#
# KEYS APPEAR IN A FIXED ORDER, identically in all eight scenario files, and
# the file is UTF-8, ASCII-only, LF-terminated, two-space indented and free of
# tabs. It carries no wall-clock reading, no host identity, no process id, no
# random value and no absolute host path, so two captures of one scenario are
# byte-identical (rule R-6).
# =============================================================================

name: period_end_totals

description: |
  PURPOSE
  Four posting operations run back to back across the Sales and Purchase
  ledgers -- invoice post, cash post, order post, payment post, in that order
  -- so that ALL NINE period-total write sites fire against one seeded state,
  and the resulting SYSTOT-REC must match the compiled COBOL oracle byte for
  byte after normalisation. Those nine sites are the sole writers of the
  totals record, which is what makes this scenario verifiable by inspecting
  one table. Nothing is expected to abort: every operation is declared to end
  with term code zero, and the empty normalised diff is the only pass
  condition.
  This is the only definition in this directory that drives more than one
  operation and the only one that spans more than one menu, so several
  decisions below exist purely because of that and are stated rather than left
  to be rediscovered.

  PYTHON MODULES EXERCISED (rule R-5, full traceability)
    acas_posting/programs/sl055_invoice_extract_analysis.py from sales/sl055.cbl
    acas_posting/programs/sl060_invoice_posting.py          from sales/sl060.cbl
    acas_posting/programs/sl100_cash_posting.py             from sales/sl100.cbl
    acas_posting/programs/pl055_order_proof_extract.py   from purchase/pl055.cbl
    acas_posting/programs/pl060_order_posting.py         from purchase/pl060.cbl
    acas_posting/programs/pl100_payment_posting.py       from purchase/pl100.cbl
  driven, in the declared order, by
    acas_posting/cli/sl_invoice_post.py
    acas_posting/cli/sl_cash_post.py
    acas_posting/cli/pl_order_post.py
    acas_posting/cli/pl_payment_post.py
  each of whose process exit status IS WS-Term-Code [copybooks/wscall.cob:L10].

  THE FOUR OPERATIONS AND THEIR FROZEN MENU PARAGRAPHS
  Each name below resolves, on the oracle side, to one menu letter and one
  dispatch paragraph, and on the Python side to the correspondingly named
  entry point. The paragraph numbers were read out of this checkout.
    1. sl_invoice_post -- Sales menu letter G, "(G)  Sales Transactions Post"
       [sales/sales.cbl:L545], dispatched by load07 [sales/sales.cbl:L756],
       which carries the maintainer's own comment "Sales trans posting". IT IS
       load07 AND NOT load08: load08 [sales/sales.cbl:L770] dispatches sl080,
       Payment Input, which is out of scope. The paragraph moves sl830
       [sales/sales.cbl:L759], performs load00 [sales/sales.cbl:L760], gates on
       the term code [sales/sales.cbl:L761-L762], moves sl055
       [sales/sales.cbl:L763], performs load000 [sales/sales.cbl:L764], gates
       again [sales/sales.cbl:L765-L766], moves sl060
       [sales/sales.cbl:L767] and transfers to load000
       [sales/sales.cbl:L768].
    2. sl_cash_post -- Sales menu letter K, load11 [sales/sales.cbl:L792],
       comment "Sales payments posting", moving sl100
       [sales/sales.cbl:L795] and transferring to load000
       [sales/sales.cbl:L796].
    3. pl_order_post -- Purchase menu letter H, load08
       [purchase/purchase.cbl:L752]. Two divergences from its Sales twin are
       preserved here rather than harmonised: the pl830 dispatch is COMMENTED
       OUT [purchase/purchase.cbl:L755-L758], and there is NO abort gate
       between the two programs at all -- pl055
       [purchase/purchase.cbl:L759], perform load000
       [purchase/purchase.cbl:L760], pl060 [purchase/purchase.cbl:L761],
       transfer to load000 [purchase/purchase.cbl:L762].
    4. pl_payment_post -- Purchase menu letter L, load12
       [purchase/purchase.cbl:L786], moving pl100
       [purchase/purchase.cbl:L789] and transferring to load000
       [purchase/purchase.cbl:L790].
  All four routes go through a load000 variant, which issues a FIVE-parameter
  call -- ws-calling-data, System-Record, WS-System-Record-4, to-day,
  file-defs -- at [sales/sales.cbl:L702-L707] and
  [purchase/purchase.cbl:L695-L699]. The third parameter is the totals record
  this scenario is about. A fifth menu divergence sits immediately below each
  call and is also preserved: Sales performs overrewrite and then gobacks on a
  serious error [sales/sales.cbl:L710-L712], where Purchase transfers to
  overrewrite instead [purchase/purchase.cbl:L703-L704].

  WHY THE OPERATION ORDER IS LOAD-BEARING (rule R-3, strict sequentiality)
  The list is ordered, the steps run one at a time, and the order is part of
  the scenario rather than a presentation choice.
    Operation 3 CONDITIONS STATE THAT OPERATION 4 READS. pl060 sets P-Flag-I
    to two, P-Flag-A to one and Oi-5-Flag to "Y"
    [purchase/pl060.cbl:L373-L375]. Oi-5-Flag is
    [copybooks/wssystem.cob:L221]; its Sales sibling Oi-3-Flag
    [copybooks/wssystem.cob:L219] carries the maintainer's own comment asking
    why sl060 uses it.
    OPERATIONS 1 AND 3 ESTABLISH THE LEDGER ROWS that operations 2 and 4 then
    rewrite, so running a cash route before its invoice route would post
    against a state that never existed in the oracle run.
    ANOMALY A-17's READ-BACK CHAIN CROSSES OPERATIONS. The move at
    [sales/sales.cbl:L756]'s route -- specifically [sales/sl060.cbl:L1173] --
    writes RRN into the Postings field of the system record, and the next
    route reads it straight back as the batch start
    [purchase/pl100.cbl:L564]. Reordering the list changes what that read
    returns.
  Because they run in sequence and never together, this file declares no key
  that would ask for them to run at the same time.

  THIS IS THE ONLY TWO-MENU FILE, SO subsystem IS THE EMPTY SCALAR
  Every sibling names one subsystem because every sibling drives one menu.
  This file drives two, and the oracle-side runner cross-checks the file's
  subsystem against the subsystem of the operation it was actually asked to
  run, refusing the pair when they disagree
  [harness/run_cobol_scenario.sh acas_select_operation]. Its own operation map sends
  sl_invoice_post and sl_cash_post to the Sales menu and pl_order_post and
  pl_payment_post to the Purchase menu, so NO SINGLE NAME IS TRUE FOR ALL FOUR
  OPERATIONS: naming either menu would make two of the four invocations fail
  on a cross-check rather than on anything behavioural. The empty scalar is
  the only value that is true for a file spanning two menus, and the guard
  reads it as "the file does not say", so the subsystem comes from the
  operation being run -- which is exactly right, because the runner re-selects
  the operation before each drive and every subsystem-dependent value follows
  that selection: the menu executable, the pinned 24x80 geometry, the keystroke
  plan and the date-entry program. The key is kept, rather than dropped, so that
  the key set stays identical across all eight files. Nothing else reads it: the
  Python runner derives the subsystem from its own operation map, and the
  seeder, the reset step, the capture step, the normaliser and the diff step
  never look at it.

  THE PINNED CLOCK -- TWO OBSERVABLES, NEVER A HOST READING
  The date is pinned to the same pair of values as all seven siblings, so a
  cross-scenario reader sees one date and so two runs of this scenario are
  byte-identical (rule R-6). The pair is the text form, to-day pic x(10) in
  DD/MM/CCYY, and the binary form, Run-Date binary-long
  [copybooks/wssystem.cob:L67]. Both are quoted or integral as their COBOL
  field requires: the text is a quoted string because it is alphanumeric, the
  binary is a bare integer because it is a whole-number field.
  Pinning exactly these two is sufficient, and that is measured rather than
  hoped for: none of the six programs on these routes reads a clock at all,
  the date arriving purely through linkage from the menu, and the menus
  themselves derive the text form from the binary one through the date module
  [general/general.cbl:L465-L467]. There is no other time source on this path,
  no random seed, and no ordering nondeterminism from a secondary index.

  PURE GENERAL LEDGER MODE IS TWO SEEDED FIELDS, NOT ONE
  This is the single most expensive thing to get wrong in this file, so it is
  stated before anything else about the seed.
  The FIRST field is the fan-out switch, verbatim at
  [copybooks/wssystem.cob:L179-L181]:
    05  IRS-Instead     pic x. / 88  IRS-Used  value "Y". /
    88  IRS-Both-Used   value "B".
  A space selects the General Ledger only, Y selects IRS instead of it, and B
  selects IRS as well as it. Those two condition names are the field's ONLY
  ones: there is no third value and in particular no N. A pic x cannot hold an
  empty string, so a space is the more faithful spelling of the
  General-Ledger-only state, and both runners accept either spelling and
  converge them. sl060 tests the switch at [sales/sl060.cbl:L1039],
  [sales/sl060.cbl:L1126] and [sales/sl060.cbl:L1175]; pl100 tests it at
  [purchase/pl100.cbl:L566] and [purchase/pl100.cbl:L629].
  THE SECOND FIELD IS NOT ON THAT SWITCH AT ALL, and reading only the fan-out
  tests would miss it. G-L is a condition name on the installed-ledger level
  byte: 88  G-L  value 1 at [copybooks/wssystem.cob:L85], inside the Level
  group at [copybooks/wssystem.cob:L83-L96]. Pure General Ledger mode is
  therefore IRS-Instead equal to a space AND Level-1 equal to one. With
  Level-1 anything else, G-L is FALSE and the whole General Ledger side of
  both posting programs disappears -- no batch, no posting record, and
  anomaly A-17's move never executing [sales/sl060.cbl:L1172-L1173],
  [purchase/pl060.cbl:L1027-L1028]. GLBATCH-REC and GLPOSTING-REC would then
  be empty on BOTH sides and the diff would be empty for the wrong reason,
  which is a silent false pass of the same class as the file_system_used trap
  below. NEITHER RUNNER ASSERTS Level-1: the oracle-side runner checks the
  flag, the cycle, the date form, the fan-out switch and the autogen switch,
  and stops there. It is closed here, by the seed contract, and nowhere else.

  ANOMALY A-PL100-A -- THE DECISIVE, INDEPENDENT REASON irs_instead IS A SPACE
  The plan already requires the fan-out switch to be pinned explicitly so that
  the affected-table list is unambiguous. On THIS scenario's routes there is a
  second and stronger reason, and it is a defect: in pl100 the OPEN of the
  posting file and the WRITES to it are guarded by DIFFERENT conditions.
  The open, verbatim at [purchase/pl100.cbl:L566-L570], branches on irs-used
  ALONE and the two arms are mutually exclusive -- SPL-Posting-Open-Extend
  [purchase/pl100.cbl:L567] or GL-Posting-Open
  [purchase/pl100.cbl:L569]. The writes do not agree with it: the transfer
  write is guarded by irs-used OR IRS-Both-Used
  [purchase/pl100.cbl:L629] and performed at [purchase/pl100.cbl:L644], and
  the General Ledger write is guarded by IRS-Both-Used OR G-L
  [purchase/pl100.cbl:L646-L647] and performed at
  [purchase/pl100.cbl:L649]. Because 88 IRS-Used matches ONLY "Y":
    in "B" mode the open takes the else arm, so the transfer file is NEVER
      OPENED, and the write at [purchase/pl100.cbl:L644] still fires;
    in "Y" mode the open takes the first arm, so the posting file is never
      opened, and the write at [purchase/pl100.cbl:L649] still fires whenever
      G-L is true -- which it independently can be, G-L being a different
      field entirely;
    ONLY the General-Ledger-only state, a space with Level-1 equal to one,
      opens exactly what it writes.
  So any value other than a space makes this scenario incoherent before it
  reproduces anything, and the defect is REPRODUCED rather than repaired
  (rule R-4). It is entry A-PL100-A of docs/migration/anomaly-log.md section
  15, registered under that globally unique name because the register's own
  A-NEW-5 is a different defect entirely -- "Purchase has no abort gate at
  all" -- and the two used to share one number. The old-to-new map is in that
  section. The same
  paragraph also supplies the batch defaults "DR", "PL" and "I"
  [purchase/pl100.cbl:L561-L563], the A-17 read-back
  [purchase/pl100.cbl:L564], the record-number move
  [purchase/pl100.cbl:L572] and the section exit
  [purchase/pl100.cbl:L574].
  THE SWITCH REACHES THE RUN TWICE AND BOTH ROUTES MUST AGREE. The Sales and
  Purchase entry points take
  the switch as an option whose blank state the harness spells as N, while the
  seeded system row carries the literal space; the value below is the same
  state expressed once, and the seeded row must carry it too.

  THE SEEDED SYSTEM RECORD -- THE WAYS THIS SCENARIO CAN LIE
  Every value in the system block below must ALSO be carried by the seeded
  system flat file, because the COBOL reads it from there and not from argv.
    1. file_system_used = 1 IS THE FALSE-PASS TRAP. A handler routes to the
       MySQL bridge and returns only when the flag is non-zero: if not
       FS-Cobol-Files-Used / move RDBMS-Flat-Statuses to FA-RDBMS-Flat-Statuses
       / perform ba-Process-RDBMS / go to AA-Main-Exit
       [common/acas007.cbl:L316-L320]. The field and its condition names are
       [copybooks/wssystem.cob:L111-L114], with the valid range at
       [copybooks/wssystem.cob:L122]. Seeded as zero, the compiled run writes
       COBOL files and touches no table, BOTH captures come back empty, the
       diff is empty and the scenario reports a pass having proved nothing.
       IT ALSO MAKES THE DECLARED TERM CODE PROVABLE. The only term code
       either sl055 or pl055 can raise is eight, and both wrap that block in
       if FS-Cobol-Files-Used -- guard [sales/sl055.cbl:L326], raise
       [sales/sl055.cbl:L344], close [sales/sl055.cbl:L347-L348]; guard
       [purchase/pl055.cbl:L266], raise [purchase/pl055.cbl:L286], close
       [purchase/pl055.cbl:L289-L290]. With the flag at one that block is
       unreachable, so term code eight cannot occur. The only other code the
       harness can observe anywhere is five, the General Ledger open-batch
       abort [general/gl070.cbl:L289], and this file never runs that program.
       Zero, four times, is therefore an assertion with a proof behind it.
    2. cyclea must be NON-ZERO or the menu diverts to system setup instead of
       running anything: if scycle = zero / go to call-system-setup
       [general/general.cbl:L462-L463]. The field is
       [copybooks/wssystem.cob:L62-L63], where Scycle is a redefinition of
       Cyclea, which is why one seeded byte answers to both names.
    3. period and date_form are [copybooks/wssystem.cob:L64] and
       [copybooks/wssystem.cob:L128-L132]; one selects the UK ordering
       DD/MM/YYYY. period is INERT in this file and in every other, for the
       reason recorded under the end-of-cycle heading below.
    4. sl_autogen must be a SPACE -- see the next heading, where it is the
       whole mitigation for a program that runs on one side only.
    5. s_flag_p and p_flag_p must both be TWO -- see the heading after that,
       where they are hard preconditions without which more than half of this
       scenario silently does nothing.
  The RDBMS credential fields of the same record are a separate precondition
  and are treated on their own below.

  s_flag_p AND p_flag_p ARE HARD PRECONDITIONS, NOT DECORATION
  Both cash programs open with a ONE-SHOT LATCH that abandons the run outright
  unless the flag already equals two, and the abandonment is silent as far as
  any table is concerned.
    sl100: if S-Flag-P not = 2 / display SL137 / display SL002 / accept
      ws-reply / go to menu-exit / end-if
      [sales/sl100.cbl:L296-L301]. The paragraph the run would otherwise fall
      into is menu-return [sales/sl100.cbl:L303]; the exit it takes instead is
      menu-exit [sales/sl100.cbl:L476] and then exit program
      [sales/sl100.cbl:L477].
    pl100: the same structure at [purchase/pl100.cbl:L289-L294], with
      menu-return at [purchase/pl100.cbl:L296] and the exit pair at
      [purchase/pl100.cbl:L467-L468].
  The fields are S-Flag-P [copybooks/wssystem.cob:L226] and P-Flag-P
  [copybooks/wssystem.cob:L206], each sitting beside its own amend and invoice
  siblings, S-Flag-A and S-Flag-I [copybooks/wssystem.cob:L224-L225] and
  P-Flag-A and P-Flag-I [copybooks/wssystem.cob:L204-L205], all of which the
  maintainer's own comments question the use of.
  SO WITHOUT BOTH FLAGS SEEDED AS TWO, OPERATIONS 2 AND 4 DO NOTHING AND THIS
  SCENARIO REACHES ONLY FOUR OF ITS NINE WRITE SITES -- sites five and nine
  never fire, and the diff over SYSTOT-REC is still empty, so the failure is
  invisible. That is why they are pinned here and restated in the seed
  contract.
  BOTH LATCHES ARE CLEARED BY THE RUN. sl100 moves "Y" into Oi-3-Flag and zero
  into S-Flag-P on its way out [sales/sl100.cbl:L473-L474], and pl100 does the
  same for Oi-5-Flag and P-Flag-P [purchase/pl100.cbl:L464-L465]. They are
  one-shot by design, so a SECOND run of this scenario against the same
  database posts nothing on operations 2 and 4: the protocol's reset and
  re-seed stage is what makes the run repeatable, and it is load-bearing here
  rather than hygienic.

  ONE PROGRAM RUNS ON THE ORACLE SIDE AND NEVER ON THE PYTHON SIDE
  The Sales invoice-post paragraph dispatches sl830 before sl055
  [sales/sales.cbl:L759], with the comment "In case autogen is use",
  corroborated in the program's own change log
  [sales/sales.cbl:L121]. The sl800 to sl830 series is out of scope, so the
  migrated entry point does not invoke it, while the oracle-side runner drives
  the MENU and therefore does. That asymmetry is deviation D-5.
  THE MITIGATION IS THE PINNED SWITCH, AND IT IS PROVABLE FROM THE SOURCE.
  sl830 takes the four-parameter linkage [sales/sl830.cbl:L260-L263], enters
  aa000-Main [sales/sl830.cbl:L266], and its FIRST TWO EXECUTABLE STATEMENTS
  are if SL-Autogen not = "Y" / goback [sales/sl830.cbl:L269-L270]. With the
  switch seeded as a space the program returns before touching anything, and
  it never sets a term code -- load00 having zeroed it on entry
  [sales/sales.cbl:L680]. The field is [copybooks/wssystem.cob:L274]; its
  Purchase sibling PL-Autogen [copybooks/wssystem.cob:L209] carries the
  maintainer's own note that it is not used yet.
  CONSEQUENCES THAT ARE PART OF THIS FILE'S CONTRACT: THE TWO
  AUTOMATIC-GENERATION FLAT FILES ARE NEVER SEEDED -- two of the eight
  out-of-scope names of [common/masterLD.sh:L93-L116], the Sales one at
  [common/masterLD.sh:L113] and the Purchase one at
  [common/masterLD.sh:L108] -- the four automatic-generation tables their
  loaders fill are NEVER listed among the affected tables, and both runners
  assert after the run that all four still hold zero rows. The resolution is
  assertion, not compensation: nothing is subtracted from either capture, which
  is what makes the deviation safe to live with rather than merely stated in
  prose.
  THE PURCHASE SIDE HAS NO SUCH ASYMMETRY, because its pl830 dispatch is
  commented out [purchase/purchase.cbl:L755-L758]. The two menus therefore
  disagree with each other, and that divergence is PRESERVED rather than
  harmonised (rule R-4); it is recorded in
  docs/migration/ambiguity-resolutions.md.


  ALL NINE PERIOD-TOTAL WRITE SITES, AND WHAT EACH ONE NEEDS FROM THE SEED
  This is the reason the scenario exists, so every site is named with its
  guard, its target field and the seeded row that reaches it. The document-type
  codes are one Receipt, two Invoice, three Credit Note, four Proforma; the
  open-item type codes used below are three Credit Note, five Payment, and six
  for the else-branch case.
    SITE 1  [sales/sl055.cbl:L675] adds the document total to
      sl-invoices-this-month, guarded by if ih-type = 2
      [sales/sl055.cbl:L674]. NEEDS at least one Sales invoice that survives
      all four of sl055's filters.
    SITE 2  [sales/sl055.cbl:L677] adds it to sl-credit-notes-this-month,
      guarded by if ih-type = 3 [sales/sl055.cbl:L676]. NEEDS at least one
      Sales credit note. The total itself is built by the nine addends at
      [sales/sl055.cbl:L670-L673], guarded to exclude receipts.
    SITE 3  [sales/sl060.cbl:L641] adds total-deduct to sl-credit-deductions
      and is UNGUARDED -- it fires on every run of the section, adding zero
      when there is nothing to add. NEEDS a seeded late deduction for the
      figure to be non-zero; the apportionment that consumes it is guarded
      separately at [sales/sl060.cbl:L643-L647].
    SITE 4  [sales/sl060.cbl:L700] adds work-b to sl-cn-unappl-this-month and
      is likewise UNCONDITIONAL -- it sits OUTSIDE the guard immediately above
      it [sales/sl060.cbl:L695], which governs only the printed line. NEEDS an
      OPEN Sales credit note, type three and not closed, so that
      ba000-Cr-Swop fires [sales/sl060.cbl:L671-L672] and the figure is
      non-zero; the closed-item test that would skip it is
      [sales/sl060.cbl:L668-L669].
    SITE 5  [sales/sl100.cbl:L404] is add oi-paid to t-paid sl-payments --
      TWO RECEIVERS in one statement, one a run total and one the period
      total. Guarded by if oi-type = 5 [sales/sl100.cbl:L402], with an
      else-branch for type six that feeds different fields entirely
      [sales/sl100.cbl:L407-L410]. NEEDS at least one Sales payment row, and
      reaching it at all NEEDS s_flag_p seeded as two.
    SITE 6  [purchase/pl055.cbl:L582] adds the document total to
      pl-invoices-this-month, guarded by if ih-type = 2
      [purchase/pl055.cbl:L581]. NEEDS at least one Purchase invoice.
    SITE 7  [purchase/pl055.cbl:L584] adds it to pl-credit-notes-this-month,
      guarded by if ih-type = 3 [purchase/pl055.cbl:L583]. NEEDS at least one
      Purchase credit note. Its total is built from FOUR addends on ONE line
      [purchase/pl055.cbl:L580] where the Sales twin uses nine over three
      lines -- preserved, not harmonised.
    SITE 8  [purchase/pl060.cbl:L628] adds work-b to pl-cn-unappl-this-month
      and is UNCONDITIONAL, outside the guard above it
      [purchase/pl060.cbl:L623]. NEEDS an open Purchase credit note.
