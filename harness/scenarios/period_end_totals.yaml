  # instead of the intended four-operation journey. The renumbering preserves key
  # order and every accounting field. The type is what selects the route: sl100
  # discards anything that is not 2, 5 or 6 outright
  # [sales/sl100.cbl:L338-L339].
  #   type 2, batch and item BOTH non-zero -> compute-sales-pay
  #     [sales/sl100.cbl:L341-L345], which is the average variant with the SINGLE
  #     guard [sales/sl100.cbl:L506] where the other two guard on a pair -- A-10. Its
  #     divide [sales/sl100.cbl:L511] is spelled BY rather than INTO and computes the
  #     same accumulator / counter value, so the operand order is not a divergence.
  #   type 5, OPEN, batch and item non-zero -> THE NINTH... no, the FIFTH period
