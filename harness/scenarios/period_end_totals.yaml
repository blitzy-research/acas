  WHY EXACTLY THESE FOURTEEN TABLES -- A MEASURED VERB CENSUS
  The list below is the UNION of the two clean-batch trading scenarios, and it
  was arrived at by counting facade verbs across the six programs these four
  operations run rather than by inference. Counting perform of an entity verb
  in sl055, sl060, sl100, pl055, pl060 and pl100 gives: GL-Batch 14,
  GL-Posting 18, SPL-Posting 18, Sales 9, Purch 9, Value 49, Analysis 14,
  Invoice 7, PInvoice 6, OTM3 19, OTM5 18 -- and GL-Nominal ZERO, System ZERO.
  Those counts map onto the tables one to one, with two handlers owning a
  header table and a lines table each: Invoice covers SAINVOICE-REC and
  SAINV-LINES-REC, PInvoice covers PUINVOICE-REC and PUINV-LINES-REC.
  GLLEDGER-REC IS ABSENT, DELIBERATELY, because the census found no GL-Nominal
  verb in any of the six programs: the nominal ledger is written by the
  General Ledger cycle, which this scenario does not run. Listing it would add
  a table that is identical on both sides for a reason that has nothing to do
  with this scenario, and would dilute the bound the list exists to place on
  the comparison.
  PSIRSPOST-REC IS LISTED AS AN UNCHANGED WITNESS. In pure General Ledger mode
  the transfer writes are guarded off -- [sales/sl060.cbl:L1039] and
  [purchase/pl100.cbl:L629] both require the fan-out switch to be set -- so
  the table should come back exactly as seeded. Comparing it is how the
  scenario proves the fan-out switch really was a space on BOTH sides; a
  difference here would mean one leg had fanned out and the other had not.
  ANALYSIS-REC IS AN UNCHANGED WITNESS TOO, unless the seed is incomplete: the
  extract paragraphs read analysis and value codes indexed, on both sides, and
  a code the invoices reference but the seed omits turns into a read failure
  rather than a difference. The Purchase side additionally selects its own
  group by system byte [purchase/pl055.cbl:L403].
  THE sl055-TO-sl060 AND pl055-TO-pl060 HANDOFFS ARE WORK FILES, NOT TABLES,
  which is worth stating because a reader counting tables will look for them.
  pl055 writes its extracted header natively [purchase/pl055.cbl:L587], and
  the frozen schema has no table for that file. They are modelled in Python as
  ordered in-process sequences and nothing about them appears in any dump;
  their only consequence for the harness is that the COBOL side needs a
  writable working directory.

  SYSTOT-REC IS THE FOCAL TABLE, AND IT CARRIES A RECORDED CAVEAT (R-4, R-6)
  On this route the totals record is as in-scope as a table can be: ALL NINE
  period-total write sites fire, and those nine sites are its sole writers.
  BUT THE WRITING IS TO THE LINKAGE COPY IN MEMORY, NOT TO THE DATABASE. A
  census across all twelve in-scope programs finds NO System facade verb in
  any of them -- searching each of gl051, gl070, gl071, gl072, gl080, sl055,
  sl060, sl100, pl055, pl060, pl100 and irs030 for a performed System open,
  close, read, write, rewrite, start or delete returns zero every time -- so no
  in-scope program persists it.
  WHAT PERSISTS IT IS THE OUT-OF-SCOPE MENU. On the two routes this file
  drives, overrewrite at [sales/sales.cbl:L628] rewrites key one, the system
  record [sales/sales.cbl:L631-L635], and key four, the totals record
  [sales/sales.cbl:L636-L638], to the relational store, closes
  [sales/sales.cbl:L639] and then repeats the pair against the COBOL file
  [sales/sales.cbl:L645-L657]; the Purchase menu does the same at
  [purchase/purchase.cbl:L621], keys one and four at
  [purchase/purchase.cbl:L624-L628] and
  [purchase/purchase.cbl:L629-L631]. BOTH TRADING MENUS WRITE ONLY THOSE TWO
  KEYS, where the General menu writes THREE -- keys one, two and four at
  [general/general.cbl:L657-L672], repeated against the COBOL file at
  [general/general.cbl:L675-L691] -- a divergence between the menus that is
  also preserved. And load000 reaches overrewrite on EVERY call, because its
  two branches, term code below eight [sales/sales.cbl:L708-L709] and above
  seven [sales/sales.cbl:L710-L712], are exhaustive over a two-digit field;
  the Purchase equivalents are [purchase/purchase.cbl:L701-L702] and
  [purchase/purchase.cbl:L703-L704]. AND THE MIGRATED ENTRY POINTS REPRODUCE THAT
  PARAGRAPH rather than skipping it, WHICH IS WHY THIS SCENARIO CAN BE COMPARED AT
  ALL. They have no menu, but the paragraph's RDB arm is not a menu concern -- it is
  the only part of a menu with a database effect -- so it lives in
  acas_posting/cli/args.py as overrewrite() and every one of the four routes this
  file drives performs it. `slpl_menu_state' carries the totals record precisely so
  that key 4 is rewritten, and key 1 is rewritten unconditionally, so both cycles
  reach both writes. Keys one, two and four are rewritten in the frozen order and the
  close is issued on key four, exactly as [general/general.cbl:L656-L672] does it;
  the Sales and Purchase two-key set falls out of the same implementation because the
  defaults record is simply absent from those menus' state. The two call sites -- the
  `> 7' arm of load000 and the quit -- are guarded mutually exclusively, so a run
  performs the paragraph exactly ONCE.
  WHAT THE MIGRATION DOES NOT REPRODUCE is the SECOND leg: the same rewrites against
  the ISAM parameter file at [general/general.cbl:L676-L691],
  [sales/sales.cbl:L645-L657] and [purchase/purchase.cbl:L638-L650], because there is
  one store and not two. That residue is carried as Q-CLI-OVERREWRITE-SECOND-LEG and
  it is the only half still open.
  SO SYSTOT-REC PARITY DEPENDS ON THAT KEY-FOUR REWRITE, WHICH IS IN PLACE, AND THIS
  IS THE SCENARIO WHERE THE OVERLAP IS UNAVOIDABLE: every other definition can leave
  the question latent, and this one cannot, because the totals record is the very
  thing it exists to compare -- which is why SYSTOT-REC is on the affected-table
  list. It is the unavoidable overlap of harness deviation D-4, it is recorded
  honestly here rather than papered over, and it is arbitrated against the compiled
  oracle in
  docs/migration/ambiguity-resolutions.md.
  KEY ONE IS COVERED TWICE -- BY THE DUMP AND BY A DIGEST OF IT. SYSTEM-REC is on this
  file's affected-table list and in every capture, with exactly two of its 169 columns
  withheld: `RDBMS-PASSWD char(12)' [copybooks/wssystem.cob:L139] and `PASS-WORD',
  replaced on BOTH sides by harness/dump_tables.py's REDACTED_COLUMNS inside
  render_value, because a dump is SELECT * and a capture is committed evidence. The
  other 167 are compared by value. Both runners ALSO record a canonical digest of the
  row before and after their dispatch and tests/conftest.py compares the two post-run
  digests, which is a parity check over all 169 columns including those two -- a sha256
  of the canonical dump is not the dump.
  THE OBJECTION TO DECLARING THE ROW WAS MEASURED, NOT ARGUED. Its content depends on
  what the route DID -- the run-date stamp, the IRS allocator, the one-shot latches, and
  `Date-Form', itself a SYSTEM-REC column [copybooks/wssystem.cob:L127] the frozen date
  sections write back -- so declaring it could in principle tie expected_table_effect to
  fields no scenario reasons about. It does not: the digest HOLDS on all four scenarios
  declaring `unchanged' and MOVES on every one declaring `changed'. This file declares
  `changed', and the row is one of the things that moves.
  IT IS NOT, AND MAY NEVER BE, RESOLVED WITH AN IGNORE-LIST IN THE DIFF STAGE.
  That stage is required to have no ignore-list, no tolerance list and no
  known-difference allowance: the comparison is bounded by ALL 22 IN-SCOPE
  TABLES, and this file's affected-table list is the scenario's DECLARED EFFECT
  rather than the bound. Suppressing a column there would turn the one table
  this scenario is named after into the one table it does not actually check.
  SYSTEM-REC IS LISTED, and in this scenario it earns its place more than
  anywhere else: four operations run in order, each mutating the system record
  in memory -- anomaly A-17's move [sales/sl060.cbl:L1173] among them -- and each
  trading menu persists it on exit [sales/sales.cbl:L628-L657],
  [purchase/purchase.cbl:L621-L651], which the headless Python routes reproduce
  through args.overrewrite. Four sequential mutations are exactly the shape in
  which a lost or doubled update hides, and it can only be observed if the table
  is compared. Whether the two sides agree was MEASURED, not presumed (rule
  R-6): both end with a byte-identical row, all 169 columns.
  SYSDEFLT-REC AND SYSFINAL-REC REMAIN ABSENT FROM THE DECLARED LIST, on a
  ground that does not apply to SYSTEM-REC: neither trading menu rewrites them
  -- both exits touch keys 1 and 4 only, with no key-2 rewrite, unlike the
  General menu, which acas_posting/cli/args.py::overrewrite reproduces by
  writing key 2 only when the route loaded the defaults record -- and no
  statement on any of these four routes changes their content. They are still
  read and diffed, because the bound is all 22 in-scope tables, so they are
  expected to match their seeded values on both sides.

  gl_end_of_cycle IS DELIBERATELY NOT APPENDED TO THIS SCENARIO
  Appending the end-of-cycle operation was considered and DECLINED, on six
  grounds each backed by something readable in this checkout. The decision is
  recorded here so that it is not re-litigated, and it is oracle-reversible:
  docs/migration/ambiguity-resolutions.md is where it would be revisited, and
  the only thing that could reverse it is measured compiled behaviour.
    ONE. The mandated scenario set of the Agent Action Plan contains no
    end-of-cycle case. Adding one would add a scenario the protocol does not
    ask for, to the file whose subject is something else.
    TWO. The nine period-total sites are the sole writers of the totals
    record, which is what makes THIS scenario verifiable by inspecting one
    table. Appending a fifth operation that touches other tables dilutes
    exactly the property the scenario is built on.
    THREE. gl080 WRITES NO PERIOD TOTAL. Searching general/gl080.cbl for any
    of the nine target fields returns nothing, so the append would add no
    tenth site and could not strengthen the claim.
    FOUR. THIS SCENARIO'S AFFECTED-TABLE LIST WOULD HAVE TO GROW BY THREE. gl080
    mutates the accounting cycle at [general/gl080.cbl:L334],
    [general/gl080.cbl:L360] and [general/gl080.cbl:L363], and the quarter
    counter at [general/gl080.cbl:L355] and [general/gl080.cbl:L357], the
    latter being [copybooks/wssystem.cob:L110] -- all inside the system
    record -- and separately stamps GLBATCH-REC and rewrites GLLEDGER-REC.
    Appending it would mean this file bounded fifteen tables for the totals
    claim and three more for an unrelated one.
      A CORRECTION WORTH RECORDING, BECAUSE THE WRONG READING IS PLAUSIBLE. It is
      tempting to argue that "gl080's OWN STATE CHANGES CANNOT BE PERSISTED BY THE
      PYTHON SIDE" and that comparing them would be "an unavoidable divergence dressed
      up as a test". THAT IS WRONG, and measurement is what shows it (rule R-6). The system record IS persisted on both sides: the menu exit does it
      at [general/general.cbl:L656-L692] and the headless route reproduces that
      same paragraph as args.overrewrite in
      acas_posting/cli/gl_end_of_cycle.py. A dedicated end_of_cycle_gl scenario
      compared SYSTEM-REC and found the cycle advance and the quarter wrap
      byte-identical on the two sides -- measured, and then removed with that
      scenario, the tree being held to the Agent
      Action Plan's eight definitions. The ground is corrected rather than
      deleted because a reader who acted on the old claim would have concluded
      the comparison was impossible; it is not, and the measurement showed so.
    FIVE. ITS ARCHIVE PATH WOULD PUT A HOST FILESYSTEM PATH INTO A SCENARIO
    FILE. The archiving walk enters disk-change [general/gl080.cbl:L519],
    reaches accept-option [general/gl080.cbl:L542], accepts a single digit
    [general/gl080.cbl:L545], leaves on nine [general/gl080.cbl:L546-L547] and
    RE-PROMPTS on anything that is not zero
    [general/gl080.cbl:L548-L549] -- only zero proceeds -- and then accepts a
    path [general/gl080.cbl:L553-L555] and RE-PROMPTS AGAIN if its first
    character is a space [general/gl080.cbl:L556-L557]. Pinning a path here
    would carry a host identity into a file that is required to have none
    (rule R-6).
    SIX. THE ANOMALIES THAT WOULD JUSTIFY THE APPEND HAVE A HOME ELSEWHERE.
    A-2, the unbounded quarter subscript -- computed by a rounded divide at
    [general/gl080.cbl:L328] and then used as an array subscript with NO bounds
    check at [general/gl080.cbl:L345] -- stays in the arithmetic parity suite,
    because driving an out-of-range subscript through the COMPILED oracle would
    be a write into adjacent storage whose effect is undefined. A-3, the second
    and independent rotating quarter counter at [general/gl080.cbl:L355-L357],
    is pinned in the SAME suite --
    tests/arithmetic/test_gl080_cycle_divide_rounded.py's
    test_a3_current_quarter_rotates_independently_of_a and its siblings, which
    make the counter and the subscript disagree and require that the subscript
    write Q1 while the counter writes Ledger-Last and leaves Q4 alone. The
    unit-level pin is the whole of it, and it is stated here rather than left to
    be discovered.
  CONSEQUENCE, STATED PLAINLY: gl_end_of_cycle is NOT appended to THIS file, and
  the six grounds above are why. NO committed definition drives it, because the
  Agent Action Plan's inventory names EIGHT scenario definitions and this tree is
  held to it -- so gl080 has no table-state comparison behind it, and its coverage
  is the arithmetic tier's, per ground SIX. Appending the operation here would be
  wrong for grounds ONE through FIVE regardless.
  `period` remains an INERT value HERE -- carried because it is part of the
  seeded system record and because the key set is uniform, not because any
  operation listed in THIS file divides by it. It is emphatically not inert in
  gl080 itself, where `divide scycle by period giving a rounded`
  [general/gl080.cbl:L328] is what selects the quarter.

  THE SEED CONTRACT -- WHAT EACH OF THE NINE FLAT FILES MUST CARRY
  The seeder reproduces the frozen loader contract of
  [common/masterLD.sh:L93-L116], with the system-file block first, and the
  scenario's seed directory is resolved RELATIVE to the directory holding this
  file. Every money amount lives in these flat files as decimal text in the
  frozen record layout; none of them appears as a YAML scalar anywhere (rule
  R-2). Nothing below is arranged to make the totals come out tidy: the point
  is that they come out exactly as the compiled programs make them come out
  (rule R-4).
    system.dat -- the block at [common/masterLD.sh:L51] onwards, which runs
      systemLD, then sys4LD, then finalLD, then dfltLD, in that fixed order.
      SYS4LD IS WHAT LOADS SYSTOT-REC, this file's focal table, so the seeded
      row must start from a KNOWN NON-ZERO state: accumulating onto zero would
      make an accumulation indistinguishable from a fresh insert. The record
      must carry File-System-Used as one, a non-zero Cyclea, period one, date
      form one, IRS-Instead a SPACE, Level-1 one, SL-Autogen and PL-Autogen
      spaces, S-FLAG-P TWO AND P-FLAG-P TWO, and the RDBMS credential fields
      described under the credential precondition below.
    analysis.dat -- [common/masterLD.sh:L93]. Every analysis code the seeded
      invoices reference, on BOTH sides, or the indexed reads will not find
      them and the run stops short of the sites that matter.
    value.dat -- [common/masterLD.sh:L116]. Likewise every value code,
      including the Purchase groups selected by system byte
      [purchase/pl055.cbl:L403].
    salesled.dat -- [common/masterLD.sh:L112]. At least one customer carrying
      TWO INVOICES, ONE CREDIT NOTE AND ONE PAYMENT, so that both Sales
      average blocks and the Sales payment average are all reached. Its seven
      binary-long statistics fields [copybooks/wssl.cob:L46-L52] and two money
      fields [copybooks/wssl.cob:L54-L55] must be set so that the A-8
      truncation is VISIBLE -- that is, so an accumulation receives a value
      with non-zero pence and a divide leaves a non-zero remainder.
    invoice.dat -- [common/masterLD.sh:L98], loading SAINVOICE-REC and
      SAINV-LINES-REC together. Headers whose live-status byte is "L", NOT
      pending and NOT already analysed-and-applied, so that they survive
      sl055's filters [sales/sl055.cbl:L427-L436]; at least one of type two,
      for SITE 1, and at least one of type three, for SITE 2. Optionally one
      proforma of type four so that the skip at
      [sales/sl055.cbl:L430-L431] is exercised rather than assumed.
    openitm3.dat -- [common/masterLD.sh:L104]. At least one OPEN credit note,
      type three and not closed, so that ba000-Cr-Swop fires and SITE 4 is
      non-zero; at least one payment row of type five so that SITE 5 fires;
      optionally a type-six row so the else-branch at
      [sales/sl100.cbl:L407-L410] is covered; and a late deduction so that
      SITE 3 is non-zero rather than an add of zero.
    purchled.dat -- [common/masterLD.sh:L111]. The supplier mirror: two
      invoices, one credit note and one payment, for the SAME supplier, so
      that both Purchase average blocks and the Purchase payment average are
      reached and the A-9 mirror's missing increment is observable.
    pinvoice.dat -- [common/masterLD.sh:L107], loading PUINVOICE-REC and
      PUINV-LINES-REC. At least one of type two for SITE 6 and one of type
      three for SITE 7. NOTE THE ASYMMETRY: pl055 has neither a proforma nor a
      pending filter, so a type-four row here is NOT skipped the way its Sales
      counterpart is.
    openitm5.dat -- [common/masterLD.sh:L105]. At least one open credit note,
      so that SITE 8 is non-zero AND the suppressed second apportionment pass
      of A-NEW-1 is exercised; and at least one payment row of type five so
      that SITE 9 fires.
  SEEDED BY NOTHING, EVER: the EIGHT OUT-OF-SCOPE NAMES of the same frozen
  contract. The two automatic-generation files, the Sales one at
  [common/masterLD.sh:L113] and the Purchase one at
  [common/masterLD.sh:L108], are excluded by the decision recorded above; the
  other six -- the two despatch-note files at
  [common/masterLD.sh:L95] and [common/masterLD.sh:L96], the despatch file at
  [common/masterLD.sh:L97], the purchase-payments file at
  [common/masterLD.sh:L106], and the stock audit and stock control files at
  [common/masterLD.sh:L114] and [common/masterLD.sh:L115] -- belong to
  subsystems this cycle does not reach. Each is named by its locator rather
  than by its filename, so that a search for a forbidden fixture name finds
  nothing in this file.
  AND system.dat IS EFFECTIVELY MANDATORY, not merely useful: without a system
  record the menu calls the parameter-setup program INTERACTIVELY
  [general/general.cbl:L385-L394], which on a headless runner is a hang rather
  than an error.


  THE CREDENTIAL PRECONDITION -- CANNOT BE SATISFIED FROM THIS DIRECTORY
  The compiled side does not take connection details from a command line. It
  reads them out of the system record it was seeded with:
  RDBMS-DB-Name, RDBMS-User and RDBMS-Passwd at
  [copybooks/wssystem.cob:L137-L139], and RDBMS-Port, RDBMS-Host and
  RDBMS-Socket at [copybooks/wssystem.cob:L142-L144]. Every handler copies
  that group into the connection block before dispatching -- for example
  [common/acas012.cbl:L641] on the customer handler -- and the block it copies
  into is RDB-Data [copybooks/wsfnctn.cob:L56], whose fields are DB-Schema
  [copybooks/wsfnctn.cob:L57], DB-UName [copybooks/wsfnctn.cob:L58], DB-UPass
  [copybooks/wsfnctn.cob:L59], DB-Host [copybooks/wsfnctn.cob:L60], DB-Socket
  [copybooks/wsfnctn.cob:L61] and DB-Port [copybooks/wsfnctn.cob:L62].
  THREE OF THEM HOLD AT MOST TWELVE CHARACTERS, so a longer value is silently
  shortened by the move into it and the compiled leg would then connect as a
  DIFFERENT ACCOUNT from the migrated leg -- and two captures taken as
  different accounts are not comparable at all.
  SO THE DATABASE ENVIRONMENT THE PYTHON SIDE USES MUST MATCH THE CREDENTIAL
  FIELDS INSIDE THE SEEDED system.dat. That cannot be expressed in this file
  and is deliberately not attempted here: no credential of any kind appears in
  this directory. It is a property of the seed fixture and of the environment
  the runners are given.

  THE OTHER PRECONDITIONS, EACH A HANG RISK RATHER THAN A CLEAN FAILURE
  Stated briefly, because on a headless runner each of these stops the run
  without producing a comparison.
    The menu shells require the curses exception environment
    [general/general.cbl:L369-L370] and refuse to run below a 24 by 80
    terminal, checking lines and then columns and gobacking on either
    [general/general.cbl:L374-L383]. Note that pl055 ITSELF tolerates a
    shorter terminal, folding the value up to 24
    [purchase/pl055.cbl:L249-L254], but the menu that dispatches it does not,
    so the menu's minimum is the binding one.
    A missing system record makes the menu call the setup program
    interactively [general/general.cbl:L385-L394].
    A zero accounting cycle diverts to system setup
    [general/general.cbl:L462-L463].
    AUTOCOMMIT MUST BE OFF WHILE SEEDING. The batch loader says so in its own
    header, that it uses commit and rollback so autocommit must be off in the
    relational settings, and that it is on by default
    [common/glbatchLD.cbl:L9-L12]. The seeded state depends on those commit
    boundaries.

  THE ACCEPTANCE PROTOCOL
  TEN stages, one scenario at a time and nothing alongside it.
  `harness/normalize.py --print-stages' is the registry and the authority. The
  two stages a reader would not guess are stage 5, which re-seeds THE SAME
  FIXTURE BYTES so the Python cycle starts from the state the COBOL cycle
  started from rather than the state it left, and stage 9, which verifies both
  captures are published BEFORE a single row is compared, because two PARTIAL
  captures produce an empty diff and so pass a comparison that compared nothing.
  harness/build_oracle.sh and harness/seed.sh --build-fixtures precede stage 1
  and are not stages: the first runs once per image, the second once per change
  to a scenario's seed records.
  FOR THIS SCENARIO, stages 2 and 6 each drive FOUR OPERATIONS IN THE DECLARED
  ORDER inside ONE invocation of their runner. Both runners resolve the ordered
  `operations:' list and drive every entry sequentially, re-selecting the
  operation -- and with it the menu, the executable and the keystroke plan --
  before each one. There is no dump between the four, because the scenario's
  subject is the state the whole declared sequence produces.
  The diff must be EMPTY. That is the pass condition and the evidence is
  recorded in
  docs/migration/scenario-diff-evidence.md.
  WHAT AN EMPTY DIFF PROVES HERE, SPECIFICALLY: that all nine period-total
  accumulations landed on IDENTICAL VALUES in SYSTOT-REC -- through the A-8
  double truncation, through the A-9 missing increments on both credit-note
  paths, through A-10's three disagreeing guards -- whose third instance spells
  its divide the other way round and computes the same value -- and
  through the two write sites that add unconditionally where a reader would
  expect them to be guarded. It also proves the two ledgers' own tables agree,
  that the transfer table came back exactly as seeded, and that the four
  automatic-generation tables are still empty.
  Two runs of this scenario under the same pinned clock must additionally
  produce byte-identical captures; that is what the determinism suite asserts.
  BECAUSE BOTH CASH LATCHES ARE ONE-SHOT, the reset-and-re-seed stage is what
  makes the second leg comparable to the first at all -- without it operations
  2 and 4 would post nothing on the second leg and the diff would be empty for
  the wrong reason.
  This file's consumers are all in the checkout: the four documents under
  docs/migration/, the eight modules under tests/scenarios/ and
  harness/run_python_scenario.sh. Its seed FLAT FILES are not: the records are
  declared above under seed_records and harness/seed.sh --build-fixtures builds
  the files inside the image, because fifteen of the seventeen frozen loaders
  read ORGANIZATION INDEXED or RELATIVE files whose on-disk form belongs to the
  Berkeley DB version that image carries.

  THE CONSUMER CONTRACT -- WHY SOME VALUES APPEAR UNDER TWO KEYS
  This file serves consumers with two different reading strategies, so a few
  values are published under both a grouped and a flat key. THE PAIRS ARE
  ADJACENT AND MUST ALWAYS HOLD THE SAME VALUE; they are written side by side
  precisely so that any drift is visible at a glance.
    clock.to_day        and run_date_text
    clock.run_date      and run_date_binary
    system.date_form    and date_form
    system.irs_instead  and irs_instead
    seed.data_dir       and seed_dir
    seed.files          and seed_files
    operations item one and operation
  The reason is measured, not assumed. The COBOL runner reads this file with a
  plain reader that accepts TOP-LEVEL KEYS ONLY, with no leading whitespace
  before the key, so a value nested under clock, system or seed is INVISIBLE to
  it; the Python runner parses the whole document but REFUSES a nested block
  under any key it actually consumes, because a block would read as empty and
  change the run without saying so. The grouped blocks are the documented shape
  and carry the values that have no flat consumer at all -- file_system_used,
  cyclea, period, sl_autogen, pl_autogen, s_flag_p and p_flag_p are assertions
  about the SEEDED RECORD rather than command-line inputs, which is why the
  Python entry points expose no option for them.
  operations IS A FLAT SEQUENCE OF OPERATION NAMES and holds nothing else --
  no per-item subsystem, no per-item answer map, no per-item expectation --
  because each runner owns the operation-to-subsystem map itself and because a
  nested block under this key is refused outright. THIS FILE IS THE ONLY ONE
  WITH MORE THAN ONE ITEM IN IT. expected_status is a flat sequence of whole
  process statuses matching it POSITIONALLY, one per operation, and the
  singular operation key names the FIRST of them as a fallback that neither
  runner reaches while this list is present. The scenario NAME is published
  once, as name, and the COBOL runner falls back to this file's own basename,
  so the two agree by construction: name equals period_end_totals equals the
  file stem.
  ANSWER KEYS ARE SEMANTIC and are never a copy of a command-line option
  spelling, because the option spellings belong to the entry points and are
  discovered from them rather than guessed here. THIS FILE PROMOTES ONE ANSWER,
  payment_post_confirm, AND IT COVERS BOTH CASH ROUTES: one invocation drives
  all four operations, both cash programs ask the same question, and both
  refuse to proceed without an answer, so one key answers both. Its value must
  be YES or NO and there is NO DEFAULT, because the frozen programs have none
  -- each blanks the reply field immediately before accepting it
  [sales/sl100.cbl:L313], [purchase/pl100.cbl:L305] and each RE-ASKS ON A
  BLANK [sales/sl100.cbl:L318-L319],
  [purchase/pl100.cbl:L310-L311]. NO transfers to menu-exit before the first
  file is opened, so declining would post nothing at all; YES is what makes
  sites five and nine reachable. The prompt WORDING differs between the two
  programs, right down to the bracket glyphs
  [sales/sl100.cbl:L311-L312] versus [purchase/pl100.cbl:L303-L304], and that
  divergence is preserved rather than harmonised.
  THE THREE OTHER ANSWER KEYS ARE NOT DECLARED, because none of their routes is
  on this path: the transfer-file clear belongs to the IRS route, and the two
  end-of-cycle answers belong to the operation this file deliberately omits.
  Leaving them unstated is what keeps this scenario's inputs exactly the inputs
  the frozen cycle takes. The invoice and order routes promote NOTHING: sl055
  and sl060 have only diagnostic acknowledgements, and pl060's own confirmation
  prompt is ENTIRELY COMMENTED OUT [purchase/pl060.cbl:L362-L370], so there is
  no question left on that route to answer.
  subsystem IS THE EMPTY SCALAR HERE AND NOWHERE ELSE, for the reason given
  under its own heading above; it is the one key whose value differs in kind
  from its seven siblings, and it differs because this is the one file that
  spans two menus.

  LOCATOR PROVENANCE
  Every line number cited above was read out of the frozen source in this
  checkout; docs/migration/traceability.md carries the corrected-locator record.
  Four spans are cited only here: the Purchase order-post dispatch paragraph is
  [purchase/purchase.cbl:L752] with its commented-out autogen call and gate at
  [purchase/purchase.cbl:L755-L758] and the four program dispatches at
  [purchase/purchase.cbl:L759-L762]; the type-six else-branch in pl100 ends at
  [purchase/pl100.cbl:L402]; the batch loader's autocommit caveat is
  [common/glbatchLD.cbl:L9-L12]; and the menu's terminal-size check begins at
  [general/general.cbl:L374]. G-L is a condition name on the installed-ledger
  level byte at [copybooks/wssystem.cob:L85] and NOT on the fan-out switch at
  [copybooks/wssystem.cob:L179-L181], which is what makes pure General Ledger mode
  two seeded fields rather than one and what makes anomaly A-PL100-A legible.
  THE FROZEN SOURCE IS READ AND NEVER EDITED: any diff under common, copybooks,
  general, sales, purchase, irs, stock or mysql is a defect in the migration
  however harmless it looks.
# THE ONE KEY WHOSE VALUE DIFFERS IN KIND FROM ITS SEVEN SIBLINGS. This
# scenario spans TWO menus, and the oracle-side runner refuses a file whose
# subsystem disagrees with the subsystem of the operation it was asked to run
# [harness/run_cobol_scenario.sh acas_select_operation]. Its map sends sl_invoice_post
# and sl_cash_post to the Sales menu and pl_order_post and pl_payment_post to
# the Purchase menu, so no single name is true for all four operations and
# naming either menu would fail two of the four invocations on a cross-check
# rather than on anything behavioural. The empty scalar is the only value that
# is true for a two-menu file, and the guard reads it as "the file does not
# say", so the subsystem comes from the operation being run. The key is kept
# rather than dropped so the key set stays identical across all eight files;
# nothing but that one cross-check reads it.
subsystem: ""

# THE COMPATIBILITY KEY, AND THE LOWEST-PRECEDENCE ONE. Both runners resolve
# the ordered `operations:' list below and drive every entry, in that order, in
# ONE invocation; both fall back to this singular key only when no list is
# present. So for this file it is read by NEITHER runner, and it names the first
# operation purely so that a reader who follows the fallback path arrives at a
# coherent single-operation run rather than at nothing.
#
# It is kept, rather than dropped, so the key set stays identical across all
# eight scenario files -- the other seven declare exactly one operation and are
# therefore indifferent to which key supplies it.
#
# The precedence is identical on both sides -- repeated --operation first, then
# `operations:', then this key -- at
# [harness/run_cobol_scenario.sh acas_resolve_operations] and
# [harness/run_python_scenario.sh acas_py_resolve_scenario], so one file cannot
# resolve to different lists on the two legs of a comparison.
operation: sl_invoice_post

clock:
  to_day: "21/09/2025"
  run_date: 155127

# Flat mirrors of the clock block, required by the oracle-side runner, which
# reads top-level keys only. The text is passed through unchanged; its digits
# are never reordered to match date_form.
run_date_text: "21/09/2025"
run_date_binary: 155127

system:
  file_system_used: 1
  cyclea: 1
  period: 1
  date_form: 1
  irs_instead: " "
  sl_autogen: " "
  pl_autogen: " "
  s_flag_p: 2
  p_flag_p: 2

# Flat mirrors of the two system values the COBOL runner reads directly. The
# fan-out switch must be PRESENT even though its value is a space: that space
# is what selects the General Ledger alone [copybooks/wssystem.cob:L179-L181]
# and, on this route, what makes anomaly A-PL100-A coherent at all
# [purchase/pl100.cbl:L566-L570].  A-PL100-A was formerly numbered A-NEW-5 in
# pl100_payment_posting.py alone; the register's A-NEW-5 is an unrelated
# defect, so this one now carries a globally unique name.
date_form: 1
irs_instead: " "

seed:
  data_dir: period_end_totals
  files:
    - system.dat
    - analysis.dat
    - value.dat
    - salesled.dat
    - invoice.dat
    - openitm3.dat
    - purchled.dat
    - pinvoice.dat
    - openitm5.dat

# Flat mirrors of the seed block, required by the seeder, which resolves a
# relative directory against the directory holding this file. The order here is
# membership only: the frozen loader order of [common/masterLD.sh:L93-L116] is
# what actually runs, with the system block first -- and within that block
# sys4LD, the step that loads this scenario's focal table.
seed_dir: period_end_totals
seed_files:
  - system.dat
  - analysis.dat
  - value.dat
  - salesled.dat
  - invoice.dat
  - openitm3.dat
  - purchled.dat
  - pinvoice.dat
  - openitm5.dat

# THE FOUR OPERATIONS, IN THE ONLY ORDER THAT IS CORRECT, and the only such
# list in this directory. A flat sequence of operation NAMES and nothing else:
# each runner owns the operation-to-subsystem map, so the subsystem is not
# restated per item, and a nested block under this key is refused outright.
# They run ONE AT A TIME, never together (rule R-3). The order is load-bearing:
# operation 3 sets flags operation 4 reads [purchase/pl060.cbl:L373-L375],
# operations 1 and 3 create the ledger rows operations 2 and 4 rewrite, and
# anomaly A-17's write [sales/sl060.cbl:L1173] is read back by a LATER
# operation [purchase/pl100.cbl:L564].
operations:
  - sl_invoice_post
  - sl_cash_post
  - pl_order_post
  - pl_payment_post

# The process status each operation is expected to end with, POSITIONALLY --
# one per operation, in the same order. Zero four times is provable rather than
# hopeful: the only code either extract program can raise is eight, and both
# wrap that block in if FS-Cobol-Files-Used [sales/sl055.cbl:L326],
# [sales/sl055.cbl:L344], [purchase/pl055.cbl:L266],
# [purchase/pl055.cbl:L286], so with file_system_used at one it is unreachable;
# the only other code the harness can observe is five, from
# [general/gl070.cbl:L289], which this file never runs. A status that
# contradicts this is reported as a behavioural difference and the capture is
# still taken, so the table diff can corroborate it (R-4).
expected_table_effect: changed

expected_status:
  - 0
  - 0
  - 0
  - 0

# THE ONE PROMOTED INTERACTIVE ANSWER, COVERING BOTH CASH ROUTES. Required by
# both runners for sl_cash_post and pl_payment_post and defaulted by neither,
# because the frozen programs have no default: each blanks the reply field
# immediately before the accept [sales/sl100.cbl:L313],
# [purchase/pl100.cbl:L305] and each re-asks for ever on a blank
# [sales/sl100.cbl:L318-L319], [purchase/pl100.cbl:L310-L311]. It gates EVERY
# database write those programs make -- NO transfers to menu-exit before the
# first file is opened -- so YES is what makes period-total sites five
# [sales/sl100.cbl:L404] and nine [purchase/pl100.cbl:L396] reachable, and
# without it this scenario would reach only seven of its nine sites. The key is
# SEMANTIC and is deliberately not a copy of the entry points' option spelling.
payment_post_confirm: "YES"

# WHAT `affected_tables` IS, AND WHAT IT IS NOT
#
# It is the DECLARED EFFECT of this scenario: the tables the runners assert
# changed or unchanged against `expected_table_effect`, in the order declared.
#
# It is NOT the bound of the comparison. The capture and the diff are bounded by
# ALL 22 IN-SCOPE TABLES -- `harness/dump_tables.py --all-in-scope` at stages 3
# and 7 and `harness/diff_states.py --all-in-scope` at stage 10, which
# both a hand-driven run and `tests/conftest.py` pass. A bound drawn from
# what a scenario EXPECTS to move cannot show a difference in anything it did not
# expect to move, and an empty diff is the single pass condition (AAP section
# 0.8.5). In particular both cycles perform the menu's own `overrewrite.'
# [general/general.cbl:L656-L672], which rewrites SYSTEM-REC under key 1,
# SYSDEFLT-REC under key 2 and SYSTOT-REC under key 4 -- reproduced by
# `acas_posting/cli/args.py::overrewrite' -- so those rows are compared on both
# sides rather than omitted.
affected_tables:
  - ANALYSIS-REC
  - GLBATCH-REC
  - GLPOSTING-REC
  - PSIRSPOST-REC
  - PUINV-LINES-REC
  - PUINVOICE-REC
  - PUITM5-REC
  - PULEDGER-REC
  - SAINV-LINES-REC
  - SAINVOICE-REC
  - SAITM3-REC
  - SALEDGER-REC
  - SYSTEM-REC
  - SYSTOT-REC
  - VALUEANAL-REC

# =============================================================================
# THE SEED RECORDS
# =============================================================================
# Built into the declared flat files by harness/dump_tables.py --make-fixtures, which generates a
# COBOL writer per file, compiles it against the FROZEN copybooks and calls the
# FROZEN handler to write. Field names are spelled exactly as the frozen copybook
# spells them, read from those definitions by the builder itself.
#
# EVERY VALUE IS A QUOTED STRING (rule R-2). COBOL's own MOVE performs the store, so
# the frozen picture clause decides alignment, truncation toward zero and sign.
#
# THIS IS THE ONLY SCENARIO THAT SPANS BOTH TRADING LEDGERS, so it is the only one
# whose analysis and value files carry BOTH system bytes: "S" for the Sales reads
# [sales/sl055.cbl:L380] and "P" for the Purchase reads [purchase/pl055.cbl:L316].
# A code present under one byte and absent under the other sends that ledger's read
# down the emergency-create path and the run stops measuring what it came to measure.
#
# WHAT THIS SEED HAS TO ACHIEVE, and it is the strictest of the eight because the
# focal table is written by NINE separate sites and every one of them ADDS:
#   * SYSTOT-REC must start NON-ZERO. Accumulating onto zero would make an
#     accumulation indistinguishable from a fresh insert, and this scenario exists to
#     compare accumulations. That is relative record "4" below.
#   * ONE CUSTOMER with TWO INVOICES, ONE CREDIT NOTE AND ONE PAYMENT, so that both
#     Sales average blocks [sales/sl060.cbl:L816], [sales/sl060.cbl:L832] and the
#     Sales payment average [sales/sl100.cbl:L497] are ALL reached.
#   * ONE SUPPLIER with the same shape, for the Purchase mirror.
#   * NON-ZERO activity counts and averages on both, so each guard takes its
#     RECONSTITUTING branch rather than its zeroing one, and NON-ZERO PENCE
#     everywhere, so the zero-decimal accumulator of A-8 actually discards something.
#     A ROUND-POUND SEED WOULD HIDE A-8 COMPLETELY.
#   * open credit notes on BOTH sides, so the fourth and eighth period totals are
#     non-zero and the suppressed second apportionment pass is exercised.
#   * payment rows of type 5 on both sides, so the fifth and ninth sites fire; a
#     type-6 row on the Sales side so the else-branch at
#     [sales/sl100.cbl:L405-L410] is covered rather than assumed; and a type-2 row
#     carrying a non-zero batch number AND item, which is what sends sl100 into
#     compute-sales-pay [sales/sl100.cbl:L341-L345] -- the variant with the SINGLE
#     guard, anomaly A-10. Its divide is spelled BY rather than INTO and computes the
#     same accumulator / counter value, so the guard is the divergence and the operand
#     order is not.
#   * LATE DEDUCTIONS on the open items, so the apportionment adds something rather
#     than adding zero.
# NOTHING BELOW IS ARRANGED TO MAKE THE TOTALS COME OUT TIDY (rule R-4).
seed_records:

  # system.dat IS FOUR DIFFERENT RECORDS IN ONE RELATIVE FILE, keyed by relative
  # record number -- [copybooks/selsys.cob] declares it ORGANIZATION RELATIVE with
  # relative key `rrn', and the four system loaders each go straight to one slot:
  #   "1"  systemLD [common/systemLD.cbl:L227] -> SYSTEM-REC    (the parameter record)
  #   "2"  dfltLD   [common/dfltLD.cbl:L221]   -> SYSDEFLT-REC  (wsdflt.cob)
  #   "3"  finalLD  [common/finalLD.cbl:L221]  -> SYSFINAL-REC  (wsfinal.cob)
  #   "4"  sys4LD   [common/sys4LD.cbl:L226]   -> SYSTOT-REC    (wssys4.cob)
  # All four are 1024 bytes and ALL FOUR MUST BE PRESENT: masterLD runs every one of
  # those loaders unconditionally [common/masterLD.sh:L50-L88] and the last is tested
  # against zero rather than 63 [common/masterLD.sh:L83-L86], so an unwritten slot
  # ABORTS the seed. Slot "4" IS THIS SCENARIO'S FOCAL TABLE.
  system.dat:
    "1":
